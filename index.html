<!doctype html>

<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: una columna de estudio (máx. 680px), tres pantallas: inicio · test · resultado */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18221d; --muted:#5d6b63; --line:#d9e0db;
  --accent:#1f5e46; --accent-soft:#e3eee8; --ok:#1d7a4a; --ok-soft:#e1f2e8; --bad:#b3362c; --bad-soft:#f8e4e1; --warn:#a46a10;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211d; --ink:#e6ece8; --muted:#97a69d; --line:#2c3832;
  --accent:#7cc4a2; --accent-soft:#1f3229; --ok:#6fd09a; --ok-soft:#173326; --bad:#f08a7e; --bad-soft:#3a1f1c; --warn:#e3b05a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --ink:#e6ece8; --muted:#97a69d; --line:#2c3832;
  --accent:#7cc4a2; --accent-soft:#1f3229; --ok:#6fd09a; --ok-soft:#173326; --bad:#f08a7e; --bad-soft:#3a1f1c; --warn:#e3b05a; color-scheme:dark}
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-read);font-weight:600;font-size:1.65rem;line-height:1.2}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{display:flex;flex-direction:column;gap:2px}
.summary b{font-family:var(--f-num);font-size:1.35rem;font-weight:500}
.summary span{font-size:.78rem;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:.85rem;font-weight:600}
.temas{display:flex;flex-direction:column}
.tema{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tema:first-child{border-top:0}
.tema input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.tema .t{min-width:0;display:flex;flex-direction:column;gap:5px}
.tema .t span{font-size:.9rem}
.tema .t small{color:var(--muted);font-size:.75rem}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}
.pct{font-family:var(--f-num);font-size:.8rem;color:var(--muted);min-width:3.2em;text-align:right}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:.85rem;font-weight:600}
.primary{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:13px 18px;font-weight:600;font-size:1rem;width:100%}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 16px;font-weight:500}
.note{font-size:.8rem;color:var(--muted)}
.resume{border-color:var(--accent);background:var(--accent-soft)}
/* quiz */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.top .row{justify-content:space-between}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qmeta{font-size:.8rem;color:var(--muted)}
.qtext{font-family:var(--f-read);font-size:1.13rem;line-height:1.55;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px}
.opt .l{font-family:var(--f-num);width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.opt .x{min-width:0;padding-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}.opt.sel .l{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .l{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.verdict{font-weight:600}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav .primary{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.grid button{font-family:var(--f-num);font-size:.78rem;padding:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--accent)}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok)}.grid button.bad{background:var(--bad-soft);border-color:var(--bad)}
.timer{font-family:var(--f-num);font-size:.85rem}
.timer.low{color:var(--warn)}
/* result */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-read);font-size:3rem;font-weight:600;line-height:1}
.review{display:flex;flex-direction:column;gap:12px}
.ritem{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.ritem p{margin:0}
.ritem .q{font-family:var(--f-read)}
.ritem .a{font-size:.88rem}
.ritem .a.bad{color:var(--bad)}.ritem .a.ok{color:var(--ok)}
.confirm{border-color:var(--bad);background:var(--bad-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const Q = [[1,1,"¿En qué se constituye España según la Constitución?",["En un Estado federal y democrático.","En un Estado social y democrático de Derecho.","En una monarquía absolutista.","En un Estado centralizado."],1],[2,1,"¿Cuáles son los valores superiores del ordenamiento jurídico según la Constitución?",["Libertad, justicia, igualdad y pluralismo político.","Igualdad, pluralismo político, seguridad y justicia.","Democracia, igualdad, legalidad y libertad.","Justicia, solidaridad, igualdad y legalidad."],0],[3,1,"La forma política del Estado, según el artículo 1.3 de la Constitución, es:",["La república democrática.","El Estado autonómico.","La monarquía parlamentaria.","La monarquía constitucional."],2],[4,1,"¿De dónde emanan los poderes del Estado según la Constitución?",["De la Constitución.","Del Rey.","Del Gobierno.","Del pueblo español."],3],[5,1,"La Constitución reconoce y garantiza:",["El derecho de secesión de las nacionalidades.","La autonomía de las nacionalidades y regiones que integran la Nación española.","La independencia de las comunidades autónomas.","La centralización administrativa del Estado."],1],[6,1,"Según la Constitución, los partidos políticos:",["Sustituyen al Parlamento.","Expresan el pluralismo político.","Dirigen el poder judicial.","Dependen del Gobierno."],1],[7,1,"Según la Constitución, señale la respuesta correcta respecto a los sindicatos de trabajadores y las asociaciones empresariales:",["Contribuyen a la defensa y promoción de los intereses económicos y sociales que les son propios.","Su creación debe ser autorizado por el Gobierno.","El ejercicio de su actividad será controlado por el Senado.","Su estructura interna y funcionamiento podrán ser democráticos."],0],[8,1,"Según la Constitución, los ciudadanos y los poderes públicos:",["Están sujetos a la Constitución y al resto del ordenamiento jurídico, salvo las leyes orgánicas.","Están sujetos a la Constitución y al resto del ordenamiento jurídico, salvo las leyes y los reglamentos.","Están sujetos a la Constitución y al resto del ordenamiento jurídico, salvo los reglamentos.","Están sujetos a la Constitución y al resto del ordenamiento jurídico."],3],[9,1,"La Constitución garantiza:",["La arbitrariedad de los poderes públicos.","La retroactividad de las normas sancionadoras no favorables o restrictivas de derechos individuales.","La seguridad jurídica.","El poder absoluto del Estado."],2],[10,1,"La Constitución garantiza:",["El principio de legalidad.","La horizontalidad normativa.","La irretroactividad de las disposiciones sancionadoras favorables.","La confidencialidad de las normas."],0],[11,1,"Según la Constitución, ¿cómo se interpretarán las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce?",["De conformidad con la jurisprudencia del Tribunal Supremo.","De conformidad con la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España.","Únicamente según el criterio del Tribunal Constitucional.","Según lo que dictaminen las Leyes Orgánicas que los desarrollen."],1],[12,1,"Según la Constitución la mayoría de edad se adquiere:",["A los dieciséis años.","A los dieciocho años.","A los veintiún años.","Cuando lo determine el Código Civil para cada caso concreto."],1],[13,1,"Según la Constitución, los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de:",["Nacimiento, raza, sexo, religión o lengua.","Nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.","Nacionalidad, raza, sexo, religión u opinión política.","Origen étnico, sexo, religión, convicciones o edad."],1],[14,1,"Según la Constitución, todos tienen derecho a la vida y a la integridad física y moral, sin que, en ningún caso, puedan ser sometidos a:",["Penas de prisión superiores a treinta años.","Pruebas biológicas.","Trabajos forzados o esclavitud moderna.","Tortura ni a penas o tratos inhumanos o degradantes."],3],[15,1,"Según la Constitución, ¿qué establece el artículo 16.3 respecto a la confesión del Estado?",["Ninguna confesión tendrá carácter estatal.","El Estado es católico por tradición histórica.","El Estado cooperará únicamente con la Iglesia Católica.","Los poderes públicos no tendrán en cuenta las creencias religiosas de la sociedad."],0],[16,1,"Según la Constitución, la detención preventiva NO podrá durar más del tiempo estrictamente necesario para la realización de las averiguaciones tendentes al esclarecimiento de los hechos, y, en todo caso, en el plazo máximo de:",["Veinticuatro horas.","Cuarenta y ocho horas.","Setenta y dos horas.","Cinco días naturales."],2],[17,1,"Según la Constitución, ¿en qué casos se puede entrar o registrar un domicilio sin el consentimiento del titular?",["Por orden de la autoridad gubernativa o en caso de urgencia.","En caso de flagrante delito o resolución judicial.","Siempre que exista una investigación policial en curso.","Solo mediante resolución judicial firme."],1],[18,1,"Según la Constitución, ¿en qué supuesto se podrá acordar el secuestro de publicaciones, grabaciones y otros medios de información?",["Por decisión del Ministerio del Interior.","Mediante resolución administrativa motivada.","En virtud de resolución judicial.","Cuando atenten contra la moral pública."],2],[19,1,"Según la Constitución, en los casos de reuniones en lugares de tránsito público y manifestaciones, se dará comunicación previa a la autoridad, que sólo podrá prohibirlas cuando:",["Existan razones fundadas de alteración del orden público, con peligro para personas o bienes.","El número de asistentes sea superior a 100 personas.","Coincidan con un periodo de campaña electoral.","Entorpezcan gravemente la circulación de vehículos."],0],[20,1,"Según la Constitución, las asociaciones que persigan fines o utilicen medios tipificados como delito son:",["Sancionables administrativamente.","Ilegales.","Legales, aunque nulas de pleno derecho.","Suspendibles por el Ministerio del Interior."],1],[21,1,"Según la Constitución, los ciudadanos tienen derecho a acceder en condiciones de igualdad a las funciones y cargos públicos, con los requisitos que señalen:",["Los reglamentos de las Cámaras.","Los Gobiernos autonómicos y locales.","Las autoridades judiciales.","Las leyes."],3],[22,1,"Según la Constitución, las penas privativas de libertad y las medidas de seguridad estarán orientadas hacia:",["El castigo ejemplarizante y la retribución.","El aislamiento del delincuente de la sociedad.","La reparación del daño a la víctima.","La reeducación y reinserción social."],3],[23,1,"Según la Constitución, la enseñanza básica es:",["Obligatoria y gratuita.","Gratuita hasta los doce años.","Obligatoria hasta los catorce años.","Obligatoria, gratuita y católica."],0],[24,1,"Según la Constitución, se reconoce el derecho a la huelga de los trabajadores para la defensa de sus intereses. La ley que regule el ejercicio de este derecho establecerá las garantías precisas para asegurar:",["El derecho al trabajo de los no huelguistas.","El mantenimiento de los servicios esenciales de la comunidad.","La seguridad de las instalaciones productivas.","El pago de los salarios durante el conflicto."],1],[25,1,"Según la Constitución, todos contribuirán al sostenimiento de los gastos públicos de acuerdo con su capacidad económica mediante un sistema tributario justo inspirado en los principios de:",["Igualdad y proporcionalidad.","Igualdad y progresividad.","Solidaridad y eficiencia.","Equidad y suficiencia."],1],[26,1,"Según la Constitución, nadie podrá ser privado de sus bienes y derechos:",["Sino por causa justificada de utilidad pública o interés social mediante la correspondiente indemnización y de conformidad con lo dispuesto por las leyes.","Salvo los bienes y derechos adquiridos mediante herencia.","Salvo las personas mayores de 50 años sin menores dependientes.","En ningún caso."],0],[27,1,"Según la Constitución, los padres deben prestar asistencia de todo orden a los hijos habidos dentro o fuera del matrimonio:",["Hasta que alcancen la mayoría de edad.","Mientras convivan en el domicilio familiar.","Hasta que finalicen sus estudios superiores.","Durante su minoría de edad y en los demás casos en que legalmente proceda."],3],[28,1,"Según la Constitución, ¿qué aspecto deben garantizar los poderes públicos mediante la limitación de la jornada laboral y las vacaciones periódicas retribuidas?",["El derecho a la conciliación familiar y laboral.","El incremento de la productividad nacional.","El descanso necesario.","La reducción de los accidentes de trabajo."],2],[29,1,"Según la Constitución, se reconoce el derecho a la protección de la salud. Compete a los poderes públicos organizar y tutelar la salud pública a través de:",["La creación de hospitales públicos en cada municipio.","El control de precios de los medicamentos.","Medidas preventivas y de las prestaciones y servicios necesarios.","La gestión directa de todos los centros sanitarios."],2],[30,1,"Según la Constitución, todos tienen el derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, así como:",["El deber de conservarlo.","El deber de denunciar a los infractores.","El derecho a recibir indemnizaciones por contaminación.","El deber de reciclar los residuos domésticos."],0],[31,2,"Las Cortes Generales están formadas por:",["El Congreso de los Diputados, el Gobierno y el Tribunal Constitucional.","El Congreso de los Diputados, el Senado y el Consejo General del Poder Judicial.","El Congreso de los Diputados y el Gobierno.","El Congreso de los Diputados y el Senado."],3],[32,2,"Ejercen la potestad legislativa del Estado, aprueban sus Presupuestos, controlan la acción del Gobierno y tienen las demás competencias que les atribuya la Constitución:",["Las Cortes Generales.","El Tribunal Constitucional y el Tribunal Supremo.","Los partidos políticos de la oposición.","Las Cortes Generales y el Tribunal Constitucional."],0],[33,2,"Señale la respuesta correcta sobre el Congreso:",["Se compone de un mínimo de 300 y un máximo de 400 Diputados, elegidos por sufragio universal, libre, igual, directo y secreto, en los términos que establezca la ley.","Es la Cámara de representación territorial.","La circunscripción electoral es la comunidad autónoma.","Es elegido por cinco años."],0],[34,2,"Señale la respuesta correcta sobre el Senado:",["Se compone de un mínimo de 300 y un máximo de 400 Diputados, elegidos por sufragio universal, libre, igual, directo y secreto, en los términos que establezca la ley.","Es la Cámara de representación territorial.","La circunscripción electoral es la comunidad autónoma.","Es elegido por cinco años."],1],[35,2,"Según la Constitución, son leyes orgánicas:",["Las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que regulan el procedimiento administrativo común y el régimen electoral general y las demás previstas en la Constitución.","Las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que aprueben los Estatutos de Autonomía y el régimen electoral general y las demás previstas en la Constitución.","Las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que aprueben los Estatutos de Autonomía y el régimen electoral general, las relativas a cuestiones medio ambientales y las demás previstas en la Constitución.","Las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las relativas a cuestiones medioambientales y las demás previstas en la Constitución."],1],[36,2,"La aprobación, modificación o derogación de las leyes orgánicas:",["Exigirá mayoría simple del Congreso, en una votación final sobre el conjunto del proyecto.","Exigirá mayoría simple del Senado, en una votación final sobre el conjunto del proyecto.","Exigirá mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto.","Exigirá mayoría absoluta del Senado, en una votación final sobre el conjunto del proyecto."],2],[37,2,"Las Cortes Generales:",["Podrán delegar en el Gobierno la potestad de dictar normas con rango de ley sobre materias determinadas no incluidas en el artículo 81 que recibirán el título de Decretos Legislativos.","Podrán delegar en el Gobierno la potestad de dictar normas con rango de ley sobre materias determinadas no incluidas en el artículo 81 que recibirán el título de Decretos-Leyes.","Podrán delegar en el Gobierno la potestad de dictar normas con rango de ley sobre cualquier materia que recibirán el título de Decretos Legislativos.","Podrán delegar en el Gobierno la potestad de dictar normas con rango de ley sobre cualquier materia que recibirán el título de Decretos-Leyes."],0],[38,2,"Según la Constitución Española, en caso de extraordinaria y urgente necesidad, el Gobierno podrá dictar disposiciones legislativas provisionales que:",["Tomarán la forma de Decretos Legislativos y que no podrán afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades de los ciudadanos regulados en el Título I de la Constitución, al régimen de las Comunidades Autónomas ni al Derecho electoral general.","Tomarán la forma de Decretos Legislativos y que podrán afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades de los ciudadanos regulados en el Título I de la Constitución, al régimen de las Comunidades Autónomas y al Derecho electoral general.","Tomarán la forma de Decretos-leyes y que podrán afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades de los ciudadanos regulados en el Título I de la Constitución, al régimen de las Comunidades Autónomas y al Derecho electoral general.","Tomarán la forma de Decretos-leyes y que no podrán afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades de los ciudadanos regulados en el Título I de la Constitución, al régimen de las Comunidades Autónomas ni al Derecho electoral general."],3],[39,2,"Señale la respuesta INCORRECTA respecto a la iniciativa legislativa:",["La iniciativa legislativa corresponde al Gobierno, al Congreso y al Senado, de acuerdo con la Constitución y los Reglamentos de las Cámaras.","Las Asambleas de las Comunidades Autónomas podrán solicitar del Gobierno la adopción de un proyecto de ley o remitir a la Mesa del Congreso una proposición de ley, delegando ante dicha Cámara un máximo de tres miembros de la Asamblea encargados de su defensa.","Una ley orgánica regulará las formas de ejercicio y requisitos de la iniciativa popular para la presentación de proposiciones de ley. En todo caso se exigirán no menos de 500.000 firmas acreditadas.","La iniciativa popular procederá únicamente en materias propias de ley orgánica, tributarias o de carácter internacional."],3],[40,2,"Aprobado un proyecto de ley ordinaria u orgánica por el Congreso de los Diputados:",["Su Presidente dará inmediata cuenta del mismo al Presidente del Senado, el cual lo someterá a la deliberación de éste.","El Rey la sancionará y promulgará en el plazo de quince días y ordenará su inmediata publicación.","Su Presidente dará inmediata cuenta del mismo al Presidente del Gobierno, el cual ordenará su publicación inmediata.","Su Presidente dará inmediata cuenta del mismo al Consejo de Ministros, que deberá iniciar los trámites para su aprobación por el Senado."],0],[41,2,"Según la Constitución, se podrá autorizar la celebración de tratados por los que se atribuya a una organización o institución internacional el ejercicio de competencias derivadas de la Constitución:",["Mediante ley.","Mediante ley orgánica.","Mediante ley de bases.","Mediante ley marco."],1],[42,2,"Según la Constitución, la prestación del consentimiento del Estado para obligarse por medio de tratados políticos requerirá la previa autorización de:",["El Gobierno.","El Congreso.","El Senado.","Las Cortes Generales."],3],[43,2,"Según la Constitución, el Gobierno:",["Ejerce la función legislativa y la potestad reglamentaria de acuerdo con la Constitución y las leyes.","Ejerce la función legislativa y ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes.","Ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes.","Ejerce la función ejecutiva y delega la potestad reglamentaria a las Cortes Generales de acuerdo con la Constitución y las leyes."],2],[44,2,"Según la Constitución, el Gobierno se compone de:",["El Presidente, de los Vicepresidentes, en su caso, de los Ministros y de los demás miembros que establezca la ley.","El Presidente, de los Vicepresidentes, en su caso, de los Ministros, que no podrán ser más de ocho y de los demás miembros que establezca la ley.","El Presidente, de los Vicepresidentes, en su caso, de los Ministros, que no podrán ser más de diez y de los demás miembros que establezca la ley.","El Presidente, cinco diputados y cinco senadores nombrados por el Presidente."],0],[45,2,"Según la Constitución, después de cada renovación del Congreso de los Diputados, el Rey, previa consulta con los representantes designados por los grupos políticos con representación parlamentaria, y a través del Presidente del Congreso, propondrá un candidato a:",["La Presidencia de las Cortes.","La Presidencia del Gobierno.","La Jefatura del Estado.","El Consejo de Ministros."],1],[46,2,"Según la Constitución, los demás miembros del Gobierno serán nombrados y separados por el Rey, a propuesta de:",["Las Cortes Generales.","El Presidente del Gobierno.","El Consejo de Estado.","Los partidos de la oposición."],1],[47,2,"Según la Constitución, el Gobierno cesa tras la celebración de elecciones generales, en los casos de pérdida de la confianza parlamentaria previstos en la Constitución, o por:",["Disolución de las Cortes Generales por el Rey.","Dimisión o fallecimiento de su Presidente.","Dimisión o fallecimiento de la mayoría de sus miembros.","Petición de tres quintos del Senado."],1],[48,2,"Según la Constitución, la Administración Pública sirve con objetividad los intereses generales y actúa de acuerdo con los principios de:",["Eficiencia, jerarquía, centralización, concentración y coordinación.","Eficiencia, horizontalidad, descentralización, desconcentración y coordinación.","Eficacia, jerarquía, centralización, concentración y coordinación.","Eficacia, jerarquía, descentralización, desconcentración y coordinación."],3],[49,2,"La ley regulará el estatuto de los funcionarios públicos, el acceso a la función pública de acuerdo con los principios de:",["Capacidad y antigüedad.","Mérito y antigüedad.","Mérito y capacidad.","Capacidad, mérito y antigüedad."],2],[50,2,"Según la Constitución, la ley regulará la audiencia de los ciudadanos, directamente o a través de las organizaciones y asociaciones reconocidas por la ley, en el procedimiento de elaboración de:",["Las disposiciones administrativas que les afecten.","Las Leyes Orgánicas.","Los Tratados Internacionales.","Los Presupuestos Generales del Estado."],0],[51,2,"Los particulares, en los términos establecidos por la ley, tendrán derecho a ser indemnizados por toda lesión que sufran en cualquiera de sus bienes y derechos, salvo en los casos de fuerza mayor, siempre que la lesión sea consecuencia de:",["El funcionamiento de los servicios públicos.","Una negligencia grave de la autoridad judicial.","Una ley declarada inconstitucional.","La actuación de las Fuerzas y Cuerpos de Seguridad."],0],[52,2,"El Consejo de Estado es el supremo órgano consultivo del:",["Rey.","Congreso de los Diputados.","Gobierno.","Tribunal Supremo."],2],[53,2,"Según la Constitución, el Gobierno responde solidariamente en su gestión política ante:",["El Rey.","El Congreso de los Diputados.","Las Cortes Generales.","El Tribunal Supremo."],1],[54,2,"El Presidente del Gobierno, previa deli sponsable."],2],[60,2,"Señale la respuesta correcta respecto al Consejo General del Poder Judicial:",["Es el órgano jurisdiccional superior en todos los órdenes, salvo lo dispuesto en materia de garantías constitucionales.","El Consejo General del Poder Judicial estará integrado por el Presidente del Tribunal Supremo, que lo presidirá, y por veinte miembros nombrados por el Rey por un período de cinco años.","Cuatro de los miembros serán nombrados a propuesta del Congreso de los Diputados, y otros cuatro a propuesta del Senado, elegidos en ambos casos por mayoría absoluta de sus miembros, entre abogados y otros juristas, todos ellos de reconocida competencia y con más de diez años de ejercicio en su profesión.","El Consejo General del Poder Judicial, sin perjuicio de las funciones encomendadas a otros órganos, tiene por misión promover la acción de la justicia en defensa de la legalidad, de los derechos de los ciudadanos y del interés público tutelado por la ley, de oficio o a petición de los interesados, así como velar por la independencia de los Tribunales y procurar ante éstos la satisfacción del interés social."],1],[61,3,"El Estado se organiza territorialmente en:",["Municipios, en provincias y en las Comunidades Autónomas que se constituyan.","Municipios, Comarcas y en las Comunidades Autónomas que se constituyan.","Ayuntamientos, Diputaciones y Gobiernos Regionales.","Municipios y en cuatro áreas regionales."],0],[62,3,"Según la Constitución, señale la respuesta correcta:",["Los Concejales serán elegidos por el Alcalde.","Los Alcaldes y Concejales serán elegidos por las Cortes Generales.","Los Alcaldes serán elegidos por los Concejales o por los vecinos.","Los Alcaldes serán elegidos por los vecinos del municipio mediante sufragio universal, igual, libre, directo y secreto, en la forma establecida por la ley."],2],[63,3,"La provincia es una entidad local con personalidad jurídica propia, determinada por la agrupación de municipios y división territorial para el cumplimiento de las actividades del Estado. Cualquier alteración de los límites provinciales habrá de ser aprobada:",["Por las Cortes Generales mediante ley ordinaria.","Por el Senado mediante ley ordinaria.","Por las Cortes Generales mediante ley orgánica.","Por el Senado mediante ley orgánica."],2],[64,3,"Las Haciendas locales deberán disponer de los medios suficientes para el desempeño de las funciones que la ley atribuye a las Corporaciones respectivas y se nutrirán fundamentalmente de:",["Subvenciones estatales y fondos europeos de desarrollo.","Tributos propios y de participación en los del Estado y de las Comunidades Autónomas.","Donaciones privadas y tasas por servicios municipales.","Préstamos bancarios avalados por el Tesoro Público."],1],[65,3,"Según la Constitución, las Comunidades Autónomas podrán asumir competencias en materias como:",["Relaciones internacionales.","Legislación sobre propiedad intelectual e industrial.","Régimen de producción, comercio, tenencia y uso de armas y explosivos.","Los montes y aprovechamientos forestales."],3],[66,3,"Según la Constitución, el Estado tiene competencia exclusiva sobre la siguiente materia:",["La artesanía.","Administración de Justicia.","Asistencia social.","Promoción del deporte y del ocio."],1],[67,3,"Señale la respuesta correcta:",["Las Cortes Generales, en materias de competencia estatal, podrán atribuir a todas o a alguna de las Comunidades Autónomas la facultad de dictar, para sí mismas, normas legislativas en el marco de los principios, bases y directrices fijados por una ley estatal.","El Estado podrá transferir o delegar en las Comunidades Autónomas, mediante ley ordinaria, facultades correspondientes a materia de titularidad estatal que por su propia naturaleza sean susceptibles de transferencia o delegación.","El Estado podrá dictar leyes que establezcan los principios necesarios para armonizar las disposiciones normativas de las Comunidades Autónomas, aun en el caso de materias atribuidas a la rcicio de los derechos y deberes fundamentales de los ciudadanos.","Impulsarán una política tendente al mantenimiento de las condiciones de vida y trabajo actuales.","Adoptarán aquellas medidas que tiendan a fomentar la productividad económica.","Facilitarán la participación de todos los ciudadanos en la vida económica, cultural y social del País Vasco y la limitarán en la vida política."],0],[74,3,"Según el Estatuto de Autonomía para el País Vasco, ¿dónde están establecidos los derechos y deberes fundamentales de los ciudadanos del País Vasco?",["En la Constitución.","En el Estatuto de Autonomía.","En la Ley de derechos fundamentales del País Vasco.","En cada una de las normas forales de organización de los Territorios Históricos."],0],[75,3,"Según el Estatuto de Autonomía para el País Vasco, ¿en qué materia tiene competencia exclusiva la Comunidad Autónoma del País Vasco?",["Medio ambiente y ecología.","Ordenación del crédito, banca y seguros.","Asistencia social.","Régimen minero y energético."],2],[76,3,"Según el Estatuto de Autonomía para el País Vasco, ¿en cuál de las siguientes materias le corresponde a la Comunidad Autónoma del País Vasco la ejecución de la legislación del Estado?",["Ordenación del territorio y del litoral, urbanismo y vivienda.","Turismo y deporte.","Propiedad intelectual e industrial.","Espectáculos."],2],[77,3,"Señale la respuesta correcta. La competencia de los órganos jurisdiccionales en el País Vasco se extiende:",["En el orden civil, a todas las instancias y grados, con excepción de los recursos de casación y de revisión.","En el orden penal y social, a todas las instancias y grados, con excepción de los recursos de casación y de revisión.","En el orden contencioso-administrativo, a todas las instancias y grados cuando se trate de actos dictados por la Administración del Estado, y, en primera instancia, cuando se trate de actos dictados por la Administración del País Vasco.","A las cuestiones de competencia entre órganos judiciales del País Vasco y de las comunidades autónomas limítrofes."],1],[78,3,"Según el Estatuto de Autonomía para el País Vasco, ¿qué le corresponderá al País Vasco en materia de Seguridad Social?",["El desarrollo legislativo y la ejecución de la legislación básica del Estado, incluso las normas que configuran el régimen económico de la misma.","El desarrollo legislativo y la ejecución de las normas que configuran el régimen económico de la Seguridad Social.","El desarrollo legislativo y la ejecución de la legislación básica del Estado, salvo las normas que configuran el régimen económico de la misma.","La ejecución de la legislación del Estado."],2],[79,3,"Según el Estatuto de Autonomía para el País Vasco, señale la respuesta correcta entre las siguientes opciones:",["La Comunidad Autónoma podrá celebrar convenios con otras Comunidades Autónomas para la gestión y prestación de servicios propios de la exclusiva competencia de las mismas. La celebración de los citados convenios, antes de su entrada en vigor, deberá ser comunicada a las Cortes Generales.","La Comunidad Autónoma podrá celebrar convenios con otras Comunidades Autónomas para la gestión y prestación de servicios propios de la exclusiva competencia de las mismas. La celebración de los citados convenios, después de su entrada en vigor, deberá ser comunicada a las Cortes Generales.","La Comunidad Autónoma podrá celebrar convenios con otras Comunidades Autónomas para la gestión y prestación de servicios propios de la exclusiva competencia de las mismas. La celebración de los citados convenios, antes de su entrada en vigor, deberá ser comunicada al Gobierno de España.","La Comunidad Autónoma no podrá celebrar convenios con otras Comunidades Autónomas para la gestión y prestación de servicios propios de la exclusiva competencia de las mismas."],0],[80,3,"Según el Estatuto de Autonomía del País Vasco, los poderes del País Vasco se ejercerán a través:",["Del Parlamento, del Gobierno y de su Presidente o Lendakari.","Del Parlamento, y del Gobierno.","Del Parlamento, y del Presidente o Lendakari.","Del Parlamento."],0],[81,3,"Según el Estatuto de Autonomía del País Vasco, el Parlamento Vasco:",["Ejerce la potestad ejecutiva, aprueba sus presupuestos e impulsa y controla la acción del Gobierno Vasco.","Ejerce la potestad ejecutiva, aprueba sus presupuestos e impulsa y controla la acción del Gobierno Vasco y las diputaciones forales.","Ejerce la potestad legislativa, aprueba sus presupuestos e impulsa y controla la acción del Gobierno Vasco.","Ejerce la potestad legislativa, aprueba sus presupuestos e impulsa y controla la acción del Gobierno Vasco y las diputaciones forales."],2],[82,3,"Según el Estatuto de Autonomía para el País Vasco, señale la respuesta correcta sobre el Parlamento Vasco:",["Estará integrado por un número igual de representantes de cada Territorio Histórico elegidos por sufragio universal, libre, directo y secreto, la circunscripción electoral es el Territorio Histórico y será elegido por un período de cuatro años.","Estará integrado por un número proporcional de representantes de cada Territorio Histórico en función del número de habitantes, elegidos por sufragio universal, libre, directo y secreto, la circunscripción electoral es el Territorio Histórico y será elegido por un período de cuatro años.","Estará integrado por un número igual de representantes de cada circunscripción electoral elegidos por sufragio universal, libre, directo y secreto, la circunscripción electoral son las comarcas de cada territorio histórico y será elegido por un período de cuatro años.","Estará integrado por un número igual de representantes de cada Territorio Histórico elegidos por sufragio universal, libre, directo y secreto, la circunscripción electoral es el Territorio Histórico y será elegido por un período de cinco años."],0],[83,3,"Según el Estatuto de Autonomía del País Vasco, ¿qué órgano colegiado ostenta las funciones ejecutivas y administrativas del País Vasco?",["El Parlamento Vasco.","El Gobierno Vasco.","El Departamento de Lehendakaritza.","La comisión ejecutiva del Parlamento Vasco."],1],[84,3,"Según el Estatuto de Autonomía para el País Vasco, señale la respuesta correcta:",["El Gobierno Vasco cesa tras la celebración de elecciones del Parlamento, en el caso de pérdida de la confianza parlamentaria o por dimisión o fallecimiento de su Presidente o Consejeros.","El Gobierno cesante continuará en funciones hasta la celebración de nuevas elecciones.","El Presidente del Gobierno Vasco será designado de entre sus miembros por el Parlamento Vasco y nombrado por el Presidente del Gobierno de España.","El Presidente designa y separa los Consejeros del Gobierno, dirige su acción, ostentando a la vez la más alta representación del País Vasco y la ordinaria del Estado en este territorio."],3],[85,3,"Los conflictos de competencia que se puedan suscitar entre las Instituciones de la Comunidad Autónoma y las de cada uno de sus Territorios Históricos se someterán a la decisión de:",["Una comisión arbitral, formada por un número igual de representantes designados libremente por el Gobierno Vasco y por la Diputación Foral del Territorio interesado, y presidida por el Presidente del Tribunal Superior de Justicia del País Vasco.","Una comisión arbitral, formada por un número igual de representantes designados libremente por el Gobierno Vasco y por la Diputación Foral del Territorio interesado, y presidida por el Presidente del Tribunal Supremo.","El Senado.","El Parlamento Vasco."],0],[86,4,"El Gobierno Vasco puede delegar en las Diputaciones Forales la gestión y prestación de servicios de su competencia:",["En todo caso por propia iniciativa.","A solicitud del Parlamento Vasco y de las respectivas Juntas Generales, y reservándose la facultad para dictar reglamentos de ejecución.","A solicitud de los Órganos Forales de los Territorios Históricos y reservándose la facultad para elaborar programas de gestión.","Siempre mediante petición razonada de las propias Diputaciones Forales y reservándose la facultad para recabar información sobre la gestión."],2],[87,4,"Según la LTH, es competencia de las Instituciones Comunes de la Comunidad Autónoma la legislación y ejecución en las siguientes materias:",["Las que, correspondiendo a la Comunidad Autónoma según el Estatuto de Autonomía, no se reconozcan o atribuyan a los Órganos Forales de los Territorios Históricos en el Estatuto, en la LTH o en leyes posteriores.","Las expresamente previstas en el art. 7 LTH.","Las que designe la Junta Arbitral.","Las expresamente contempladas en el Estatuto de Autonomía y en la LTH."],0],[88,4,"Según la LTH, la facultad de dictar normas con rango de Ley corresponde:",["Al Parlamento Vasco y a las Juntas Generales.","En exclusiva al Parlamento Vasco.","Al Gobierno Vasco.","En exclusiva a las Juntas Generales."],1],[89,4,"Los Órganos Forales de los Territorios Históricos tienen competencia exclusiva en materia de:",["Conservación, modificación y desarrollo del Derecho Civil Foral y especial.","Montes, aprovechamientos y servicios forestales.","Asistencia social.","Ordenación farmacéutica."],1],[90,4,"De acuerdo con su tradición histórica, son Órganos Forales de los Territorios Históricos:",["Las diputaciones provinciales.","Los Plenos de las diputaciones forales.","Las Juntas Generales y las Diputaciones Forales.","Los diputados forales."],2],[91,4,"Ley de Relaciones entre las Instituciones Comunes de la Comunidad Autónoma y los Órganos Forales de sus Territorios Históricos (más conocida como “Ley de Territorios Históricos”) establece como cláusula residual o de cierre que:",["Las competencias no atribuidas legalmente al Gobierno Vasco corresponden a las Diputaciones Forales.","Las competencias no atribuidas legalmente a las Instituciones Comunes pertenecen a los Territorios Históricos.","Las competencias no atribuidas legalmente a los Órganos Forales de los Territorios Históricos corresponden a las Instituciones Comunes.","No establece cláusula residual alguna."],2],[92,4,"¿Dónde se regula la delimitación de competencias entre las Instituciones Comunes de la Comunidad Autónoma y los Órganos Forales de sus Territorios Históricos?",["En la Constitución.","En Ley Orgánica 3/1979, de 18 de diciembre, del Estatuto de Autonomía para el País Vasco.","En la Ley 27/1983, de 25 de noviembre, de Relaciones entre las Instituciones Comunes de la Comunidad Autónoma y los Órganos Forales de sus Territorios Históricos.","En la jurisprudencia de los tribunales ordinarios."],2],[93,4,"¿A quién corresponde la ejecución en materia de montes?",["Al Estado.","Al Gobierno Vasco.","A los Órganos Forales.","A las mancomunidades."],2],[94,4,"Señale la respuesta INCORRECTA. Según la Ley 27/1983, de 25 de noviembre, los Órganos Forales de los Territorios Históricos tienen competencia exclusiva en las siguientes materias:",["Elaboración y aprobación de sus propios Presupuestos y Cuentas.","Régimen de los bienes provinciales y municipales.","Producción y sanidad animal.","Régimen electoral municipal y de Entidades Locales menores."],2],[95,4,"Según la Ley 27/1983, en todo caso la facultad de dictar normas con rango de Ley corresponde en exclusiva a:",["El Gobierno Vasco.","El Parlamento Vasco.","Las Juntas Generales.","Los Plenos municipales."],1],[96,4,"En materia de conservación, mejora, restauración o, en su caso, excavación del Patrimonio Histórico Artístico Monumental y Arqueológico corresponde a los Órganos Forales de los territorios históricos:",["La competencia exclusiva.","El desarrollo y la ejecución de las normas emanadas de las Instituciones Comunes.","La ejecución dentro de su territorio de la legislación de las Instituciones Comunes.","El desarrollo normativo y ejecución de la legislación básica del Estado."],1],[97,4,"De acuerdo con la Ley de Territorios Históricos, los Órganos Forales tienen competencia exclusiva en las siguientes materias:",["Normas electorales, organización, régimen y funcionamiento de sus órganos forales.","Normas electorales, organización y funcionamiento de sus órganos forales.","Organización, régimen y funcionamiento de sus órganos forales.","Normas electorales y funcionamiento de sus órganos forales."],2],[98,4,"En la Comunidad Autónoma del País Vasco, en materia de asistencia social:",["Los territorios históricos tienen competencia exclusiva, sin perjuicio de la acción directa de las instituciones comunes del País Vasco.","Los territorios históricos tienen la ejecución dentro de su territorio de la legislación de las instituciones comunes, sin perjuicio de la acción directa de estas últimas.","Los territorios históricos tienen el desarrollo y la ejecución de las normas emanadas de las instituciones comunes, sin perjuicio de la acción directa de estas últimas.","Los territorios históricos tienen la ejecución dentro de su territorio de la legislación de las instituciones comunes."],1],[99,4,"En la Comunidad Autónoma del País Vasco, los territorios históricos ostentan competencia exclusiva en la siguiente materia:",["Asistencia y asesoramiento técnico a las Entidades Locales.","Prevención, extinción de incendios y salvamento.","Régimen de aprovechamiento de la riqueza cinegética.","Política infantil."],0],[100,4,"¿Cuál de las siguientes instituciones es el órgano máximo de representación y participación popular de cada Territorio Histórico?",["El Parlamento Vasco.","Las Juntas Generales.","La Diputación Foral.","Los ayuntamientos."],1],[101,4,"En las materias en que corresponde a los Territorios Históricos el desarrollo normativo y la ejecución, compete a éstos, entre otras:",["La potestad normativa, aplicándose las normas emanadas de sus Órganos Forales con preferencia a cualesquiera otras.","La potestad reglamentaria y la administrativa, aplicándose las normas emanadas de sus Órganos Forales con preferencia a cualesquiera otras.","La potestad normativa de dictar normas con rango de ley y la potestad reglamentaria.","La potestad de desarrollo normativo de las normas emanadas de las Instituciones Comunes, no pudiendo ir en contra de lo dispuesto en las mismas las normas emanadas de los Órganos Forales."],3],[102,4,"Las relaciones entre las Instituciones Comunes del País Vasco y los Órganos Forales de sus Territorios Históricos se basarán en los principios de:",["Colaboración y solidaridad.","Coordinación y solidaridad.","Colaboración y eficacia.","Eficacia y coordinación."],0],[103,4,"Señale la respuesta INCORRECTA. En las materias en que corresponde a los Territorios Históricos el desarrollo normativo y la ejecución, tienen las siguientes potestades:",["De desarrollo normativo de las normas emanadas de las Instituciones Comunes.","Reglamentaria.","Administrativa, salvo la inspección.","Revisora en la vía administrativa."],2],[104,5,"De acuerdo con su tradición histórica, son Instituciones y Órganos Forales del Territorio Histórico de Gipuzkoa:",["Las Juntas Generales.","La Diputación Foral y los Ayuntamientos de Gipuzkoa.","Las Juntas Generales y la Diputación Foral.","Las Juntas Generales, la Diputación Foral y los Ayuntamientos de Gipuzkoa."],2],[105,5,"Señale la respuesta correcta. Según la Norma Foral 6/2005:",["Las Juntas Generales, que constituyen el Órgano máximo de representación y participación popular del Territorio Histórico, son el Parlamento de Gipuzkoa.","Las Juntas Generales están compuestos por el Diputado General o la Diputada General y los Diputados Forales o las Diputadas Forales.","A efectos de elección a las Juntas Generales, la única circunscripción electoral es el Territorio Histórico de Gipuzkoa.","Las Juntas Generales ejercen la potestad normativa en los términos establecidos en la presente Norma Foral, evalúan los resultados de dicha potestad, eligen a los Diputados Forales o a las Diputadas Forales, aprueban sus presupuestos y, a iniciativa de la Diputación Foral, los del Territorio Histórico, y controlan la acción de aquélla."],0],[106,5,"Las disposiciones emanadas de las Juntas Generales en virtud de su potestad normativa se denominan:",["Leyes Orgánicas Forales.","Normas Forales.","Decretos Forales.","Ordenes Forales."],1],[107,5,"Según la Norma Foral 6/2005, las Normas Forales:",["Serán publicadas en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco y entrarán en vigor a los 10 días de su publicación en aquel, salvo disposición en contrario.","Las Normas Forales serán publicadas en el Boletín Oficial de Gipuzkoa, en el Boletín Oficial del País Vasco y en el Boletín Oficial del Estado y entrarán en vigor a los 10 días de su publicación en aquel, salvo disposición en contrario.","Las Normas Forales serán publicadas en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco y entrarán en vigor a los 20 días de su publicación en aquel, salvo disposición en contrario.","Las Normas Forales serán publicadas en el Boletín Oficial de Gipuzkoa, en el Boletín Oficial del País Vasco y en el Boletín Oficial del Estado y entrarán en vigor a los 20 días de su publicación en aquel, salvo disposición en contrario."],2],[108,5,"Según la Norma Foral 6/2005, se regularán mediante Norma Foral:",["Los Presupuestos del Territorio Histórico y sus cuentas generales.","Las áreas de actuación y funciones de los Departamentos Forales.","Los planes territoriales, planes urbanísticos supramunicipales y el planeamiento general urbanístico municipal.","Los planes de empleo y la oferta de empleo público de la Diputación Foral."],0],[109,5,"Según la Norma Foral 6/2005, señale la respuesta correcta respecto a las Juntas Generales:",["Las Juntas Generales de Gipuzkoa se regirán en cuanto a su constitución, organización y funcionamiento por lo dispuesto en su Reglamento.","La Juntas Generales elegirán de entre sus miembros un Presidente o Presidenta y una Mesa, que estará integrada por éste, dos Vicepresidencias, dos Secretarías y dos Diputados o Diputadas Forales, la cual será el órgano rector de la Cámara y ostentará la representación colegiada de ésta en los actos a que asista.","La modificación o derogación del Reglamento de Juntas Generales, así como la aprobación de uno nuevo, exigirá mayoría simple de las Juntas Generales en una votación final sobre el conjunto del proyecto.","El Reglamento de las Juntas Generales será promulgado por el o la Lehendakari, teniendo el rango y valor de una Ley."],0],[110,5,"Según la Norma Foral 6/2005, las Juntas Generales podrán delegar en la Diputación Foral la potestad de dictar disposiciones normativas con rango de Norma Foral, denominadas:",["Norma Foral de Bases.","Decreto Foral Normativo.","Orden Foral.","Decreto Foral-Norma."],1],[111,5,"Según la Norma Foral 6/2005, por razones de extraordinaria y urgente necesidad, el Consejo de Gobierno Foral podrá dictar disposiciones normativas provisionales, dentro del ámbito de sus competencias exclusivas, que tomarán la forma de:",["Norma Foral de Bases.","Decreto Foral Normativo.","Orden Foral.","Decreto Foral-Norma."],3],[112,5,"Según la Norma Foral 6/2005, la Diputación Foral se compone:",["De junteros y junteras.","De la Comisión Permanente y la Junta de Portavoces.","Del Diputado o Diputada General y un número de diputadas y diputados forales que no podrá exceder de diez.","Del Diputado o Diputada General, de diputadas y diputados forales y de un número de directoras y directores generales que no podrá exceder de diez."],2],[113,5,"Según la Norma Foral 6/2005, la Diputación Foral ostenta la representación legal del Territorio Histórico de Gipuzkoa y en la esfera de sus competencias, asume su gobierno y administración, correspondiéndole:",["Las funciones normativas.","Las funciones normativas, ejecutivas y administrativas, la potestad reglamentaria.","Las funciones ejecutivas y administrativas, la potestad reglamentaria y la iniciativa normativa.","Las funciones ejecutivas y administrativas, la potestad reglamentaria la iniciativa normativa y aprobar los presupuestos generales del Territorio Histórico."],2],[114,5,"Según la Norma Foral 6/2005, señale la respuesta correcta respecto al Diputado o Diputada General:",["La elección del Diputado o Diputada General la realizará el Consejo de Gobierno Foral de entre sus miembros de derecho, mediante votación secreta.","Para la designación del Diputado o Diputada General será necesario que un candidato o candidata tenga, en primera votación, la mayoría simple de los votos de las y los miembros electos de las Juntas Generales.","El acuerdo de nombramiento del Diputado o Diputada General será firmado por el Presidente o Presidenta de las Juntas Generales y publicado en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco.","El Diputado o Diputada General asume la presidencia de las Juntas Generales."],2],[115,5,"Según la Norma Foral 6/2005, corresponde al Diputado o Diputada General:",["Aprobar los Proyectos de Norma Foral para su remisión a las Juntas Generales y determinar su retirada en las condiciones que establezca el Reglamento de las mismas.","Ejercer mediante Decretos Forales Normativos la delegación normativa en los términos establecidos en la Norma Foral 6/2005.","Resolver los recursos que se interpongan contra los actos del Consejo de Gobierno Foral.","Designar y cesar a las diputadas y diputados forales, y asignarles la titularidad de los distintos Departamentos."],3],[116,5,"Según la Norma Foral 6/2005, corresponde al Consejo de Gobierno Foral:",["Definir el programa de gobierno y llevar su dirección.","Aprobar los Decretos Forales-Norma en los supuestos y términos establecidos en la Norma Foral 6/2005.","Nombrar, de entre las diputadas y diputados forales, un o una o varios o varias tenientes de Diputado o Diputada General.","Resolver en vía administrativa los recursos que se interpongan contra actos y resoluciones dictados por los Diputados o Diputadas Forales."],1],[117,5,"Según la Norma Foral 6/2005, la celebración de las sesiones del Consejo de Gobierno Foral requerirá, para su válida Constitución:",["La asistencia del Diputado o Diputada General y del diputado foral secretario o diputada foral secretaria, o quienes les sustituyan, debiendo estar presentes al menos, tres de las y los miembros.","La asistencia del Diputado o Diputada General y del diputado foral secretario o diputada foral secretaria, o quienes les sustituyan, debiendo estar presentes al menos, la mitad de las y los miembros. ·","La asistencia del Diputado o Diputada General y del diputado foral secretario o diputada foral secretaria, o quienes les sustituyan, debiendo estar presentes al menos, dos tercios de las y los miembros.","La asistencia del Diputado o Diputada General o del diputado foral secretario o diputada foral secretaria, o quienes les sustituyan, debiendo estar presentes al menos, dos tercios de las y los miembros."],1],[118,5,"Según la Norma Foral 6/2005, compete a las diputadas y diputados forales:",["Aprobar el nombramiento y cese de las directoras y directores generales de su Departamento.","Resolver en vía administrativa los recursos que se interpongan contra actos y resoluciones dictados por el Consejo de Gobierno Foral en las materias de su competencia.","Ejercer la iniciativa de propuesta al Consejo de Gobierno Foral sobre la estructura orgánica y funcional de su Departamento.","Aprobar los Decretos Forales en las materias propias del Departamento."],2],[119,5,"Señale la respuesta correcta respecto a las directoras y directores generales según la Norma Foral 6/2005:",["Son altos cargos de la Diputación Foral. Su designación y cese se efectuará por Decreto Foral del Consejo de Gobierno Foral.","Son altos cargos de la Diputación Foral. Su designación y cese se efectuará por Decreto Foral del Diputado o Diputada General.","Son altos cargos de la Diputación Foral. Su designación y cese se efectuará por Orden Foral del Diputado o Diputada General.","Son altos cargos de la Diputación Foral. Su designación y cese se efectuará por Acuerdo del Consejo de Gobierno Foral."],0],[120,5,"Según la Norma Foral 6/2005, los órganos superiores de la Administración Foral son:",["Los órganos superiores de la Administración Foral son el Consejo de Gobierno Foral, el Diputado o Diputada General, las diputadas y diputados forales y las directoras y directores generales.","Los órganos superiores de la Administración Foral son el Consejo de Gobierno Foral, el Diputado o Diputada General, y las diputadas y diputados forales.","Los órganos superiores de la Administración Foral son el Consejo de Gobierno Foral y el Diputado o Diputada General.","Los órganos superiores de la Administración Foral son el Diputado o Diputada General, y las diputadas y diputados forales."],1],[121,5,"Según la Norma Foral 6/2005, señale la respuesta correcta sobre los Departamentos de la Diputación Foral de Gipuzkoa:",["Toda variación en el número, denominación y competencias de los Departamentos y la creación, fusión, supresión y reforma de los mismos se establecerá por Decreto Foral del Consejo de Gobierno Foral.","En cada Departamento habrá una Secretaría Técnica que tendrá atribuidas las competencias sobre servicios comunes que determine el Decreto Foral de estructura orgánica de aquel, y en todo caso ejercerá las funciones genéricas de Secretaría y asesoramiento jurídico en las materias propias del Departamento y las de control de legalidad y control del gasto de los Órganos del Departamento. ·","Corresponde al Diputado o Diputada Foral correspondiente, conjuntamente con el diputado o diputada foral que tenga atribuidas las competencias en materia de organización y servicios generales, la aprobación de la estructura orgánica de cada uno de los Departamentos mediante Orden Foral.","Los Departamentos estarán bajo la superior dirección de un director o directora general."],1],[122,5,"Según la Norma Foral 6/2005, las disposiciones de carácter general de la Diputación Foral adoptarán la siguiente forma:",["Decretos Forales del Consejo de Gobierno Foral y del Diputado o Diputada General y Ordenes Forales, dictadas por las diputadas y diputados forales titulares de los Departamentos.","Acuerdos del Consejo de Gobierno Foral, Decretos Forales del Diputado o Diputada General y Ordenes Forales, dictadas por las diputadas y diputados forales titulares de los Departamentos.","Acuerdos del Consejo de Gobierno Foral y Ordenes Forales del Diputado o Diputada General y de las diputadas y diputados forales titulares de los Departamentos.","Decretos Forales del Consejo de Gobierno Foral y Ordenes Forales del Diputado o Diputada General y de las diputadas y diputados forales titulares de los Departamentos."],0],[123,5,"Según la Norma Foral, 6/2005, todas las disposiciones de carácter general:",["Se publicarán en el Boletín Oficial de Gipuzkoa y entrarán en vigor a los 15 días de su publicación, salvo disposición en contrario.","Se publicarán en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco y entrarán en vigor a los 15 días de su publicación, salvo disposición en contrario.","Se publicarán en el Boletín Oficial de Gipuzkoa y entrarán en vigor a los 20 días de su publicación, salvo disposición en contrario.","Se publicarán en el Boletín Oficial de Gipuzkoa y en el Boletín Oficial del País Vasco y entrarán en vigor a los 20 días de su publicación, salvo disposición en contrario."],2],[124,5,"Según la Norma Foral, 6/2005, los actos del Consejo de Gobierno Foral adoptarán la forma de:",["Acuerdo.","Decreto Foral.","Orden Foral.","Resolución."],0],[125,5,"Según la Norma Foral, 6/2005, las resoluciones del Diputado o Diputada General adoptarán la forma de:",["Acuerdo.","Decreto Foral.","Orden Foral.","Resolución."],1],[126,5,"Según la Norma Foral, 6/2005, las resoluciones de las diputadas y diputados forales adoptarán la forma de:",["Acuerdo.","Decreto Foral.","Orden Foral.","Resolución."],2],[127,5,"Según la Norma Foral, 6/2005, los actos dictados por las directoras y directores generales adoptarán la forma de:",["Acuerdo.","Decreto Foral.","Orden Foral.","Resolución."],3],[128,5,"Según la Norma Foral, 6/2005, las resoluciones dictadas por las diputadas y diputados forales:",["No ponen fin a la vía administrativa.","Ponen fin a la vía administrativa.","No ponen fin a la vía administrativa, salvo que se señale lo contrario en la propia resolución.","Ponen fin a la vía administrativa, salvo que se señale lo contrario en la propia resolución."],1],[129,6,"Las Provincias:",["Gozan de idéntica autonomía que los municipios para la gestión de los intereses respectivos.","Gozan de menor autonomía que los municipios para la gestión de los intereses respectivos.","Gozan de mayor autonomía que los municipios para la gestión de los intereses respectivos.","No gozan de autonomía para la gestión de los intereses respectivos."],0],[130,6,"Según el art. 3.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las entidades locales territoriales son las siguientes:",["El ayuntamiento, el concejo abierto y las mancomunidades.","El municipio, la provincia y la isla.","Las comarcas, las áreas metropolitanas y las mancomunidades.","El distrito, la comarca y el ayuntamiento."],1],[131,6,"La Junta de Gobierno Local tiene que estar integrada:",["Por el Alcalde y el resto de concejales de su candidatura.","Por el Alcalde y los concejales que decida libremente el Alcalde.","Por el Alcalde y los concejales que decida libremente el Alcalde, pero sin que superen el tercio del numero legal de los mismos.","Por el Alcalde y un tercio del número legal de concejales, en proporción a su representación."],2],[132,6,"La aprobación de las ordenanzas locales corresponde a:",["El Pleno, pero las que no requieren mayoría cualificada pueden delegarse en la Junta de Gobierno Local.","El Pleno, pero las que no requieren mayoría cualificada pueden delegarse en la Junta de Gobierno Local o en el Alcalde.","El Pleno, pero todas pueden delegarse en la Junta de Gobierno Local.","El Pleno."],3],[133,6,"Según el artículo 20.1 de la Ley 7/1985, de 2 de abril, reguladora de las Bases del Régimen Local, la organización municipal responde a las siguientes reglas:",["El Alcalde, los Tenientes de Alcalde, la Junta de Gobierno Local y el Pleno existen en todos los ayuntamientos.","El Alcalde, la Junta de Gobierno Local y el Pleno existen en todos los ayuntamientos.","El Alcalde y el Pleno existen en todos los ayuntamientos.","El Alcalde, los Tenientes de Alcalde y el Pleno existen en todos los ayuntamientos."],3],[134,6,"En el ámbito municipal la aceptación de la delegación de competencias hecha por otras Administraciones públicas corresponde a:",["El Pleno.","La Junta de Gobierno Local.","Los Tenientes de Alcalde.","El Alcalde."],0],[135,6,"No tienen la condición de entidades locales territoriales:",["El Municipio y las Comarcas.","Las Islas en los archipiélagos balear y canario.","Las Provincias y Mancomunidades de Municipios.","Las Mancomunidades de Municipios."],3],[136,6,"De acuerdo con la Ley 7/1985, de 2 de abril, Reguladora de las Bases de Régimen Local:",["La Junta de Gobierno Local existe en todos los municipios.","La Junta de Gobierno Local existe en los municipios con población inferior a 5.000 habitantes, si así lo dispone su reglamento orgánico.","La Comisión Especial de Cuentas sólo existe en los municipios con población superior a 5.000 habitantes.","Corresponde a la Junta de Gobierno Local el control y fiscalización de los órganos de gobierno."],1],[137,6,"Son órganos necesarios en todos los ayuntamientos:",["El alcalde o la alcaldesa, los y las tenientes de alcalde o alcaldesa, el Pleno y la Comisión Especial de Cuentas.","El alcalde o la alcaldesa, la Junta de Gobierno Local y el Pleno.","El alcalde o la alcaldesa, las comisiones informativas y el Pleno.","El alcalde o la alcaldesa, la Comisión Especial de Quejas y Sugerencias y el Pleno."],0],[138,6,"¿Cuál de las siguientes afirmaciones relativas a la administración local es INCORRECTA?",["Las competencias de las Entidades Locales pueden ser propias o atribuidas por delegación.","El Estado y las Comunidades Autónomas, en el ejercicio de sus respectivas competencias, podrán delegar en las Entidades Locales el ejercicio de sus competencias.","Las competencias propias de los Municipios, las Provincias y demás Entidades Locales territoriales solo podrán ser determinadas por Ley.","Las Provincias no podrán realizar la gestión ordinaria de servicios propios de la Administración autonómica."],3],[139,6,"Corresponde al Alcalde:",["La aprobación de las ordenanzas.","Dirigir, inspeccionar e impulsar los servicios y obras municipales.","Los acuerdos relativos a la participación en organizaciones supramunicipales.","La aprobación inicial del planeamiento general prevista en la legislación urbanística."],1],[140,7,"Los Diputados/las Diputadas al Parlamento Europeo se eligen:",["Por sufragio universal directo, libre y secreto, para un mandato de cuatro años.","Por sufragio censitario, para un mandato de cinco años.","Por sufragio universal indirecto y público, para un mandato de cuatro años.","Por sufragio universal directo, libre y secreto, para un mandato de cinco años."],3],[141,7,"El principio de subsidiariedad en el Derecho de la Unión Europea significa que:",["En los ámbitos que no sean de su competencia exclusiva, la Unión intervendrá sólo en caso de que, y en la medida en que, los objetivos de la acción pretendida no puedan ser alcanzados de manera suficiente por los Estados miembros.","El contenido y la forma de la acción de la Unión no debe exceder de lo necesario para alcanzar los objetivos de los Tratados.","La Unión afirma y promueve sus valores e intereses y contribuye a la protección de sus ciudadanos.","La Unión ofrece a sus ciudadanos un espacio de libertad, seguridad y justicia sin fronteras interiores."],0],[142,7,"A nivel de jerarquía normativa en el Derecho de la Unión Europea:",["El Tratado de la Unión Europea tiene mayor valor jurídico que el Tratado de Funcionamiento de la Unión Europea.","El Tratado de la Unión Europea tiene menor valor jurídico que el Tratado de Funcionamiento de la Unión Europea.","El Tratado de la Unión Europea y el Tratado de Funcionamiento de la Unión Europea tienen el mismo valor jurídico.","El Tratado de la Unión Europea está en la cúspide normativa europea, incluso por encima de la Carta de los Derechos Fundamentales de la Unión Europea de 7 de diciembre de 2000."],2],[143,7,"La institución de la Unión Europea que tiene por misión principal promover el interés general de la Unión es:",["El Tribunal de Cuentas.","El Tribunal de Justicia.","La Comisión.","El Consejo Europeo."],2],[144,7,"La Comisión Europea:",["Supervisará la aplicación del Derecho de la Unión.","Ejercerá la función legislativa.","Ejercerá la función jurisdiccional.","Asumirá la representación exterior de la Unión en cualquier materia."],0],[145,7,"El Tribunal de Justicia de la Unión Europea comprenderá:",["El Tribunal Internacional de la Haya.","El Tribunal de Justicia y el Tribunal General, entre otros.","Tribunal Europeo de Derechos Humanos.","Los Tribunales Supremos de los Estados Miembros."],1],[146,7,"En el Derecho de la Unión Europea, la política social:",["Es una competencia compartida entre la Unión y los Estados Miembros.","Es una competencia exclusiva de la Unión.","Es una competencia exclusiva de los Estados Miembros.","No se contempla en los Tratados de la Unión Europea."],0],[147,7,"Tal y como reconoce el Tratado de la Unión Europea, La Unión tiene como finalidad:",["Promover la paz, sus valores y el bienestar de sus pueblos.","Generar una economía libre de mercado.","Unificar la normativa interior entre todos los Estados Miembros.","Desplazar a la Organización Mundial de Naciones en el territorio europeo."],0],[148,7,"Los y las miembros del Parlamento Europeo:",["Son elegidos por los Gobiernos de los Estados Miembros.","Son elegidos por la Comisión en razón de su competencia general y de su compromiso europeo, de entre personalidades FUE):",["La decisión cuando designe destinatarios no será obligatoria en todos sus elementos.","La entrada en vigor de reglamentos, directivas, y decisiones exige su publicación en los diarios de los Estados miembros.","El reglamento tendrá un alcance general. Será obligatorio en todos sus elementos y directamente aplicable en cada Estado miembro.","La directiva tendrá un alcance general."],2],[165,7,"Conforme al Tratado de la Unión Europea (TUE):",["El Parlamento Europeo ejercerá de forma exclusiva la función legislativa y la función presupuestaria.","El Parlamento Europeo ejercerá conjuntamente con el Consejo la función legislativa y la función presupuestaria.","El Consejo elegirá al Presidente de la Comisión.","Los diputados del Parlamento Europeo serán elegidos por el Consejo."],1],[166,7,"Conforme al Tratado de la Unión Europea (TUE):",["El Consejo Europeo elegirá al Presidente de la Comisión.","El Parlamento Europeo elegirá a su Presidente y a la Mesa de entre los miembros de la Comisión.","El Parlamento Europeo estará compuesto por representantes de los ciudadanos de la Unión.","La Comisión Europea está compuesta por los Jefes de Estado o de Gobierno de los Estados Miembros."],2],[167,8,"Son leyes orgánicas las relativas al:",["Desarrollo de derechos fundamentales y libertades públicas, la iniciativa legislativa popular, los Estatutos de Autonomía y las demás que prevean las leyes.","Desarrollo de derechos fundamentales y libertades públicas, las que aprueben los Estatutos de Autonomía y el régimen electoral general y las demás previstas en la Constitución.","Desarrollo de derechos fundamentales y libertades públicas, las que aprueben los Estatutos de Autonomía y el régimen electoral general y las demás previstas en la Constitución y las leyes.","Desarrollo de derechos fundamentales y libertades públicas y las que regulen los Órganos Constitucionales del Estado."],1],[168,8,"Las leyes aprobadas por las Cortes Generales deberán ser:",["Sancionadas por el Rey e entales y libertades públicas.","La aprobación de Estatutos de Autonomía.","La que tenga la naturaleza de bases o régimen básico del art. 149.1 CE.","Las que expresamente prevea la Constitución."],2],[176,8,"La iniciativa legislativa, conforme al art. 87 de la Constitución, corresponde, entre otros, a:",["El Senado.","Los tribunales.","El Defensor del Pueblo.","La Administración."],0],[177,8,"¿Cómo se denomina la disposición legislativa provisional que el Gobierno puede adoptar en casos de extraordinaria y urgente necesidad?",["Decreto-ley.","Decreto legislativo.","Decreto armonizador.","Decreto urgente."],0],[178,8,"¿Cómo denomina la Constitución a la disposición de las Cortes Generales que fija los principios, bases y directrices para atribuir a todas o a alguna de las Comunidades Autónomas la facultad de dictar, para sí mismas, normas legislativas en materia de competencia estatal?",["Ley armonizadora.","Ley de bases.","Ley marco.","Real Decreto-ley."],2],[179,8,"¿Qué tipo de ley autoriza a las Comunidades Autónomas para dictar, para sí mismas, normas legislativas en materias de competencia estatal dentro del marco de los principios, bases y directrices fijados por una ley estatal?",["Ley orgánica.","Ley de bases.","Ley marco.","Ley ordinaria."],2],[180,8,"Debe ser Ley ordinaria:",["La ley que regule el derecho de asociación.","La ley que regule la composición y competencia del Consejo de Estado.","La Ley que regule el derecho a la herencia.","Las leyes que aprueben los Estatutos de Autonomía."],2],[181,8,"Las resoluciones administrativas de carácter particular no podrán vulnerar lo establecido en una disposición de carácter general:",["En ningún caso.","Excepto en el caso de que aquéllas procedan de un órgano de igual jerarquía al que dictó la disposición general.","Excepto en el caso de que aquéllas procedan de un órgano de superior jerarquía al que dictó la disposición general.","Salvo que la disposición general tenga rango de Ley."],0],[182,8,"De acuerdo con  dicta el Gobierno en casos de extraordinaria y urgente necesidad:",["Deben ser inmediatamente sometidas a las Cortes Generales para su convalidación o derogación.","Toman la forma de decretos-leyes.","Pueden tener como objeto la regulación de cualquier materia.","No se publican hasta su convalidación."],1],[199,8,"En relación con los distintos tipos de leyes del ordenamiento jurídico español podemos afirmar que:",["La ley orgánica es superior en jerarquía a la ley ordinaria, como lo es la Constitución a la ley.","La ley estatal es superior en jerarquía a la ley autonómica.","La ley es superior en jerarquía al reglamento y la Constitución a la ley.","La relación entre la ley orgánica estatal y la ley orgánica autonómica se rige por el principio de competencia."],2],[200,8,"En relación con la potestad reglamentaria:",["El ejercicio de la potestad reglamentaria corresponde al Gobierno de la Nación, a los órganos de Gobierno de las Comunidades Autónomas, a los órganos de gobierno locales, y a los ciudadanos.","Los reglamentos y disposiciones administrativas no podrán vulnerar la Constitución o las leyes ni regular aquellas materias que la Constitución o los Estatutos de Autonomía reconocen de la competencia de las Cortes Generales o de las Asambleas Legislativas de las Comunidades Autónomas.","Los reglamentos pueden tipificar delitos y faltas administrativas.","Los reglamentos no se rigen por el principio de jerarquía."],1],[201,8,"En relación con las leyes, la Constitución Española señala:",["La aprobación, modificación o derogación de las leyes orgánicas exigirá mayoría relativa de las Cámaras, en una votación final sobre el conjunto del proyecto.","La aprobación, modificación o derogación de las leyes orgánicas exigirá mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto.","Las Cortes Generales podrán delegar en el Gobierno la potestad de dictar normas con rango de ley sobre cualquier materia.","La delegación legislativa deberá otorgarse mediante ley orgánica."],1],[202,9,"El objeto de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, es regular los requisitos de validez y eficacia de los actos administrativos, el procedimiento administrativo común a todas las Administraciones Públicas, incluyendo el sancionador y el de:",["Responsabilidad penal de las autoridades.","Reclamación de deudas entre particulares.","Responsabilidad de las Administraciones Públicas.","Selección de personal estatutario."],2],[203,9,"La Ley 39/2015 se aplica al sector público, el cual comprende, según el artículo 2.1.c):",["Las empresas privadas con participación estatal mínima del 10 %.","Las organizaciones sindicales y empresariales.","Las entidades que integran la Administración Local.","Los partidos políticos y las fundaciones vinculadas a ellos."],2],[204,9,"A los efectos previstos en la Ley 39/2015, tienen capacidad de obrar ante las Administraciones Públicas:",["Solo los mayores de edad.","Los menores de edad para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela. Se exceptúa el supuesto de los menores incapacitados, cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate.","Los menores de edad para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela, incluyendo los menores incapacitados, incluso cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate.","En todo caso, los grupos de afectados, las uniones y entidades sin personalidad jurídica y los patrimonios independientes o autónomos."],1],[205,9,"Según la Ley 39/2015, se consideran interesados en el procedimiento administrativo:",["Quienes lo promuevan como titulares de derechos o intereses legítimos individuales o colectivos.","Los que, sin haber iniciado el procedimiento, tengan intereses personales que puedan resultar afectados por la decisión que en el mismo se adopte.","Aquellos cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución y se personen en el procedimiento una vez haya recaído resolución definitiva.","Todas las personas con capacidad de obrar."],0],[206,9,"Según la Ley 39/2015, señale la respuesta correcta:",["Para formular solicitudes en nombre de otra persona, deberá acreditarse la representación. Para presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos y para los actos y gestiones de mero trámite, se presumirá aquella representación.","Para formular solicitudes, presentar declaraciones responsables o comunicaciones en nombre de otra persona, deberá acreditarse la representación. Para interponer recursos, desistir de acciones y renunciar a derechos y para los actos y gestiones de mero trámite, se presumirá aquella representación.","Para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos en nombre de otra persona, deberá acreditarse la representación. Para desistir de acciones y renunciar a derechos y para los actos y gestiones de mero trámite, se presumirá aquella representación.","Para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos en nombre de otra persona, deberá acreditarse la representación. Para los actos y gestiones de mero trámite se presumirá aquella representación."],3],[207,9,"Según la Ley 39/2015, cuando en una solicitud, escrito o comunicación figuren varios interesados, las actuaciones a que den lugar se efectuarán:",["Con todos ellos.","Con el representante o el interesado que expresamente hayan señalado, y, en su defecto, con el que figure en primer término.","Con el representante o el interesado que expresamente hayan señalado, y, en su defecto, con el que tenga mayor edad.","Con el que tenga mayor edad."],1],[208,9,"Según la Ley 39/2015, para interponer recursos las Administraciones Públicas requerirán a los interesados:",["El uso obligatorio de firma.","Que actúen mediante un abogado de forma obligatoria.","Que actúen mediante un abogado de forma obligatoria, si se trata de un recurso de alzada.","Que únicamente acrediten previamente su identidad a través de cualquiera de los medios de identificación previstos en la Ley."],0],[209,9,"Según la Ley 39/2015, señale la respuesta correcta:",["Los empleados de las Administraciones Públicas para los trámites y actuaciones que realicen con ellas por razón de su condición de empleado público, podrán elegir en todo momento si se comunican con las Administraciones Públicas para el ejercicio de sus derechos y obligaciones a través de medios electrónicos o no.","Las entidades sin personalidad jurídica podrán elegir en todo momento si se comunican con las Administraciones Públicas para el ejercicio de sus derechos y obligaciones a través de medios electrónicos o no, salvo que estén obligadas a relacionarse a través de medios electrónicos con las Administraciones Públicas.","Las personas jurídicas podrán elegir en todo momento si se comunican con las Administraciones Públicas para el ejercicio de sus derechos y obligaciones a través de medios electrónicos o no, salvo que estén obligadas a relacionarse a través de medios electrónicos con las Administraciones Públicas.","Las personas físicas podrán elegir en todo momento si se comunican con las Administraciones Públicas para el ejercicio de sus derechos y obligaciones a través de medios electrónicos o no, salvo que estén obligadas a relacionarse a través de medios electrónicos con las Administraciones Públicas."],3],[210,9,"Según la Ley 39/2015, en
