xcepción de las Comunidades Autónomas.","Serán de aplicación a todas las Administraciones Tributarias, a excepción de los Territorios Históricos."],0],[316,14,"Dentro de la clasificación de los tributos se incluyen:",["Las multas.","Las sanciones.","Las contribuciones especiales.","Las penalizaciones por incumplimiento contractual."],2],[317,14,"Los tributos de carácter personal se exigirán:",["Conforme a las normas que establezca el Tribunal de Cuentas.","Conforme al criterio de territorialidad que resulte más adecuado a la naturaleza del objeto gravado.","Conforme al criterio de residencia.","Conforme a las Normas que establezca la Inspección de Hacienda."],2],[318,14,"Las normas que regulen el régimen de infracciones y sanciones tributarias:",["No tendrán efectos retroactivos en ningún caso.","Tendrán efectos retroactivos respecto de los actos que sean firmes cuando su aplicación resulte más favorable para el interesado.","Tendrán efectos retroactivos respecto de los actos que no sean firmes cuando su aplicación resulte más desfavorable para el interesado.","Tendrán efectos retroactivos respecto de los actos que no sean firmes cuando su aplicación resulte más favorable para el interesado."],3],[319,14,"¿Cuáles son los principios del sistema tributario conforme al art. 3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?",["Los principios de justicia, generalidad, igualdad, progresividad, equitativa distribución de la carga tributaria y no confiscatoriedad.","Los principios de justicia, generalidad, igualdad, progresividad, equitativa distribución de la carga tributaria y confiscatoriedad proporcional.","Los principios de justicia, generalidad, igualdad, progresividad, analogía y confiscatoriedad.","La Ley 58/2003, de 17 de diciembre, General Tributaria no recoge los principios tributarios y remite a la Constitución."],0],[320,14,"Los tributos exigidos sin contraprestación cuyo hecho imponible está constituido por negocios, actos o hechos que ponen de manifiesto la capacidad económica del contribuyente se denominan en la Ley 58/2003, de 17 de diciembre, General Tributaria:",["Tasas.","Contribuciones especiales.","Impuestos.","Precios públicos."],2],[321,14,"El Concierto Económico:",["Exige la adecuación íntegra de la Ley General Tributaria en cuanto a terminología y conceptos.","Exige una presión fiscal efectiva equivalente en cada impuesto a la existente en el resto del Estado.","Exige la misma clasificación de actividades ganaderas, mineras, industriales, comerciales, de servicios, profesionales y artísticas que en territorio común.","Excluye planes conjuntos de inspección sobre objetivos, sectores y procedimientos selectivos."],2],[322,14,"Señale la respuesta correcta. Los tributos cuyo hecho imponible consiste en la obtención por el obligado tributario de un beneficio o de un aumento de valor de sus bienes como consecuencia de la realización de obras públicas o del establecimiento o ampliación de servicios públicos se denominan:",["Impuestos.","Tasas.","Tarifas.","Contribuciones especiales."],3],[323,14,"Los tributos, cualquiera que sea su denominación, se clasifican en:",["Tasas, contribuciones especiales e impuestos.","Tasas, impuestos y donaciones.","Contribuciones especiales, donaciones e impuestos.","Contribuciones especiales, impuestos y comisiones."],0],[324,14,"Según lo establecido en el artículo 1 del Concierto Económico, la exacción, gestión, liquidación, inspección, revisión y recaudación de los tributos que integran el sistema tributario de los Territorios Históricos corresponderá:",["Al Gobierno Vasco.","A las respectivas Diputaciones Forales.","A las Diputaciones Forales y a los ayuntamientos.","A los ayuntamientos."],0],[325,14,"La Junta Arbitral tendrá atribuidas las siguientes funciones:",["Emitir los informes que sean solicitados por el Ministerio de Hacienda y los distintos Departamentos de Hacienda del Gobierno Vasco y de las Diputaciones Forales.","Evaluar la adecuación de la normativa tributaria al Concierto Económico con carácter previo a su publicación.","Realizar los estudios que estimen procedentes para una adecuada articulación estructural y funcional del régimen autonómico con el marco fiscal estatal.","Resolver las discrepancias que puedan producirse respecto a la domiciliación de los Contribuyentes. ·"],3],[326,14,"Las normas tributarias:",["Se aplicarán siempre por un plazo definido.","Se aplicarán a los tributos sin período impositivo devengados a partir de su entrada en vigor.","Se aplicarán a los tributos con o sin período impositivo devengados a partir de su entrada en vigor.","Si regulan el régimen de los recargos tendrán efectos retroactivos respecto de los actos firmes cuando su aplicación resulte más favorable para el interesado."],1],[327,14,"Según la Ley 12/2002, de 23 de mayo, por la que se aprueba el Concierto Económico con la Comunidad Autónoma del País Vasco:",["En la elaboración de la normativa tributaria garantizarán la libre circulación de bienes, capitales y servicios en todo el territorio español.","Podrán, dentro de su territorio, mantener y regular, pero no establecer, su régimen tributario.","Podrán establecer su propia estructura general impositiva.","Para la gestión de los tributos no concertados ostentarán las mismas facultades que tiene reconocidas la Hacienda Pública del Estado."],0],[328,14,"NO tienen la consideración de tributos:",["Los precios públicos.","Los impuestos.","Las tasas.","Las contribuciones especiales."],0],[329,14,"NO es un principio de ordenación del sistema tributario:",["La generalidad.","La seguridad.","La justicia.","La progresividad."],1],[330,14,"Ámbito temporal de las normas tributarias:",["La regla general es que tienen efectos retroactivos si resultan más favorables para las personas interesadas y si el acto de que se trate no es firme.","La regla general es que sólo tienen efectos retroactivos las que regulan el régimen de infracciones y sanciones tributarias, siempre que su aplicación resulte más favorable para la persona interesada.","Las que regulan el régimen de infracciones y sanciones tributarias y el de los recargos tienen efectos retroactivos respecto de los actos no firmes, cuando su aplicación resulte más favorable para la persona interesada.","Las que regulan el régimen de infracciones y sanciones tributarias y el de los beneficios e incentivos fiscales tienen efectos retroactivos respecto de los actos no firmes, cuando su aplicación resulte más favorable para la persona interesada."],2],[331,14,"Según dispone el Concierto Económico sobre el cupo:",["Es la aportación del País Vasco al Estado como contribución a todas las cargas del Estado asumidas por la comunidad autónoma.","La metodología para su señalamiento debe determinarse cada 5 años, mediante ley votada en el Parlamento Vasco.","De la cantidad a abonar se resta, por compensación, la parte imputable de los tributos concertados.","Se abona en tres plazos iguales, durante los meses de mayo, septiembre y diciembre de cada año."],3],[332,14,"La alta inspección de la aplicación del Concierto Económico corresponde a:",["La Comunidad Autónoma, en colaboración con el Estado.","El Consejo Vasco de Finanzas.","El Estado.","Comisión Mixta del Concierto Económico."],2],[333,14,"La resolución de las discrepancias entre el Estado y la Comunidad Autónoma del País Vasco, que puedan producirse respecto a la domiciliación de los contribuyentes, corresponde a:",["La Comisión Mixta del Concierto Económico.","La Comisión de Coordinación y Evaluación Normativa.","La Comisión Arbitral.","La Junta Arbitral."],3],[334,14,"Entre las funciones de la Comisión Mixta del Concierto Económico se encuentra:",["Acordar el nombramiento y régimen de los componentes de la Junta Arbitral prevista en el Concierto Económico.","Realizar los estudios que estimen procedentes para una adecuada articulación estructural y funcional del régimen autonómico con el marco fiscal estatal.","Resolver los conflictos que se planteen entre la Administración del Estado y las Diputaciones Forales o entre éstas y la Administración de cualquier otra Comunidad Autónoma, en relación con la aplicación de los puntos de conexión de los tributos concertados.","Analizar los supuestos o cuestiones que se planteen en materia de inspección entre las Administraciones del Estado y las respectivas Diputaciones Forales."],0],[335,15,"Según la Ley 10/1982, ¿qué consideración tiene el euskera?",["Es la lengua secundaria de la Comunidad Autónoma.","Es la lengua propia del Pueblo Vasco.","Es una lengua de uso meramente literario.","Es la lengua oficial única del territorio."],1],[336,15,"Según la Ley 10/1982, ¿cómo califica el artículo 3 el estatus del euskera en la Comunidad Autónoma?",["Lengua cooficial opcional.","Lengua oficial, al igual que el castellano.","Lengua de interés cultural preferente.","Lengua administrativa exclusiva."],1],[337,15,"¿Qué derecho reconoce el artículo 5 de la Ley 10/1982 a todos los ciudadanos del País Vasco?",["El derecho a conocer y usar las dos lenguas oficiales.","El derecho a recibir subvenciones para aprender euskera.","El derecho a elegir una tercera lengua en la Administración.","El derecho a ser atendido en cualquier lengua que elijan en la Administración."],0],[338,15,"Según la Ley 10/1982, ¿cómo debe ir redactado todo acto en el que intervengan los poderes públicos sitos en la Comunidad Autónoma del País Vasco, así como las notificaciones y comunicaciones administrativas?",["Deberán ir redactados en forma euskera, salvo que los interesados privados elijan expresamente la utilización de otro idioma.","Deberán ir redactados en forma castellano, salvo que los interesados privados elijan expresamente la utilización del euskera.","Deberán ir redactados en forma bilingüe, salvo que los interesados privados elijan expresamente la utilización de una de las lenguas oficiales de la Comunidad Autónoma.","Deberán ir redactados en forma bilingüe, en todo caso."],2],[339,15,"Según la Ley 10/1982, en sus relaciones con la Administración de Justicia:",["Todo ciudadano deberá utilizar la lengua oficial elegida por los jueces.","Todo ciudadano podrá utilizar la lengua oficial de su elección, aunque se le podrá exigir realizar traducciones en caso de ser necesarios.","Todo ciudadano podrá utilizar la lengua oficial de su elección, sin que se le pueda exigir traducción alguna, salvo en determinadas materias donde por su dificultad resulte necesario exigir la traducción de escritos y documentos de carácter técnico.","Todo ciudadano podrá utilizar la lengua oficial de su elección, sin que se le pueda exigir traducción alguna."],3],[340,15,"Según la Ley 10/1982, señale la respuesta correcta:",["Los impresos o modelos que hayan de utilizarse por los poderes públicos y privados en la Comunidad Autónoma del País Vasco, deberán estar redactados en forma bilingüe.","Los impresos o modelos oficiales que hayan de utilizarse por los poderes públicos en la Comunidad Autónoma del País Vasco, deberán estar redactados en forma bilingüe.","Los impresos o modelos que hayan de utilizarse por los poderes públicos y privados en la Comunidad Autónoma del País Vasco, podrán estar redactados, exclusivamente en euskera.","Los impresos o modelos oficiales que hayan de utilizarse por los poderes públicos en la Comunidad Autónoma del País Vasco, podrán estar redactados exclusivamente en castellano."],1],[341,15,"¿Qué reconoce el artículo 15 de la Ley 10/1982 a todos los alumnos del País Vasco?",["El derecho a estudiar en una lengua extranjera de su elección.","La obligación de cursar todas las asignaturas en euskera.","El derecho a recibir la enseñanza tanto en euskera como en castellano en los diversos niveles educativos.","El derecho a no ser evaluado en las asignaturas de lengua."],2],[342,15,"Según la Ley 10/1982, los centros privados subvencionados con fondos públicos que impartan enseñanzas regladas tomando como base una lengua no oficial en la Comunidad:",["Impartirán como asignaturas obligatorias el euskera y el castellano.","Impartirán como asignaturas obligatorias el euskera o el castellano.","Impartirán como asignaturas optativas el euskera y el castellano.","Impartirán como asignaturas optativas el euskera o el castellano."],0],[343,15,"Según la Ley 10/1982, ¿qué promoverá el Gobierno en los medios de comunicación de la Comunidad Autónoma?",["El uso del castellano para garantizar la difusión exterior.","El empleo exclusivo del euskera a fin de garantizar la equiparación de ambas lenguas.","El empleo preferente del euskera a fin de garantizar la equiparación de ambas lenguas.","La obligatoriedad de que todos los periodistas sean bilingües."],2],[344,15,"Según la Ley 10/1982, ¿en qué ámbitos de la vida social deben los poderes públicos fomentar el uso del euskera?",["Únicamente en el ámbito laboral y administrativo.","En las actividades mercantiles, culturales, asociativas, deportivas, religiosas y cualesquiera otras.","En las actividades mercantiles, culturales, asociativas, deportivas, religiosas y cualesquiera otras en aquellas localidades donde el euskera sea la lengua mayoritaria.","En las actividades mercantiles, culturales, asociativas, deportivas, religiosas y cualesquiera otras en aquellas localidades donde el euskera sea la lengua minoritaria."],1],[345,15,"Según la Ley 11/2022, ¿a qué están obligadas las administraciones públicas vascas respecto a las lenguas oficiales?",["A dar prioridad al euskera en las relaciones externas.","A dar prioridad al euskera en las relaciones internas.","A utilizar el castellano únicamente cuando el ciudadano lo solicite.","A garantizar en sus relaciones, tanto internas como externas, la utilización de ambas."],3],[346,15,"Según la Ley 11/2022, ¿qué instrumento deben aprobar las administraciones públicas vascas para fijar sus objetivos y medidas lingüísticas?",["Un reglamento orgánico municipal de lenguas.","Un instrumento de planificación lingüística.","Un catálogo de puestos de bilingüismo obligatorio.","Un protocolo de uso interno del euskera."],1],[347,15,"Según la Ley 11/2022, todos los puestos de trabajo existentes en las administraciones públicas vascas, sus instituciones y organismos, incluidos aquellos de naturaleza temporal o coyuntural:",["Tendrán asignado su correspondiente perfil lingüístico, determinado según las características y necesidades comunicativas atribuidas a dichos puestos de trabajo y a las destrezas lingüísticas exigibles a dicho fin.","Tendrán asignado su correspondiente perfil lingüístico, determinado según los conocimientos acreditados por la persona ocupante del puesto.","Tendrán asignado su correspondiente perfil lingüístico, determinado según el nivel de conocimiento de euskera de la población en la que tenga sede la administración pública correspondiente.","Tendrán asignado un idioma de trabajo, que podrá ser el euskera o el castellano."],0],[348,15,"La asignación del perfil lingüístico a cada uno de los puestos de trabajo existentes en las administraciones públicas vascas, sus instituciones y organismos, así como la de su fecha de preceptividad:",["Se efectuarán por el departamento del Gobierno Vasco competente en materia de política lingüística.","Se efectuarán por sus respectivos órganos de gobierno, previo informe preceptivo de los departamentos de las diputaciones forales competentes en materia de política lingüística.","Se efectuarán por sus respectivos órganos de gobierno, previo informe preceptivo del departamento del Gobierno Vasco competente en materia de política lingüística.","Se efectuarán por sus respectivos órganos de gobierno, previo informe preceptivo y vinculante de los departamentos de las diputaciones forales competentes en materia de política lingüística."],2],[349,15,"Según la Ley 11/2022, ¿dónde deben quedar incorporados el perfil lingüístico y la fecha de preceptividad de cada uno de los puestos de trabajo existentes en las administraciones públicas vascas?",["En el expediente del empleado público que ocupa cada puesto.","En las relaciones de puestos de trabajo, así como en los instrumentos complementarios recogidos en la ley.","En el Plan General de Normalización del Gobierno Vasco.","En los Planes Generales de Normalización del Gobierno Vasco y de las diputaciones forales."],1],[350,15,"Según la Ley 11/2022, en los procesos selectivos para el acceso al servicio de las administraciones públicas vascas, cuando el conocimiento del euskera sea mérito:",["La puntuación otorgada al conocimiento del euskera representará un porcentaje que no podrá ser en ningún caso superior al diez por ciento de la puntuación máxima alcanzable en el conjunto del proceso selectivo.","La puntuación otorgada al conocimiento del euskera representará un porcentaje que no podrá ser en ningún caso superior al veinte por ciento de la puntuación máxima alcanzable en el conjunto del proceso selectivo.","La puntuación otorgada al conocimiento del euskera representará un porcentaje que no podrá ser en ningún caso superior al diez por ciento de la puntuación máxima alcanzable en la fase de concurso.","La puntuación otorgada al conocimiento del euskera representará un porcentaje que no podrá ser en ningún caso superior al veinte por ciento de la puntuación máxima alcanzable en la fase de concurso."],0],[351,15,"Según la Ley 11/2022, el único organismo habilitado para la acreditación de perfiles",["El Instituto de Alfabetización y Reeuskaldunización de Adultos (HABE).","El Instituto Vasco de Administración Pública.","La Escuela Oficial de Idiomas.","El Gobierno Vasco."],1],[352,15,"Según el Decreto 19/2024, de normalización del uso del euskera en el Sector Público Vasco, el perfil lingüístico determina:",["El nivel de competencia lingüística en comprensión oral en euskera necesario para la provisión y desempeño del puesto de trabajo.","El nivel de competencia lingüística en comprensión escrita en euskera necesario para la provisión y desempeño del puesto de trabajo.","El conjunto de los niveles de competencia lingüística en euskera y castellano necesarios para la provisión y desempeño del puesto de trabajo.","El conjunto de los niveles de competencia lingüística en euskera necesarios para la provisión y desempeño del puesto de trabajo."],3],[353,15,"Según el Decreto 19/2024, de normalización del uso del euskera en el Sector Público Vasco, cuando la fecha de preceptividad esté vencida en la relación de puestos de trabajo de la entidad:",["El cumplimiento del perfil lingüístico se constituirá como exigencia obligatoria para el acceso y desempeño del correspondiente puesto de trabajo.","El cumplimiento del perfil lingüístico se constituirá como exigencia obligatoria para el acceso y desempeño del correspondiente puesto de trabajo en el plazo de un año desde la fecha de preceptividad.","El cumplimiento del perfil lingüístico se constituirá como exigencia obligatoria para el acceso y desempeño del correspondiente puesto de trabajo en el plazo de dos años desde la fecha de preceptividad.","El cumplimiento del perfil lingüístico dejará de ser exigencia obligatoria para el acceso y desempeño del correspondiente puesto de trabajo."],0],[354,15,"Según el Decreto 19/2024, de normalización del uso del euskera en el Sector Público Vasco, se reconoce a todo el personal al servicio de las entidades del sector público vasco el derecho a:",["Utilizar como único idioma de trabajo el euskera.","Utilizar el idioma que mejor domine en las relaciones con la ciudadanía.","Recibir formación en euskera.","Recibir formación de euskera al menos durante 5 horas semanales."],2],[355,15,"Según el Decreto 19/2024, de normalización del uso del euskera en el Sector Público Vasco, el índice de obligado cumplimiento se determinará de la siguiente forma:",["(Euskaldunes/2) + Cuasi euskaldunes.","Euskaldunes + (Cuasi euskaldunes/2).","Euskaldunes + (Cuasi euskaldunes*2).","(Euskaldunes*2) + Cuasi euskaldunes."],1],[356,15,"Según el Decreto 19/2024, de normalización del uso del euskera en el Sector Público Vasco, en los procesos de selección y provisión de puestos de trabajo que tengan asignado el perfil lingüístico C2 y cuya fecha de preceptividad se encuentre vencida, en caso de no acreditarse este por ninguna de las personas candidatas:",["Se aplicará a dicho puesto el perfil lingüístico C1 a los únicos efectos de cobertura en tal convocatoria de selección o provisión.","Se diferirá la fecha de preceptividad de los puestos que queden vacantes, para garantizar la cobertura de las mismas.","Se modificará el perfil lingüístico de dicho puesto del perfil lingüístico C2 al perfil lingüístico C1.","No se podrán cubrir los puestos con el perfil lingüístico C2 y deberá convocarse un nuevo proceso de selección y provisión de puestos de trabajo en un plazo improrrogable de 6 meses."],0],[357,15,"Cuando la acreditación del perfil lingüístico asignado a un puesto de trabajo sea preceptiva:",["La acreditación de dicho perfil o de perfiles inferiores o superiores se valorará como mérito hasta un límite del veinte por ciento.","La acreditación de dicho perfil o de perfiles inferiores o superiores se valorará como mérito hasta un límite del quince por ciento.","La acreditación de dicho perfil o de perfiles inferiores o superiores se valorará como mérito hasta un límite del diez por ciento.","La acreditación de dicho perfil o de perfiles inferiores o superiores no se valorará como mérito."],3],[358,15,"Para establecer la valoración que, como mérito, haya de otorgarse al conocimiento del euskera en cada convocatoria de procesos de selección o de provisión se tomará como base la puntuación máxima alcanzable en el conjunto del proceso, de modo que la puntuación otorgada al conocimiento del euskera representará un porcentaje que deberá situarse en los siguientes umbrales, no pudiendo ser inferior ni superior:",["En perfiles simétricos, comprensión y expresión escrita y comprensión y expresión oral B1 entre el 5 % y el 10 %.","En perfiles simétricos, comprensión y expresión escrita y comprensión y expresión oral B2 entre el 11 % y el 15 %.","En perfiles simétricos, comprensión y expresión escrita y comprensión y expresión oral C1 entre el 16 % y el 20 %.","En perfiles simétricos, comprensión y expresión escrita y comprensión y expresión oral C2 entre el 21 % y el 25 %."],0],[359,15,"Estarán exentos del cumplimiento del régimen general de preceptividad de los perfiles lingüísticos en relación con el puesto de trabajo del que son titulares:",["Las personas que superen la edad de 40 años al inicio de cada período de planificación en el que se asigne la fecha de preceptividad al puesto de trabajo del que son titulares, previa conformidad de la persona interesada.","Las personas cuyo nivel de estudios realizados no alcanzara los de Bachiller Elemental, Educación General Básica o Educación Secundaria Obligatoria, ni otros que, en el futuro, pudieran sustituir a estos, prescindiendo de las equivalencias y convalidaciones que contemple el ordenamiento jurídico a otros fines respecto al Certificado de Escolaridad.","Las personas con discapacidad mediante los programas vigentes de formación y capacitación lingüística de personas adultas.","Las personas que declaren carencia manifiesta y contrastada de las destrezas aptitudinales necesarias en el proceso de aprendizaje del idioma mediante los programas de formación y capacitación lingüística de personas adultas."],1],[360,16,"¿Cuál es el objeto de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres?",["Establecer los principios generales que han de presidir la actuación de los poderes públicos y privados en materia de igualdad de mujeres y hombres, así como regular un conjunto de medidas dirigidas a promover y garantizar la igualdad de oportunidades y trato de mujeres y hombres exclusivamente en el ámbito laboral.","Establecer los principios generales que han de presidir la actuación de los poderes públicos en materia de igualdad de mujeres y hombres, así como regular un conjunto de medidas dirigidas a promover y garantizar la igualdad de oportunidades y trato de mujeres y hombres en todos los ámbitos de la vida y, en particular, a promover el empoderamiento de las mujeres, su autonomía y el fortalecimiento de su posición social, económica y política al objeto de eliminar la desigualdad estructural y todas las formas de discriminación por razón de sexo, incluida la violencia machista contra las mujeres.","Establecer los principios generales que han de presidir la actuación de los poderes públicos en materia de igualdad de mujeres y hombres, así como regular un conjunto de medidas dirigidas a promover y garantizar la igualdad de oportunidades y trato de mujeres y hombres en todos los ámbitos de la vida y, en particular, a promover el empoderamiento de las mujeres, su autonomía y el fortalecimiento de su posición social, económica y política al objeto de reducir la desigualdad estructural y todas las formas de discriminación por razón de sexo, incluida la violencia machista contra las mujeres.","Establecer los principios generales que han de presidir la actuación de los poderes públicos y privados en materia de igualdad de mujeres y hombres, así como regular un conjunto de medidas dirigidas a promover y garantizar la igualdad de oportunidades y trato de mujeres y hombres en todos los ámbitos de la vida y, en particular, a promover el empoderamiento de las mujeres, su autonomía y el fortalecimiento de su posición social, económica y política al objeto de eliminar la desigualdad estructural y todas las formas de discriminación por razón de sexo, incluida la violencia machista contra las mujeres."],1],[361,16,"¿Cuál es el fin último de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres?",["Lograr una sociedad igualitaria y libre de violencia machista en la que todas las personas sean libres, en el ámbito público, para desarrollar sus capacidades personales y tomar decisiones sin las limitaciones impuestas por los roles tradicionales en función del género, y en la que se tengan en cuenta, valoren y potencien por igual las distintas conductas, aspiraciones y necesidades de mujeres y hombres.","Lograr una sociedad igualitaria y libre de violencia machista en la que todas las personas sean libres, en el ámbito privado, para desarrollar sus capacidades personales y tomar decisiones sin las limitaciones impuestas por los roles tradicionales en función del género, y en la que se tengan en cuenta, valoren y potencien por igual las distintas conductas, aspiraciones y necesidades de mujeres y hombres.","Lograr una sociedad igualitaria y libre de violencia machista en la que todas las personas sean libres, tanto en el ámbito público como en el privado, para desarrollar sus capacidades personales y tomar decisiones sin las limitaciones impuestas por los roles tradicionales en función del género, y en la que se tengan en cuenta, valoren y potencien por igual las distintas conductas, aspiraciones y necesidades de mujeres y hombres.","Lograr una reducción importante de la violencia machista y fomentar una sociedad igualitaria."],2],[362,16,"La Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres es de aplicación:",["A todas las administraciones públicas vascas, con las salvedades que a lo largo de ella se establezcan.","Solo al Gobierno Vasco.","Solo a entidades privadas del País Vasco.","Solo a los Ayuntamientos de la Comunidad Autónoma del País Vasco."],0],[363,16,"Los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres son de aplicación:",["Únicamente a las administraciones públicas vascas con sus respectivas administraciones institucionales y demás entes instrumentales dependientes o adscritos a ellas.","A todos los poderes públicos vascos.","A todos los poderes públicos vascos, salvo el Parlamento Vasco y las Juntas generales de los territorios históricos.","A todos los poderes públicos vascos, salvo el Ararteko y el Tribunal Vasco de Cuentas Públicas."],1],[364,16,"A las entidades privadas que suscriban contratos o convenios de colaboración con los poderes públicos vascos:",["No les será exigible durante ningún momento el cumplimiento de los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, aunque se valorará su cumplimiento en el momento de suscribir los contratos o convenios de colaboración.","Les será exigible en un plazo de tres años desde el inicio de su relación con el poder público correspondiente el cumplimiento de los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres.","Les será exigible únicamente en el momento de la suscripción del contrato o convenio de colaboración el cumplimiento de los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres.","Les será exigible durante el tiempo y materia sobre la que verse su relación con el poder público correspondiente el cumplimiento de los principios generales del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres."],3],[365,16,"¿Cuál de los siguientes NO es un principio general del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres?",["Igualdad de trato.","Neutralidad institucional.","Respeto a la diversidad y a la diferencia.","Eliminación de roles y estereotipos en función del género."],1],[366,16,"¿Cuál de los siguientes NO es un principio general del artículo 3 de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres?",["Igualdad de trato.","Igualdad de oportunidades.","Prevención, atención y erradicación de la violencia machista contra las mujeres.","Respeto a la homogeneidad y a la igualdad."],3],[367,16,"De acuerdo con el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, cuando una persona sea, haya sido o pudiera ser tratada de manera menos favorable que otra en situación análoga por razón de su sexo o de circunstancias directamente relacionadas con el sexo, como el embarazo o la maternidad:",["Existirá discriminación indirecta.","Existirá discriminación indirecta, salvo que dicho acto jurídico, criterio o práctica resulte adecuada y necesaria, y pueda justificarse con criterios objetivos que no estén relacionados con el sexo.","Existirá discriminación directa únicamente cuando se demuestre un perjuicio económico.","Existirá discriminación directa."],3],[368,16,"De acuerdo con el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, sin perjuicio de su posible tipificación como delito, el acoso sexual:",["Tiene la consideración de discriminación directa por razón de sexo.","Tiene la consideración de discriminación indirecta por razón de sexo.","No tiene la consideración de discriminación por razón de sexo.","Puede tener la consideración de discriminación directa por razón de sexo en determinados casos."],0],[369,16,"De acuerdo con el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, cuando un acto jurídico, criterio o práctica aparentemente neutra perjudique a una proporción sustancialmente mayor de personas de un mismo sexo:",["Existirá discriminación indirecta.","Existirá discriminación indirecta, salvo que dicho acto jurídico, criterio o práctica resulte adecuada y necesaria, y pueda justificarse con criterios objetivos que no estén relacionados con el sexo.","Existirá discriminación directa únicamente cuando se demuestre un perjuicio económico.","Existirá discriminación directa."],1],[370,16,"De acuerdo con el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, las medidas que, aunque planteen un tratamiento diferente para las mujeres y los hombres, tienen una justificación objetiva y razonable, entre las que se incluyen aquellas que se fundamentan en la acción positiva para las mujeres, en la necesidad de una protección especial de los sexos por motivos biológicos, o en la promoción de la incorporación de los hombres al trabajo doméstico y de cuidado de las personas y al trabajo a favor de la igualdad de trato y oportunidades:",["No se considerarán constitutivas de discriminación por razón de sexo.","Se considerarán constitutivas de discriminación directa por razón de sexo.","Se considerarán constitutivas de discriminación indirecta por razón de sexo.","Se considerarán constitutivas de discriminación indirecta por razón de sexo si así se recoge expresamente en la norma reguladora de las medidas a adoptar."],0],[371,16,"La Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres establece que los poderes públicos vascos:",["Deben adoptar las medidas oportunas para garantizar el ejercicio efectivo por parte de mujeres y hombres, en condiciones de igualdad, de los derechos políticos, civiles, económicos, laborales, sociales, culturales, medioambientales y del resto de derechos fundamentales que puedan ser reconocidos en las normas, incluido el control y acceso al poder y a los recursos y beneficios económicos y sociales.","Pueden adoptar las medidas oportunas para garantizar el ejercicio efectivo por parte de mujeres y hombres, en condiciones de igualdad, de los derechos políticos, civiles, económicos, laborales, sociales, culturales, medioambientales y del resto de derechos fundamentales que puedan ser reconocidos en las normas, incluido el control y acceso al poder y a los recursos y beneficios económicos y sociales.","Deben adoptar las medidas oportunas para fomentar el ejercicio efectivo por parte de mujeres y hombres, en condiciones de igualdad, de los derechos políticos, civiles, económicos, laborales, sociales, culturales, medioambientales y del resto de derechos fundamentales que puedan ser reconocidos en las normas, incluido el control y acceso al poder y a los recursos y beneficios económicos y sociales.","Pueden adoptar las medidas oportunas para fomentar el ejercicio efectivo por parte de mujeres y hombres, en condiciones de igualdad, de los derechos políticos, civiles, económicos, laborales, sociales, culturales, medioambientales y del resto de derechos fundamentales que puedan ser reconocidos en las normas, incluido el control y acceso al poder y a los recursos y beneficios económicos y sociales."],0],[372,16,"En cuanto a la prevención, atención y erradicación de la violencia machista contra las mujeres, señale la respuesta correcta:",["Los poderes públicos vascos integrarán de forma transversal en sus políticas y acciones el objetivo de prevenir, atender y erradicar la violencia machista contra las mujeres en sus diferentes formas.","Los poderes públicos vascos integrarán de forma transversal en sus políticas y acciones el objetivo de prevenir, atender y reducir la violencia machista contra las mujeres en sus diferentes formas.","Los poderes públicos vascos integrarán de forma transversal en sus políticas y acciones el objetivo de atender y reducir la violencia machista contra las mujeres en sus diferentes formas.","Los poderes públicos vascos integrarán de forma transversal en sus políticas y acciones el objetivo de prevenir y reducir la violencia machista contra las mujeres en sus diferentes formas."],0],[373,16,"Señale la respuesta INCORRECTA:",["Los poderes públicos pondrán los medios necesarios para que el proceso hacia la igualdad de sexos se realice respetando tanto la diversidad y las diferencias existentes entre mujeres y hombres en cuanto a su biología, condiciones de vida, aspiraciones y necesidades, como la diversidad y diferencias existentes dentro de los propios grupos de mujeres y de hombres.","Será una prioridad de los poderes públicos vascos la atención integral, recuperación y reparación de las víctimas de la violencia machista contra las mujeres.","Existirá discriminación indirecta cuando un acto jurídico, criterio o práctica aparentemente neutra perjudique a una proporción sustancialmente mayor de personas de un mismo sexo, salvo que dicho acto jurídico, criterio o práctica resulte adecuada y necesaria, y pueda justificarse con criterios objetivos que no estén relacionados con el sexo.","Se considerarán constitutivas de discriminación por razón de sexo las medidas que planteen un tratamiento diferente para las mujeres y los hombres, aunque tengan una justificación objetiva y razonable, entre las que se incluyen aquellas que se fundamentan en la acción positiva para las mujeres, en la necesidad de una protección especial de los sexos por motivos biológicos, o en la promoción de la incorporación de los hombres al trabajo doméstico y de cuidado de las personas y al trabajo a favor de la igualdad de trato y oportunidades."],3],[374,16,"A efectos de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres se entiende por integración de la perspectiva de género:",["La consideración sistemática de las diferentes situaciones, condiciones, aspiraciones y necesidades de mujeres y hombres, incorporando objetivos y actuaciones específicas dirigidas a eliminar las desigualdades y promover la igualdad en todas las políticas y acciones, a todos los niveles y en la fase de planificación.","La consideración sistemática de las diferentes situaciones, condiciones, aspiraciones y necesidades de mujeres y hombres, incorporando objetivos y actuaciones específicas dirigidas a eliminar las desigualdades y promover la igualdad en todas las políticas y acciones, a todos los niveles y en la fase de ejecución.","La consideración sistemática de las diferentes situaciones, condiciones, aspiraciones y necesidades de mujeres y hombres, incorporando objetivos y actuaciones específicas dirigidas a eliminar las desigualdades y promover la igualdad en todas las políticas y acciones, en la fase de evaluación.","La consideración sistemática de las diferentes situaciones, condiciones, aspiraciones y necesidades de mujeres y hombres, incorporando objetivos y actuaciones específicas dirigidas a eliminar las desigualdades y promover la igualdad en todas las políticas y acciones, a todos los niveles y en todas sus fases de planificación, ejecución y evaluación."],3],[375,16,"Las medidas específicas y temporales adoptadas por los poderes públicos destinadas a eliminar o reducir las desigualdades de hecho por razón de sexo existentes en los diferentes ámbitos de la vida se consideran:",["Eliminación de roles y estereotipos en función del género.","Discriminación directa.","Acción positiva.","Integración de la perspectiva interseccional."],2],[376,16,"De acuerdo con el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, Señale la respuesta correcta respecto a la eliminación de roles y estereotipos en función del género:",["Los poderes públicos vascos podrán promover la eliminación de los roles sociales y estereotipos en función del género sobre los que se asienta la desigualdad entre mujeres y hombres y según los cuales se asigna a las mujeres la responsabilidad del ámbito de lo doméstico y a los hombres la del ámbito público, con una muy desigual valoración y reconocimiento económico y social.","Los poderes públicos vascos podrán promover la eliminación de los roles sociales y estereotipos en función del género sobre los que se asienta la desigualdad entre mujeres y hombres y según los cuales se asigna a los hombres la responsabilidad del ámbito de lo doméstico y a las mujeres la del ámbito público, con una muy desigual valoración y reconocimiento económico y social.","Los poderes públicos vascos deben promover la eliminación de los roles sociales y estereotipos en función del género sobre los que se asienta la desigualdad entre mujeres y hombres y según los cuales se asigna a las mujeres la responsabilidad del ámbito de lo doméstico y a los hombres la del ámbito público, con una valoración y reconocimiento económico y social muy similar.","Los poderes públicos vascos deben promover la eliminación de los roles sociales y estereotipos en función del género sobre los que se asienta la desigualdad entre mujeres y hombres y según los cuales se asigna a las mujeres la responsabilidad del ámbito de lo doméstico y a los hombres la del ámbito público, con una muy desigual valoración y reconocimiento económico y social."],3],[377,16,"De acuerdo con el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, para promover la consecución de la igualdad real y efectiva de mujeres y hombres:",["Los poderes públicos deben desarrollar las políticas públicas necesarias que aseguren la subordinación corporal de todas las personas.","Los poderes públicos deben adoptar las medidas necesarias para reducir de todos los ámbitos de la vida las discriminaciones relacionadas con la identidad sexual o de género y la orientación sexual.","Los poderes públicos deben desarrollar la autodeterminación de todas las personas, en particular las mujeres y, en especial, el ejercicio de sus derechos sexuales y reproductivos, desde una perspectiva integral y multidisciplinar.","Los poderes públicos deben, por un lado, adoptar las medidas necesarias para erradicar de todos los ámbitos de la vida las discriminaciones relacionadas con la identidad sexual o de género y la orientación sexual, así como, por otro lado, desarrollar las políticas públicas necesarias que aseguren la autonomía corporal y la autodeterminación de todas las personas, en particular las mujeres y, en especial, el ejercicio de sus derechos sexuales y reproductivos, desde una perspectiva integral y multidisciplinar."],3],[378,16,"Por lo que respecta a los órganos pluripersonales, a los efectos de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, se considera que existe una representación equilibrada cuando:",["En los órganos de más de seis miembros las personas de cada sexo están representadas al menos al 30 %. En el resto, cuando personas de ambos sexos estén representadas.","En los órganos de más de diez miembros las personas de cada sexo están representadas al menos al 30 %. En el resto, cuando personas de ambos sexos estén representadas.","En los órganos de más de cuatro miembros las personas de cada sexo están representadas al menos al 40 %. En el resto, cuando personas de ambos sexos estén representadas.","En los órganos de más de seis miembros las personas de cada sexo están representadas al menos al 40 %. En el resto, cuando personas de ambos sexos estén representadas."],2],[379,16,"De acuerdo con el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, señale la respuesta INCORRECTA:",["Los poderes públicos vascos tienen la obligación de colaborar y coordinar sus actuaciones en materia de igualdad de mujeres y hombres para que sus intervenciones sean más eficaces y acordes con una utilización racional de los recursos.","Los poderes públicos vascos han de promover la incorporación de la perspectiva de género en las políticas de cooperación para el desarrollo, así como la internacionalización de las políticas de igualdad, a fin de captar e intercambiar conocimiento y recursos y de posicionar de forma destacada al País Vasco en la acción internacional para dar cumplimiento al objetivo global de la agenda internacional de desarrollo sostenible de lograr la igualdad entre los sexos y el empoderamiento de las mujeres.","Los poderes públicos vascos tienen que establecer las condiciones y realizar las adaptaciones necesarias para favorecer el empoderamiento de las mujeres, considerando su homogeneidad.","Los poderes públicos vascos han de adoptar las medidas oportunas para lograr una presencia equilibrada de mujeres y hombres con capacitación, competencia y preparación adecuadas en los distintos ámbitos de toma de decisiones."],2],[380,16,"De acuerdo con el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, ¿cuál de las siguientes afirmaciones define correctamente el objetivo del empoderamiento de las mujeres?",["Se refiere exclusivamente al éxito individual de las mujeres en el ámbito económico para construir economías más fuertes y estables, que permita optimizar el talento y el potencial financiero individual de las mujeres y así corregir ineficiencias históricas, derivando en estructuras financieras más robustas y sistemas económicos capaces de resistir mejor las crisis internacionales.","Es el proceso que las mujeres llevan a cabo para la toma de conciencia individual y colectiva de la situación estructural de desigualdad y discriminación que sufren por el hecho de ser mujeres, y para la adquisición de la competencia, el poder y el control que les permitan tomar decisiones estratégicas sobre sus propias vidas y transformar las estructuras e instituciones que refuerzan y perpetúan la desigualdad y discriminación por razón de género en los distintos ámbitos de la vida.","Es una metodología de trabajo centrada únicamente en identificar y cuestionar las diferencias biológicas entre hombres y mujeres en el ámbito laboral con el objetivo de desmontar los sesgos que justifican la desigualdad de oportunidades. Al examinar rigurosamente qué diferencias son reales y cuáles son construcciones sociales, esta metodología permite separar la capacidad profesional de los prejuicios biológicos, garantizando que el acceso a puestos de liderazgo se base en la competencia y no en suposiciones físicas.","Consiste en garantizar una cuota del 40 % de representación femenina en todas las listas electorales y órganos de gobierno de las administraciones públicas vascas."],1],[381,16,"¿Qué deben promover los poderes públicos vascos respecto a los hombres según el principio general “Implicación de los hombres” de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres?",["La participación exclusiva de los hombres en políticas económicas.","La participación preferente de los hombres en la ejecución de las políticas de igualdad.","La concienciación, responsabilidad, participación e implicación de los hombres a favor de la igualdad.","No existe ningún principio general sobre la implicación de los hombres en la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres."],2],[382,16,"Según el principio general “Participación” de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, ¿qué deben impulsar los poderes públicos vascos en el desarrollo de las políticas públicas?",["La participación exclusiva de las administraciones públicas.","La participación e interlocución de los grupos feministas y de mujeres, de los agentes sociales y de la ciudadanía en su conjunto.","La participación de expertos técnicos.","La participación mayoritaria de las mujeres."],1],[383,16,"Según el principio general “Innovación, transparencia y rendición de cuentas” de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, los poderes públicos vascos deben:",["Frenar la innovación y la mejora continua de las políticas de igualdad hasta que se garantice el cumplimiento de las mismas y garantizar la transparencia y la rendición de cuentas a la ciudadanía sobre cómo se contribuye a la igualdad de mujeres y hombres a través de los recursos públicos.","Fomentar la innovación y la mejora continua de las políticas de igualdad y garantizar la transparencia y la rendición de cuentas a la ciudadanía sobre cómo se contribuye a la igualdad de mujeres y hombres a través de los recursos públicos.","Fomentar la innovación y la mejora continua de las políticas de igualdad y garantizar la transparencia y la rendición de cuentas a la ciudadanía sobre cómo se contribuye a la igualdad de mujeres y hombres a través de los recursos privados.","Fomentar la innovación y la mejora continua de las entidades privadas en relación a las políticas de igualdad y garantizar la transparencia y la rendición de cuentas a los poderes públicos."],1],[384,16,"En relación al principio general protección de los derechos lingüísticos y promoción del uso del euskera, ¿qué deben asegurar los poderes públicos en el desarrollo de políticas de igualdad?",["Que los servicios se presten en la lengua cooficial elegida por la persona interesada.","Que los servicios se presten únicamente en euskera.","Que los servicios se presten únicamente en castellano.","Que los servicios se presten en cualquier lengua elegida por la persona interesada."],0],[385,16,"¿Cuál es el fin último de la Norma Foral 2/2015, de 9 de marzo, para la igualdad de mujeres y hombres?",["Establecer exclusivamente el régimen sancionador en materia de discriminación por razón de sexo.","Garantizar las condiciones necesarias para la consecución de la igualdad real y efectiva de mujeres y hombres en todos sus ámbitos de actuación, a fin de contribuir a la construcción de un modelo de organización social en el Territorio de Gipuzkoa que coloque la sostenibilidad de la vida en el centro de las políticas públicas de la Diputación Foral de Gipuzkoa.","Regular únicamente la estructura interna de la Dirección de Igualdad de la Diputación Foral de Gipuzkoa.","Promover la autonomía de las mujeres exclusivamente en el ámbito laboral y de la empresa privada."],1],[386,16,"De acuerdo con la Norma Foral 2/2015, de 9 de marzo, para la igualdad de mujeres y hombres, ¿a cuál de las siguientes entidades NO se le aplica esta Norma Foral?",["A las fundaciones del sector público foral del Territorio Histórico de Gipuzkoa, que se definan como tal en la normativa que les sea aplicable.","A las sociedades mercantiles forales.","A las empresas privadas que no tengan contratos vigentes con la Administración Foral.","A los organismos autónomos forales y entidades públicas empresariales forales."],2],[387,16,"De acuerdo con la Norma Foral 2/2015, de 9 de marzo, ¿a qué entidades privadas les son de aplicación los principios generales de igualdad?",["A todas las entidades privadas con sede social en el Territorio Histórico de Gipuzkoa.","Únicamente a aquellas entidades privadas que tengan más de 50 trabajadores en plantilla.","A las entidades privadas que suscriban contratos, convenios de colaboración o sean beneficiarias de ayudas o subvenciones de los poderes públicos forales.","Las entidades privadas están exentas de cumplir estos principios, ya que solo afectan al sector público foral."],2],[388,16,"De acuerdo con la Norma Foral 2/2015, de 9 de marzo, ¿cuál de las siguientes tareas corresponde a la Diputación Foral de Gipuzkoa para garantizar la igualdad de mujeres y hombres?",["La aprobación de leyes orgánicas en materia de violencia de género.","La ejecución de medidas de acción positiva en su ámbito territorial.","El análisis de estudios e investigaciones sobre la situación de mujeres y hombres encargados al Gobierno Vasco.","El establecimiento de medidas de fomento a fin de exigir a los ayuntamientos y demás entidades locales que dediquen recursos materiales, económicos y personales para el desarrollo de programas y actividades dirigidas a la consecución de la igualdad de mujeres y hombres."],1],[389,16,"La organización de la Diputación Foral de Gipuzkoa en materia de igualdad de mujeres y hombres estará conformada por:",["El Órgano para la Igualdad de Mujeres y Hombres, las unidades departamentales para la igualdad de mujeres y hombres, las estructuras de coordinación interdepartamental de carácter político y de carácter técnico y las estructuras de coordinación intradepartamental de carácter político y de carácter técnico.","El Órgano para la Igualdad de Mujeres y Hombres, las unidades departamentales para la igualdad de mujeres y hombres y las estructuras de coordinación interdepartamental de carácter político y de carácter técnico.","El Órgano para la Igualdad de Mujeres y Hombres y las unidades departamentales para la igualdad de mujeres y hombres.","El Órgano para la Igualdad de Mujeres y Hombres."],0],[390,16,"De acuerdo con la Norma Foral 2/2015, de 9 de marzo, ¿cuál es la configuración y el ámbito exclusivo de actuación del Órgano para la Igualdad de Mujeres y Hombres?",["Se configura como un organismo autónomo cuyo ámbito es la gestión de subvenciones en materia de género.","Se configura como un órgano de carácter transversal cuyo ámbito exclusivo de actuación será garantizar el impulso de las políticas forales en materia de igualdad de mujeres y hombres.","Se configura como una unidad administrativa consultiva cuyo ámbito es la inspección de las empresas privadas de Gipuzkoa.","Se configura como un departamento independiente cuyo ámbito exclusivo es la atención a víctimas de discriminación."],1],[391,16,"Señale cual es una de las funciones de las unidades departamentales para la igualdad de mujeres y hombres ejercerán, en cumplimiento de los criterios y bajo la coordinación del Órgano para Igualdad de Mujeres y Hombres:",["Velar por la aplicación efectiva del principio de igualdad de mujeres y hombres dentro de su respectivo departamento, y en los organismos autónomos, entidades públicas empresariales y sociedades mercantiles forales en su caso adscritos al mismo.","Asistir a los órganos del su departamento y, en su caso, a los órganos de los organismos autónomos, entidades públicas empresariales y de las sociedades mercantiles forales adscritas al mismo, en la atención, prevención, actuación y eliminación de posibles situaciones de discriminación que se produzcan en el ámbito de sus organizaciones.","Diseñar e impulsar medidas específicas de acción positiva en las áreas de actuación de su departamento y en su caso, de los organismos autónomos, entidades públicas empresariales y de las sociedades mercantiles forales adscritas al mismo.","Las tres opciones anteriores son correctas."],3],[392,16,"Las estructuras de coordinación y de interlocución social para la igualdad de mujeres y hombres están formados por:",["Estructuras de coordinación interdepartamental para la igualdad de mujeres y hombres, estructuras de coordinación intradepartamental para la igualdad de mujeres y hombres y estructuras de interlocución social para la igualdad de mujeres y hombres.","Estructuras de coordinación interdepartamental para la igualdad de mujeres y hombres y estructuras de coordinación intradepartamental para la igualdad de mujeres y hombres.","Estructuras de coordinación interdepartamental para la igualdad de mujeres y hombres y estructuras de interlocución social para la igualdad de mujeres y hombres.","Estructuras de coordinación intradepartamental para la igualdad de mujeres y hombres y estructuras de interlocución social para la igualdad de mujeres y hombres."],0],[393,16,"De acuerdo con la Norma Foral 2/2015, de 9 de marzo, la Diputación Foral de Gipuzkoa garantizará la capacitación especializada en materia de igualdad de mujeres y hombres de:",["Todo el personal.","Los y las jefes y jefas de servicio.","Los y las jefes y jefas de servicio, los y las jefes y jefas de sección y el personal técnico de igualdad.","El personal técnico de igualdad."],3],[394,16,"El órgano competente de la Diputación Foral de Gipuzkoa para el desarrollo de las políticas específicas para la igualdad de mujeres y hombres será:",["El Órgano para la Igualdad de Mujeres y Hombres.","La Diputada Foral de Cuidados y Políticas Sociales.","El Órgano de coordinación interdepartamental de carácter político y de carácter técnico.","El Órgano de coordinación intradepartamental de carácter político y de carácter técnico."],0],[395,16,"De acuerdo con la Norma Foral 2/2015, de 9 de marzo, ¿a qué área de actuación corresponde la promoción del cambio de valores y lucha contra los prejuicios que obstaculizan la participación sociopolítica de las mujeres y otras personas transgresoras del orden heteropatriarcal?",["El fomento de las políticas públicas locales para la igualdad de mujeres y hombres.","Garantizar el apoyo a redes y prácticas feministas.","El desarrollo de medidas de sensibilización social, conocimiento y práctica que permitan transitar hacia un modelo de organización socio-económica en igualdad que coloque el cuidado de las personas en el centro.","Impulsar la coordinación en el diseño, seguimiento y evaluación de la política foral de lucha contra la violencia machista con el departamento de la Diputación Foral de Gipuzkoa al que se le atribuyen las funciones y competencias en materia de política social, articulada en el marco de la política foral para la igualdad de mujeres y hombres."],1],[396,17,"Los sujetos obligados a cumplir la normativa de publicidad activa deberán publicar:",["La relación de los convenios suscritos.","La relación de los convenios una vez auditados por el Tribunal de Cuentas.","El texto íntegro de los convenios suscritos.","Los proyectos de convenio cuando su importe supere el importe establecido por el Derecho de la Unión Europea."],0],[397,17,"Los sujetos obligados a cumplir la normativa de publicidad activa deberán publicar:",["Las memorias e informes que conformen los expedientes sancionadores.","Las memorias e informes que conformen los expedientes de gestión tributaria.","Las memorias e informes que conformen los expedientes de elaboración de los textos normativos.","Las memorias e informes que conformen los expedientes de responsabilidad patrimonial."],2],[398,17,"Conforme al art. 15 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿se puede conceder una petición de acceso a información pública que concierna a datos personales que hagan referencia a la salud de las personas?",["Sí, pero solo cuando se cuente con el consentimiento expreso de la persona afectada o la petición estuviera amparada por una norma con rango de ley.","No, procede la denegación en todos los casos.","Sí, previa ponderación suficientemente razonada del interés público en la divulgación de la información y del derecho de la persona afectada, sin necesidad de su consentimiento ni de habilitación legal o reglamentaria.","Sí, sin limitación alguna."],0],[399,17,"La solicitud de acceso a la información pública:",["Puede ser anónima.","Debe justificar los motivos por los que desea acceder a la información.","Deberá dirigirse al titular del órgano administrativo o entidad que posea la información.","Es un derecho de petición del art. 29 de la Constitución."],2],[400,17,"¿Cuál de las siguientes afirmaciones es verdadera?",["La resolución que conceda o deniegue la solicitud de acceso a información pública es irrecurrible en vía contencioso-administrativa.","La resolución que dé respuesta a la solicitud de acceso a información pública deberá dictarse y notificarse en el plazo máximo de seis meses desde la recepción de la solicitud por el órgano competente para resolver.","Trascurrido el plazo máximo legal para el dictado y notificado de la resolución expresa de la solicitud de acceso, se entenderá que la solicitud ha sido estimada.","Serán motivadas, entre otras, las resoluciones de acceso a información pública cuando concedan el acceso parcial."],3],[401,17,"Las disposiciones en materia de publicidad activa serán aplicables a:",["Los partidos políticos.","Todas las entidades privadas que perciban durante el período de un año ayudas o subvenciones públicas.","Todas las sociedades mercantiles en cuyo capital social tengan alguna participación las Administraciones.","Todas las fundaciones que reciban aportaciones de las Administraciones."],0],[402,17,"La normativa de publicidad activa obliga a publicar:",["El texto íntegro de todos los contratos.","La información relativa a los contratos menores, con carácter mensual.","Los presupuestos, con descripción de todas las partidas presupuestarias.","Las cuentas anuales que deban rendirse."],3],[403,17,"La normativa de publicidad activa obliga a publicar:",["Las declaraciones trimestrales de bienes y actividades de los representantes locales.","Las resoluciones de autorización o reconocimiento de compatibilidad que afecten a los empleados públicos.","La relación de los bienes muebles e inmuebles que sean de su propiedad.","Las retribuciones percibidas anualmente por todos los empleados."],1],[404,17,"¿Cuál de las siguientes afirmaciones sobre el ejercicio de derecho acceso a la información pública previsto en la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno es INCORRECTA?",["El solicitante no está obligado a motivar su solicitud de acceso a la información.","Se inadmitirán a trámite, mediante resolución motivada, las solicitudes relativas a información para cuya divulgación sea necesaria una acción previa de reelaboración.","Transcurrido el plazo máximo para resolver sin que se haya dictado y notificado resolución expresa se entenderá que la solicitud ha sido estimada.","Si la información solicitada pudiera afectar a derechos o intereses de terceros, debidamente identificados, se les concederá un plazo de quince días para que puedan realizar las alegaciones que estimen oportunas."],2],[405,17,"¿Quiénes tienen derecho de acceso a la información pública?",["Solo las personas que tengan residencia en el ámbito de actuación del sujeto obligado.","Solo las personas físicas.","Solo las personas con nacionalidad en uno de los Estados Miembros de la Unión Europea.","Todas las personas."],3],[406,17,"La publicación de la información relativa a los contratos menores:",["Deberá realizarse mensualmente.","Deberá realizarse trimestralmente.","Podrá realizarse mensualmente.","Podrá realizarse trimestralmente."],3],[407,17,"Si la información solicitada pudiera afectar a derechos o intereses de terceros, debidamente identificados:",["Se realizará el trámite de información pública en el boletín oficial.","Se les concederá un plazo de quince días para que puedan realizar las alegaciones que estimen oportunas.","Se solicitará dictamen al órgano consultivo correspondiente.","Se podrá interponer recurso ante el Consejo de Transparencia."],1],[408,17,"Los ciudadanos y las ciudadanas de Gipuzkoa podrán denunciar los incumplimientos de las obligaciones de publicidad activa y atención a las solicitudes sobre derecho de información pública:",["Ante el Consejo de Gobierno de la Diputación Foral.","Ante el/la diputado/a foral competente en materia de transparencia.","Ante la Comisión de Reclamaciones en materia de Transparencia.","Ante la Comisión Arbitral del País Vasco."],2],[409,17,"De acuerdo con la Ley 19/2013, la información sujeta a las obligaciones de transparencia:",["Será publicada en los correspondientes boletines oficiales de una manera clara, estructurada y entendible para los interesados y, preferiblemente, en formatos reutilizables.","Será publicada en las correspondientes sedes electrónicas o páginas web y de una manera clara, estructurada y entendible para los interesados y, preferiblemente, en formatos reutilizables.","Será publicada en las correspondientes sedes electrónicas o páginas web y de una manera clara, estructurada y entendible para los interesados y, preferiblemente, en formatos no reutilizables.","Será comprensible, de acceso fácil y se exigirá el pago de una cantidad que no exceda de su coste real."],1],[410,17,"La Norma Foral 4/2019, de 11 de marzo de Buen Gobierno en el marco de la gobernanza pública foral, en relación a la resolución que resuelva el derecho de acceso a la información pública, señala que:",["La resolución que se dicte será susceptible de reclamación potestativa ante la Comisión de Reclamaciones en materia de Transparencia en el plazo de un mes.","La resolución que se dicte será susceptible de reclamación potestativa ante el Consejo de Transparencia y Buen Gobierno en el plazo de un mes.","La resolución que se dicte será susceptible únicamente de recurso contencioso-administrativo.","La resolución que se dicte será susceptible de recurso potestativo de reposición ante el diputado o diputada general o la diputada o diputado foral del departamento que ha tramitado la solicitud en el plazo de un mes."],0],[411,17,"La Norma Foral 4/2019, de 11 de marzo de Buen Gobierno en el marco de la gobernanza pública foral, en relación a la apertura y reutilización de datos, dispone que:",["La apertura de datos se hará de forma progresiva en función de los recursos humanos y materiales de que disponga la Administración, priorizando aquellos de mayor impacto y utilidad, así como aquellos más solicitados por la ciudadanía.","La apertura de datos se hará de forma progresiva en base a lo dispuesto en el Plan Estratégico vigente, que priorizará aquellos de mayor impacto y utilidad, así como aquellos más solicitados por la ciudadanía.","La apertura de datos se hará de forma progresiva en base a lo dispuesto en el Plan Estratégico vigente, que priorizará aquellos de contenido tributario por ser la información que más impacto económico conllevan.","La apertura de datos se hará de forma paulatina en función de los recursos humanos y económicos de que disponga la Administración, priorizando aquellos más solicitados por la ciudadanía."],0],[412,17,"De conformidad con la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno (LTAIP), para acceder a una determinada información, ¿es necesario que el procedimiento del que forme parte se encuentre terminado?",["Sí, ya que según lo dispuesto en el artículo 18 de la LTAIP, se inadmitirán a trámite las solicitudes que se refieran a información que esté en curso de elaboración o de publicación general.","Sí, puesto que el concepto de información pública se refiere a la información sujeta a las obligaciones de publicidad activa, según los artículos 6 a 8 de la LTAIP, por lo que es necesario que el procedimiento al que pertenezca esté terminado.","No, puesto que la LTAIP únicamente vincula la posibilidad de acceder a una determinada información a que los expedientes o procedimientos hayan sido tramitados en el ejercicio de sus funciones.","No, puesto que la LTAIP no condiciona el acceso a la información al estado del expediente o procedimiento administrativo en el que dicha información se haya elaborado o recibido por parte de la Administración."],3],[413,17,"Según el artículo 19.3 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno (LTAIP), cuando la información solicitada afecta a derechos o intereses de terceros:",["Esos terceros tienen veinte días para presentar alegaciones que estimen oportunas, y el plazo para dictar resolución se suspende, informándose de ello al solicitante.","Esos terceros tienen quince días para presentar alegaciones que estimen oportunas, y el plazo para dictar resolución se ampliará por ese periodo, informándose de ello al solicitante.","Se remitirá la solicitud a los terceros para que decidan sobre el acceso, en el plazo de veinte días.","Esos terceros tienen quince días para presentar alegaciones que estimen oportunas y el plazo para dictar resolución se suspende, informándose de ello al solicitante."],3],[414,17,"De conformidad con la Norma Foral 4/2019, de 11 de marzo, de Buen Gobierno en el marco de la gobernanza pública foral, las solicitudes de acceso a la información y datos abiertos contendrán la siguiente información:",["Identidad de la persona solicitante, que se corresponderá con una persona física.","Información a la que desea tener acceso y el motivo.","Formato o forma de materializar la información y dirección de contacto, preferentemente electrónica.","La solicitud se deberá hacer por cualquier medio escrito (presencial o electrónico) y bastará con especificar la información a la que se desea tener acceso."],2],[415,17,"Según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿qué debe hacer el sujeto al que se dirige la solicitud si la información solicitada está en su poder, pero ha sido elaborada o generada en su integridad o parte principal por otro?",["Pedirá al solicitante que subsane la solicitud en un plazo de diez días, con indicación de que, en caso de no hacerlo, se le tendrá por desistido, así como de la suspensión del plazo para dictar resolución.","Pedirá al solicitante que subsane la solicitud en un plazo de quince días, con indicación de que, en caso de no hacerlo, se le tendrá por desistido, así como de la suspensión del plazo para dictar resolución.","Si la información solicitada obra en el poder del sujeto al que se dirige la solicitud, éste será quien resuelva previa consulta al sujeto que elaboró o generó la información en su integridad o parte principal.","Deberá remitir la solicitud al sujeto que elaboró o generó la información en su integridad o parte principal para que decida sobre el acceso."],3],[416,17,"De conformidad con la Norma Foral 4/2019, de 11 de marzo, de Buen Gobierno en el marco de la gobernanza pública foral, la Diputación Foral, en el ámbito de sus competencias, publicará:",["En cuanto a la información de relevancia jurídica, publicará el texto completo de todos los acuerdos adoptados por el Consejo de Gobierno Foral.","En cuanto a la información sobre el personal cargo público foral, publicará la relación de viajes oficiales realizados con indicación de su objeto, lugar de destino, fecha, participantes y coste.","En cuanto a la información sobre contratación, publicará el plan anual de contratación pública de contratos a partir del valor estimado de 100.000 euros en caso de servicios y suministros o de 1.000.000 euros en el de obras y concesión de obras y servicios.","En cuanto a la información sobre subvenciones, en las concedidas en régimen de libre concurrencia competitiva bastará con la publicación del importe, objetivo, finalidad y personas beneficiarias."],1],[417,17,"De conformidad con la Norma Foral 4/2019, de 11 de marzo, de Buen Gobierno en el marco de la gobernanza pública foral, en el ámbito de la Diputación Foral, ¿cuál de las siguientes afirmaciones es correcta respecto a la tramitación del expediente de acceso?",["En el ámbito de la Diputación Foral, la solicitud se tramitará por el Servicio del departamento en cuyo poder se encuentre la información solicitada.","Las Secretarías Técnicas de los departamentos prestarán la máxima colaboración y darán la máxima prioridad a las peticiones que reciban de los servicios de los departamentos o unidad administrativa tramitadora.","Si la información solicitada se encuentra en poder de varios departamentos, corresponderá la tramitación a la Secretaría Técnica o unidad administrativa del departamento que la haya elaborado o generado en su parte principal.","Si la información solicitada se encuentra en poder de varios departamentos, corresponderá la tramitación a los servicios o unidad administrativa del departamento que la haya elaborado o generado en último lugar."],2],[418,18,"Las personas vinculadas al fallecido por razones familiares o de hecho así como sus herederos:",["Podrán solicitar al responsable del tratamiento el acceso a los datos personales de la persona fallecida.","No podrán solicitar al responsable del tratamiento el acceso a los datos personales de la persona fallecida.","Podrán acceder a los datos personales de la persona fallecida aunque ésta lo hubiese prohibido expresamente.","No podrán solicitar al responsable del tratamiento la rectificación de los datos personales de la persona fallecida."],0],[419,18,"Según la Ley orgánica 3/2018, de 5 de diciembre, de Protección de Datos de Personales y garantía de los derechos digitales, ¿cómo casa el deber de secreto impuesto en esta Ley orgánica con el deber médico de secreto profesional?",["Prevalece el secreto médico profesional sobre la protección de datos de carácter personal.","Prevalece la protección de datos de carácter personal sobre el secreto médico profesional.","Ambos serán complementarios.","No puede darse la confluencia entre ambos, ya que la Ley Orgánica 3/2018 no es de aplicación a datos personales relacionados con la salud."],2],[420,18,"Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales NO es de aplicación a:",["A cualquier tratamiento totalmente automatizado de datos personales.","Al tratamiento no automatizado de datos personales contenidos o destinados a ser incluidos en un fichero.","A cualquier tratamiento parcialmente automatizado de datos personales.","A los tratamientos de datos personales sometidos a la normativa sobre protección de materias clasificadas."],3],[421,18,"El tratamiento de datos personales podrá considerarse fundado en el cumplimiento de una obligación legal exigible al responsable, cuando así lo prevea:",["Una norma de Derecho de la Unión Europea o una norma con rango de ley.","Una norma de Derecho de la Unión Europea o una norma con rango de ley o de reglamento.","Una decisión motivada del órgano administrativo competente.","Una decisión motivada del órgano administrativo competente únicamente amparada en motivos de interés general."],0],[422,18,"Las personas vinculadas al fallecido por razones familiares o de hecho, así como sus herederos:",["No podrán acceder a los datos del causante cuando la persona fallecida lo hubiese prohibido expresamente.","No podrán dirigirse en ningún caso al responsable o encargado del tratamiento al objeto de solicitar el acceso a los datos personales.","Podrán acceder en cualquier caso a los datos personales del fallecido.","No podrán acceder a los datos de carácter patrimonial del causante."],0],[423,18,"El derecho de acceso del afectado se ejercitará sin ninguna limitación:",["Cualquiera que sea la cantidad de datos relativos al afectado.","Aunque el ejercicio del derecho de acceso se haya producido en más de una ocasión durante el plazo de seis meses.","Aunque el ejercicio del derecho de acceso se haya producido en más de una ocasión durante el plazo de tres meses.","Cualquiera que sea la cantidad de datos relativos al afectado siempre que especifique los datos o actividades de tratamiento a los que se refiere la solicitud."],3],[424,18,"Las imágenes captadas a través de sistemas de cámaras o videocámaras para el ejercicio de las funciones de control de los trabajadores:",["Se podrá obtener aunque los empleadores no hayan informado con carácter previo.","No se podrán obtener en ningún caso.","No se podrán obtener en lugares destinados al descanso o esparcimiento de los trabajadores.","Se podrán obtener en todo caso para la grabación de sonidos en el lugar de trabajo."],2],[425,18,"Según la Ley 3/2018, de 5 de diciembre, de Protección de Datos Personales y Garantía de los Derechos Digitales, los datos serán:",["Genéricos.","Secretos.","Exactos.","Inexactos."],2],[426,18,"Señale la respuesta correcta. El empleador podrá acceder a los contenidos derivados del uso de medios digitales facilitados a los trabajadores:",["Durante el horario laboral.","A los solos efectos de controlar el cumplimiento de las obligaciones laborales o estatutarias.","A los solos efectos de garantizar la integridad de dichos dispositivos.","A los solos efectos de controlar el cumplimiento de las obligaciones laborales o estatutarias y de garantizar la integridad de dichos dispositivos."],3],[427,18,"En relación con el tratamiento de los datos de los menores de la edad, la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de derechos digitales, señala que:",["El tratamiento fundado en el consentimiento sólo será licito cuando sea mayor de catorce años y en los casos en que una ley así lo prevea.","El tratamiento fundado en el consentimiento de los menores de catorce años sólo será licito si consta el del titular de la patria potestad o tutela.","El tratamiento fundado en el consentimiento de los menores de catorce años deberá autorizarlo el Ministerio Fiscal.","El tratamiento fundado en el consentimiento de los menores de catorce años no procede en ningún caso."],1],[428,18,"En relación a los derechos de protección de datos de carácter personal, ¿en quién recae la carga de la prueba del cumplimiento del deber de responder a la solicitud de ejercicio de sus derechos formulada por la persona afectada?",["Sobre el propio afectado, titular de los datos personales.","Sobre el responsable del tratamiento de datos personales.","Sobre el encargado del tratamiento de datos personales, que actúa por cuenta del responsable.","Sobre el encargado del tratamiento de datos personales, siempre que así se establezca en el contrato o acto jurídico que les vincule."],1],[429,18,"En relación a la garantía de los derechos digitales, Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de derechos digitales, define el derecho al olvido en búsquedas de internet, que implica:",["Que los motores de búsqueda de internet eliminen de las listas de resultados que se obtuvieran tras una búsqueda efectuada a partir de un nombre los enlaces publicados que contengan información relativa a esa persona, eliminando toda información que se contenga en la web.","Que los motores de búsqueda de internet eliminen de las listas de resultados que se obtuvieran tras una búsqueda efectuada a partir de un nombre los enlaces publicados que contengan información relativa a esa persona, aunque la información se mantenga en la web.","Que los motores de búsqueda de internet eliminen todas las listas de resultados que contengan la información sobre una persona obtenidas a través de cualquier tipo de búsqueda.","Que los motores de búsqueda de internet eliminen todas las listas de resultados que contengan la información sobre una persona en las redes sociales y servicios equivalentes."],1],[430,18,"De conformidad con el Reglamento (UE) 2016/679 General de Protección de datos, en base al derecho de supresión («el derecho al olvido»):",["Con el cumplimiento de determinadas circunstancias, el interesado tendrá derecho a obtener sin dilación indebida del responsable del tratamiento la supresión de los datos personales que le conciernan.","El interesado siempre tendrá derecho a obtener sin dilación indebida del responsable del tratamiento la supresión de los datos personales que le conciernan, salvo que el propio interesado haya hecho públicos los datos personales.","El interesado tiene derecho a que los motores de búsqueda en Internet eliminen de las listas de resultados que se obtuvieran tras una búsqueda efectuada a partir de su nombre los enlaces publicados que contuvieran información relativa a su persona.","Únicamente, cuando los datos personales hayan sido tratados ilícitamente, el interesado tendrá derecho a obtener sin dilación indebida del responsable del tratamiento la supresión de los datos personales que le conciernan."],0],[431,18,"Según el artículo 11.2 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de derechos digitales, cuando los datos personales sean obtenidos del afectado, el responsable del tratamiento podrá dar cumplimiento al deber de información facilitando al afectado la información básica. ¿Qué contenido mínimo deberá tener esta información?",["La identidad del responsable del tratamiento y de su representante, en su caso. La finalidad del tratamiento.","La identidad del responsable del tratamiento. Los datos de contacto del delegado de protección de datos. La fina
