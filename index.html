todo caso, estarán obligados a relacionarse a través de medios electrónicos con las Administraciones Públicas:",["Las personas físicas.","Las personas jurídicas.","Las personas físicas y las personas jurídicas.","Las personas físicas, las personas jurídicas y las entidades sin personalidad jurídica."],1],[211,9,"Según la Ley 39/2015, la Administración:",["Está obligada a dictar resolución expresa y a notificarla en todos los procedimientos cualquiera que sea su forma de iniciación, exceptuando los supuestos de terminación del procedimiento por pacto o convenio, así como los procedimientos relativos al ejercicio de derechos sometidos únicamente al deber de declaración responsable o comunicación a la Administración.","Está obligada, en todo caso, a dictar resolución expresa y a notificarla en todos los procedimientos cualquiera que sea su forma de iniciación.","No está obligada a dictar resolución expresa y a notificarla en los casos de prescripción, renuncia del derecho, caducidad del procedimiento o desistimiento de la solicitud, así como de desaparición sobrevenida del objeto del procedimiento.","No está obligada a dictar resolución expresa y a notificarla en ningún caso."],0],[212,9,"Según la Ley 39/2015, el transcurso del plazo máximo legal para resolver un procedimiento y notificar la resolución se suspenderá en el siguiente caso:",["Cuando deba requerirse a cualquier interesado para la subsanación de deficiencias o la aportación de documentos y otros elementos de juicio necesarios, por el tiempo que medie entre la notificación del requerimiento y su efectivo cumplimiento por el destinatario, o, en su defecto, por el del plazo concedido, todo ello sin perjuicio de lo previsto en el artículo 68 de la Ley 39/2015.","Cuando deba obtenerse un pronunciamiento previo y preceptivo de un órgano de la Unión Europea, por el tiempo que medie entre la petición, que habrá de comunicarse a los interesados, y la notificación del pronunciamiento a la Administración instructora, que también deberá serles comunicada.","Cuando los interesados promuevan la recusación en cualquier momento de la tramitación de un procedimiento, desde que ésta se plantee hasta que sea resuelta por el superior jerárquico del recusado.","Cuando se soliciten informes preceptivos a un órgano de la misma o distinta Administración, por el tiempo que medie entre la petición, que deberá comunicarse a los interesados, y la recepción del informe, que igualmente deberá ser comunicada a los mismos. Este plazo de suspensión no podrá exceder en ningún caso de tres meses. En caso de no recibirse el informe en el plazo indicado, proseguirá el procedimiento."],2],[213,9,"Según la Ley 39/2015, señale la respuesta correcta respecto a los procedimientos iniciados a solicitud del interesado:",["La resolución expresa posterior a la producción del acto sólo podrá dictarse de ser confirmatoria del mismo.","La resolución expresa posterior a la producción del acto se adoptará por la Administración sin vinculación alguna al sentido del silencio.","En los casos de estimación por silencio administrativo, la resolución expresa posterior a la producción del acto sólo podrá dictarse de ser confirmatoria del mismo y en los casos de desestimación por silencio administrativo, la resolución expresa posterior al vencimiento del plazo se adoptará por la Administración sin vinculación alguna al sentido del silencio.","En los casos de estimación por silencio administrativo, la resolución expresa posterior a la producción del acto se adoptará por la Administración sin vinculación alguna al sentido del silencio y en los casos de desestimación por silencio administrativo, la resolución expresa posterior al vencimiento del plazo sólo podrá dictarse de ser confirmatoria del mismo."],2],[214,9,"Según la Ley 39/2015, en los procedimientos iniciados de oficio de los que pudiera derivarse el reconocimiento de derechos, el vencimiento del plazo máximo sin resolución expresa:",["Producirá la caducidad del procedimiento.","Permitirá a los interesados entender estimadas sus pretensiones por silencio administrativo, salvo en los procedimientos relativos al ejercicio del derecho de petición.","Permitirá a los interesados entender estimadas sus pretensiones por silencio administrativo.","Permitirá a los interesados entender desestimadas sus pretensiones por silencio administrativo."],3],[215,9,"Según la Ley 39/2015, tendrán la consideración de copias auténticas de un documento público administrativo:",["Las fotocopias simples realizadas por el interesado.","Las realizadas por los órganos competentes de las Administraciones Públicas en las que quede garantizada la identidad del órgano que ha realizado la copia y su contenido.","Cualquier documento escaneado enviado por correo electrónico.","Las fotografías realizadas con un dispositivo móvil, siempre y cuando se envíen posteriormente mediante firma electrónica autorizada del interesado."],1],[216,9,"Según la Ley 39/2015, los interesados tienen derecho a no aportar documentos que:",["Consideren confidenciales o íntimos.","Ya se encuentren en poder de la Administración actuante o hayan sido elaborados por cualquier otra Administración.","Tengan una antigüedad superior a 5 años.","Tengan un coste de expedición superior a 20 euros."],1],[217,9,"Según la Ley 39/2015, siempre que por Ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días:",["Se entiende que éstos son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos.","Se entiende que éstos son naturales, excluyéndose del cómputo los sábados, los domingos y los declarados festivos.","Se entiende que éstos son hábiles, excluyéndose del cómputo los domingos y los declarados festivos.","Se entiende que éstos son naturales, excluyéndose del cómputo los domingos y los declarados festivos."],0],[218,9,"Según la Ley 39/2015, señale la respuesta correcta respecto al cómputo de plazos:",["Los plazos expresados por horas se contarán de hora en hora y de minuto en minuto desde la hora y minuto en que tenga lugar la notificación o publicación del acto de que se trate y no podrán tener una duración superior a cuarenta y ocho horas, en cuyo caso se expresarán en días.","Los plazos expresados en días se contarán a partir del día siguiente a aquel en que tenga lugar la notificación o publicación del acto de que se trate, o desde el siguiente a aquel en que se produzca la estimación o la desestimación por silencio administrativo.","Cuando el último día del plazo sea inhábil, se entenderá que el plazo expira en el primer día hábil anterior.","Si el plazo se fija en meses, si en el mes de vencimiento no hubiera día equivalente a aquel en que comienza el cómputo, se entenderá que el plazo expira el primer día del siguiente mes."],1],[219,9,"Según la Ley 39/2015, señale la respuesta correcta respecto a las reglas de funcionamiento del registro electrónico:",["Permitirá la presentación de documentos todos los días hábiles del año durante las veinticuatro horas.","Permitirá la presentación de documentos todos los días hábiles del año durante la jornada laboral de la Administración Pública correspondiente.","A los efectos del cómputo de plazo fijado en días hábiles, y en lo que se refiere al cumplimiento de plazos por los interesados, la presentación en un día inhábil se entenderá realizada en la primera hora del primer día hábil siguiente salvo que una norma permita expresamente la recepción en día inhábil.","A los efectos del cómputo de plazo fijado en días hábiles, y en lo que se refiere al cumplimiento de plazos por los interesados, la presentación en un día inhábil se entenderá el primer día hábil anterior."],2],[220,9,"Según la Ley 39/2015, señale la respuesta correcta respecto a la ampliación de plazos:",["La Administración, salvo precepto en contrario, podrá conceder de oficio o a petición de los interesados, una ampliación de los plazos establecidos, que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan, aun cuando con ello se perjudiquen derechos de terceros.","La petición de los interesados sobre la ampliación deberá producirse, en todo caso, antes del vencimiento del plazo de que se trate y la decisión sobre la ampliación deberá adoptarse dentro de los diez días hábiles siguiente al vencimiento del plazo.","Cuando una incidencia técnica haya imposibilitado el funcionamiento ordinario del sistema o aplicación que corresponda, y hasta que se solucione el problema, la Administración podrá determinar una ampliación de los plazos no vencidos, debiendo publicar en la sede electrónica tanto la incidencia técnica acontecida como la ampliación concreta del plazo no vencido.","Los acuerdos sobre ampliación de plazos o sobre su denegación podrán recurrirse de acuerdo con lo previsto en el artículo 112 y siguientes de la ley."],2],[221,9,"Según la Ley 39/2015, los actos administrativos se producirán por escrito a través de medios electrónicos, a menos que:",["El interesado sea una persona física.","El interesado solicite que se realice a través de otros medios.","Una incidencia técnica lo impida, en cuyo caso se realizará de forma verbal.","Su naturaleza exija otra forma más adecuada de expresión y constancia."],3],[222,9,"Según la Ley 39/2015, señale la respuesta correcta respecto a la notificación:",["Toda notificación deberá ser cursada dentro del plazo de quince días a partir de la fecha en que el acto haya sido dictado.","La notificación deberá contener el texto íntegro de la resolución, con indicación de si pone fin o no a la vía administrativa, la expresión de los recursos que procedan, en su caso, en vía administrativa y judicial, el órgano ante el que hubieran de presentarse y el plazo para interponerlos, sin perjuicio de que los interesados puedan ejercitar, en su caso, cualquier otro que estimen procedente.","Las notificaciones que, conteniendo el texto íntegro del acto, omitiesen alguno de los demás requisitos previstos en el apartado anterior, surtirán efecto a desde la fecha en que se dicten, siempre y cuando el interesado realice actuaciones que supongan el conocimiento del contenido y alcance de la resolución o acto objeto de la notificación, o interponga cualquier recurso que proceda.","Con independencia de que la notificación se realice en papel o por medios electrónicos, las Administraciones Públicas enviarán un aviso al dispositivo electrónico y/o a la dirección de correo electrónico del interesado que éste haya comunicado, informándole de la puesta a disposición de una notificación en la sede electrónica de la Administración u Organismo correspondiente o en la dirección electrónica habilitada única. La falta de práctica de este aviso impedirá que la notificación sea considerada plenamente válida."],1],[223,9,"Según la Ley 39/2015, en las notificaciones practicadas en papel, de no hallarse presente el interesado en el momento de la entrega, podrá hacerse cargo de la misma:",["Cualquier persona mayor de 14 años que se encuentre en el domicilio y haga constar su identidad.","Cualquier persona mayor de 14 años que sea familiar de primer grado y que se encuentre en el domicilio y haga constar su identidad.","Cualquier vecino mayor de edad y haga constar su identidad.","Cualquier persona mayor de edad que se encuentre en el domicilio y haga constar su identidad."],0],[224,9,"Según la Ley 39/2015, en todo caso, los actos administrativos serán objeto de publicación, surtiendo ésta los efectos de la notificación, entre otros, en el siguiente caso:",["Cuando se trate de actos que limiten derechos subjetivos o intereses legítimos.","Cuando se trate de actos que se separen del criterio seguido en actuaciones precedentes o del dictamen de órganos consultivos.","Cuando se trate de actos que acuerden la terminación del procedimiento por la imposibilidad material de continuarlo por causas sobrevenidas, así como cuando acuerden el desistimiento por la Administración en procedimientos iniciados de oficio.","Cuando se trate de actos integrantes de un procedimiento selectivo o de concurrencia competitiva de cualquier tipo. En este caso, la convocatoria del procedimiento deberá indicar el medio donde se efectuarán las sucesivas publicaciones, careciendo de validez las que se lleven a cabo en lugares distintos."],3],[225,9,"Según la Ley 39/2015, son anulables los actos de la Administración que:",["Lesionen los derechos y libertades susceptibles de amparo constitucional.","Sean constitutivos de infracción penal o se dicten como consecuencia de ésta.","Se dicten prescindiendo total y absolutamente del procedimiento legalmente establecido o de las normas que contienen las reglas esenciales para la formación de la voluntad de los órganos colegiados.","Incurran en cualquier infracción del ordenamiento jurídico, incluso la desviación de poder."],3],[226,9,"Señale la respuesta correcta respecto a los límites a la extensión de la nulidad o anulabilidad de los actos:",["La nulidad o anulabilidad de un acto implicará la de los sucesivos en el procedimiento.","La nulidad o anulabilidad en parte del acto administrativo implicará la de las partes del mismo independientes de aquélla.","El órgano que declare la nulidad o anule las actuaciones dispondrá siempre la conservación de aquellos actos y trámites cuyo contenido se hubiera mantenido igual de no haberse cometido la infracción.","La Administración podrá convalidar los actos nulos."],2],[227,9,"De acuerdo con la Ley 39/2015, los procedimientos:",["Se iniciarán siempre de oficio.","Se iniciarán siempre a solicitud del interesado.","Podrán iniciarse de oficio o a solicitud del interesado.","Podrán iniciarse de oficio o a solicitud de los interesados, cuando el número de interesados sea significativo."],2],[228,9,"Iniciado el procedimiento, el órgano administrativo competente para resolver:",["Podrá adoptar, únicamente de oficio y de forma motivada, las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, si existiesen elementos de juicio suficientes para ello, de acuerdo con los principios de proporcionalidad, efectividad y menor onerosidad.","Podrá adoptar, de oficio o a instancia de parte y de forma motivada, las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, si existiesen elementos de juicio suficientes para ello, de acuerdo con los principios de proporcionalidad, efectividad y menor onerosidad.","Podrá adoptar, únicamente de oficio y de forma motivada, las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, con independencia de que existiesen elementos de juicio suficientes para ello.","Podrá adoptar, de oficio o a instancia de parte y de forma motivada, las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, con independencia de que existiesen elementos de juicio suficientes para ello."],1],[229,9,"Antes de la iniciación del procedimiento administrativo, el órgano competente para iniciar o instruir el procedimiento, de oficio o a instancia de parte, podrá adoptar de forma motivada las medidas provisionales que resulten necesarias y proporcionadas:",["En los casos de urgencia inaplazable y para la protección provisional de los intereses implicados.","En todos los casos.","Solo en los procedimientos sancionadores.","Solo en los procedimientos de responsabilidad patrimonial."],0],[230,9,"No se podrán adoptar medidas provisionales:",["Que puedan causar perjuicio de difícil o imposible reparación a los interesados o que impliquen violación de derechos amparados por las leyes.","Cuando así lo solicite la persona interesada.","Cuando el plazo para la resolución del procedimiento sea menor a 1 año.","Cuando otras administraciones públicas puedan ser afectadas por las medidas a adoptar y muestren su disconformidad en un plazo de 10 días"],0],[231,9,"Señale la respuesta correcta. Los procedimientos se iniciarán de oficio por acuerdo del órgano competente:",["Exclusivamente por propia iniciativa o como consecuencia de orden superior.","Exclusivamente por propia iniciativa o a petición de otros órganos.","Bien por propia iniciativa o como consecuencia de orden superior, a petición de otros órganos o por denuncia.","Bien por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia."],3],[232,9,"Según la Ley 39/2015, se entiende por propia iniciativa:",["La actuación derivada del conocimiento directo o indirecto de las circunstancias, conductas o hechos objeto del procedimiento por el órgano que tiene atribuida la competencia de iniciación.","La actuación derivada del conocimiento directo de las circunstancias, conductas o hechos objeto del procedimiento por el órgano que tiene atribuida la competencia de iniciación.","La actuación derivada del conocimiento indirecto de las circunstancias, conductas o hechos objeto del procedimiento por el órgano que tiene atribuida la competencia de iniciación.","La orden emitida por el órgano administrativo inmediatamente superior jerárquico del competente para la iniciación del procedimiento."],0],[233,9,"Señale la respuesta correcta:",["Se entiende por denuncia, el acto por el que cualquier persona que acredite estar interesado en el procedimiento, en cumplimiento o no de una obligación legal, pone en conocimiento de un órgano administrativo la existencia de un determinado hecho que pudiera justificar la iniciación de oficio de un procedimiento administrativo.","Las denuncias deberán expresar la identidad de la persona o personas que las presentan y el relato de los hechos que se ponen en conocimiento de la Administración. Cuando dichos hechos pudieran constituir una infracción administrativa, recogerán la fecha de su comisión y deberán identificarse a los presuntos responsables.","Cuando la denuncia invocara un perjuicio en el patrimonio de las Administraciones Públicas la no iniciación del procedimiento deberá ser motivada y se notificará a los denunciantes la decisión de si se ha iniciado o no el procedimiento.","La presentación de una denuncia confiere, por sí sola, la condición de interesado en el procedimiento."],2],[234,9,"Los procedimientos de naturaleza sancionadora:",["Se iniciarán siempre de oficio por acuerdo del órgano competente y establecerán la debida separación entre la fase instructora y la sancionadora, que no podrá encomendarse a órganos distintos.","Se iniciarán siempre de oficio por acuerdo del órgano competente y establecerán la debida separación entre la fase instructora y la sancionadora, que se encomendará a órganos distintos.","Podrán iniciarse de oficio o a solicitud del interesado y establecerán la debida separación entre la fase instructora y la sancionadora, que no podrá encomendarse a órganos distintos.","Podrán iniciarse de oficio o a solicitud del interesado y establecerán la debida separación entre la fase instructora y la sancionadora, que se encomendará a órganos distintos."],1],[235,9,"Señale la respuesta INCORRECTA. Las solicitudes de iniciación de procedimiento que se formulen deberán contener:",["Nombre y apellidos del interesado y, en su caso, de la persona que lo represente.","Identificación del medio electrónico, o en su defecto, lugar físico en que desea que se practique la notificación. Adicionalmente, los interesados deberán aportar su dirección de correo electrónico y/o dispositivo electrónico con el fin de que las Administraciones Públicas les avisen del envío o puesta a disposición de la notificación.","Hechos, razones y petición en que se concrete, con toda claridad, la solicitud.","Órgano, centro o unidad administrativa a la que se dirige y su correspondiente código de identificación."],1],[236,9,"Con carácter general, en los procedimientos de responsabilidad patrimonial:",["El derecho a reclamar prescribirá a los seis meses de producido el hecho o el acto que motive la indemnización o se manifieste su efecto lesivo.","El derecho a reclamar prescribirá al año de producido el hecho o el acto que motive la indemnización o se manifieste su efecto lesivo.","El derecho a reclamar prescribirá a los dos años de producido el hecho o el acto que motive la indemnización o se manifieste su efecto lesivo.","El derecho a reclamar no prescribe."],1],[237,9,"Según la Ley 39/2015, si la solicitud de iniciación de un procedimiento administrativos no reúne los requisitos exigidos:",["Se requerirá al interesado para que, en un plazo de diez días, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por desistido de su petición, previa resolución que deberá ser dictada en los términos previstos en el artículo 21.","Se requerirá al interesado para que, en un plazo improrrogable de diez días, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por desistido de su petición, previa resolución que deberá ser dictada en los términos previstos en el artículo 21.","Se requerirá al interesado para que, en un plazo improrrogable de quince días, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por desistido de su petición, previa resolución que deberá ser dictada en los términos previstos en el artículo 21.","La solicitud será inadmitida."],0],[238,9,"Según el artículo 68 de la Ley 39/2015, el plazo de subsanación o mejora de una solicitud podrá ser ampliado prudencialmente:",["En los procedimientos selectivos.","En los procedimientos de concurrencia competitiva.","En cualquier tipo de procedimiento.","En cualquier tipo de procedimiento, siempre que no se trate de procedimientos selectivos o de concurrencia competitiva."],3],[239,9,"A los efectos de la Ley 39/2015, se entenderá por declaración responsable:",["El documento suscrito por un interesado en el que éste manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente para obtener el reconocimiento de un derecho o facultad o para su ejercicio, que dispone de la documentación que así lo acredita, que la pondrá a disposición de la Administración cuando le sea requerida, y que se compromete a mantener el cumplimiento de las anteriores obligaciones durante el período de tiempo inherente a dicho reconocimiento o ejercicio.","Aquel documento mediante el que los interesados ponen en conocimiento de la Administración Pública competente sus datos identificativos o cualquier otro dato relevante para el inicio de una actividad o el ejercicio de un derecho.","El certificado técnico firmado por un profesional colegiado que garantiza que una obra o instalación cumple con todas las medidas de seguridad exigidas por la ley.","El documento emitido por la Administración Pública que autoriza al interesado a iniciar una actividad económica tras haber pagado las tasas correspondientes."],0],[240,9,"A los efectos de la Ley 39/2015, se entenderá por comunicación:",["El documento suscrito por un interesado en el que éste manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente para obtener el reconocimiento de un derecho o facultad o para su ejercicio, que dispone de la documentación que así lo acredita, que la pondrá a disposición de la Administración cuando le sea requerida, y que se compromete a mantener el cumplimiento de las anteriores obligaciones durante el período de tiempo inherente a dicho reconocimiento o ejercicio.","Aquel documento mediante el que los interesados ponen en conocimiento de la Administración Pública competente sus datos identificativos o cualquier otro dato relevante para el inicio de una actividad o el ejercicio de un derecho.","El certificado técnico firmado por un profesional colegiado que garantiza que una obra o instalación cumple con todas las medidas de seguridad exigidas por la ley.","El documento emitido por la Administración Pública que autoriza al interesado a iniciar una actividad económica tras haber pagado las tasas correspondientes."],1],[241,9,"Según la Ley 39/2015, se entiende por expediente administrativo:",["El conjunto ordenado de documentos y actuaciones que sirven de antecedente y fundamento a la resolución administrativa, así como las diligencias encaminadas a ejecutarla.","Es el documento único y definitivo, firmado por la autoridad competente, que pone fin a un procedimiento y agota la vía administrativa.","Es la suma de los recursos económicos y materiales que una unidad administrativa asigna para la tramitación de un procedimiento de licitación pública.","Es el sistema informático y la base de datos donde se almacenan exclusivamente las notas, borradores y comunicaciones internas que los funcionarios intercambian durante un proceso."],0],[242,9,"Según la Ley 39/2015, los trámites que deban ser cumplimentados por los interesados:",["Deberán realizarse en el plazo de quince días a partir del siguiente al envío de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.","Deberán realizarse en el plazo de diez días a partir del siguiente al envío de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.","Deberán realizarse en el plazo de quince días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.","Deberán realizarse en el plazo de diez días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto."],3],[243,9,"Según la Ley 39/2015, señale la respuesta correcta:",["Los interesados podrán, en cualquier momento del procedimiento anterior a la resolución de la misma, aducir alegaciones y aportar documentos u otros elementos de juicio.","Los interesados solo podrán aducir alegaciones y aportar documentos u otros elementos de juicio cuando así lo solicite el órgano instructor.","Los interesados podrán, en cualquier momento del procedimiento anterior al trámite de audiencia, aducir alegaciones y aportar documentos u otros elementos de juicio.","Los interesados no podrán aducir alegaciones y aportar documentos u otros elementos de juicio una vez iniciado el procedimiento."],2],[244,9,"Salvo disposición expresa en contrario, los informes serán:",["Facultativos y vinculantes.","Facultativos y no vinculantes.","Preceptivos y vinculantes.","Preceptivos y no vinculantes."],1],[245,9,"El informe emitido fuera de plazo:",["Podrá no ser tenido en cuenta al adoptar la correspondiente resolución.","No podrá ser tenido en cuenta al adoptar la correspondiente resolución.","Deberá ser tenido en cuenta al adoptar la correspondiente resolución, siempre y cuando se haya emitido antes de la resolución.","Deberá ser tenido en cuenta al adoptar la correspondiente resolución, siempre y cuando se haya emitido antes del trámite de audiencia."],0],[246,9,"Según la Ley 39/2015, en los procedimientos de responsabilidad patrimonial será preceptivo solicitar dictamen del Consejo de Estado o, en su caso, del órgano consultivo de la Comunidad Autónoma:",["Cuando las indemnizaciones reclamadas sean de cuantía igual o superior a 50.000 euros o a la que se establezca en la correspondiente legislación autonómica, así como en aquellos casos que disponga la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado.","Únicamente cuando las indemnizaciones reclamadas sean de cuantía igual o superior a 50.000 euros o a la que se establezca en la correspondiente legislación autonómica.","Únicamente en aquellos casos que disponga la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado.","En todos los casos."],0],[247,9,"Según la Ley 39/2015, respecto al trámite de audiencia:",["Los interesados, en un plazo inferior a diez días, podrán alegar y presentar los documentos y justificaciones que estimen pertinentes.","Los interesados, en un plazo inferior a quince días, podrán alegar y presentar los documentos y justificaciones que estimen pertinentes.","Los interesados, en un plazo no inferior a quince días ni superior a veinte, podrán alegar y presentar los documentos y justificaciones que estimen pertinentes.","Los interesados, en un plazo no inferior a diez días ni superior a quince, podrán alegar y presentar los documentos y justificaciones que estimen pertinentes."],3],[248,9,"Señale la respuesta correcta respecto a la información pública regulada en la Ley 39/2015:",["El órgano instructor del procedimiento, cuando la naturaleza de éste lo requiera, podrá acordar un período de información pública.","Se publicará un anuncio en la sede electrónica correspondiente a fin de que cualquier persona física o jurídica pueda examinar el expediente, o la parte del mismo que se acuerde.","La incomparecencia en este trámite no impedirá a los interesados interponer los recursos procedentes contra la resolución definitiva del procedimiento.","La comparecencia en el trámite de información pública otorga, por sí misma, la condición de interesado."],2],[249,9,"Señale la respuesta INCORRECTA respecto a la resolución:",["Antes de dictar resolución, el órgano competente para resolver podrá decidir, mediante acuerdo motivado, la realización de las actuaciones complementarias indispensables para resolver el procedimiento.","La resolución que ponga fin al procedimiento decidirá todas las cuestiones planteadas por los interesados y aquellas otras derivadas del mismo.","Cuando se trate de cuestiones conexas que no hubieran sido planteadas por los interesados, el órgano competente no podrá pronunciarse sobre las mismas.","En los procedimientos tramitados a solicitud del interesado, la resolución será congruente con las peticiones formuladas por éste, sin que en ningún caso pueda agravar su situación inicial y sin perjuicio de la potestad de la Administración de incoar de oficio un nuevo procedimiento, si procede."],2],[250,9,"El interesado:",["Podrá desistir de su solicitud o, cuando ello no esté prohibido por el ordenamiento jurídico, renunciar a sus derechos.","Podrá desistir de su solicitud o, cuando ello no esté prohibido por el ordenamiento jurídico, renunciar a sus derechos en un plazo de diez desde su presentación. Finalizado el plazo, la Administración podrá no aceptar el desistimiento o la renuncia.","Podrá desistir de su solicitud o, cuando ello no esté prohibido por el ordenamiento jurídico, renunciar a sus derechos, previo pago de una compensación económica.","No podrá desistir de su solicitud o renunciar a sus derechos."],0],[251,9,"Con arreglo a lo dispuesto en la Ley 39/2015, salvo que reste menos para su tramitación ordinaria, ¿en qué tiempo deberán ser resueltos los procedimientos administrativos tramitados de manera simplificada?",["Diez días, a contar desde la notificación al interesado del acuerdo de tramitación simplificada del procedimiento.","Treinta días, a contar desde la notificación al interesado del acuerdo de tramitación simplificada del procedimiento.","Diez días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento.","Treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento."],3],[252,9,"Según la Ley 39/2015, las Administraciones Públicas, en cualquier momento, por iniciativa propia o a solicitud de interesado, declararán de oficio la nulidad de los actos administrativos que hayan puesto fin a la vía administrativa o que no hayan sido recurridos en plazo, siempre que:",["Sean actos desfavorables para el interesado.","Concurra alguna de las causas de nulidad de pleno derecho previstas en el artículo 47.1 de la Ley 39/2015.","El error sea de carácter puramente material o aritmético.","Haya pasado menos de un año desde su notificación."],1],[253,9,"Podrán interponerse por los interesados los recursos de alzada y potestativo de reposición, que cabrá fundar en cualquiera de los motivos de nulidad o anulabilidad previstos en los artículos 47 y 48 de la Ley 39/2015:",["Contra las resoluciones y los actos de trámite.","Contra las resoluciones y los actos de trámite que pongan fin a la vía administrativa.","Contra las resoluciones y los actos de trámite que no pongan fin a la vía administrativa.","Contra las resoluciones y los actos de trámite, si estos últimos deciden directa o indirectamente el fondo del asunto, determinan la imposibilidad de continuar el procedimiento, producen indefensión o perjuicio irreparable a derechos e intereses legítimos."],3],[254,9,"Según la Ley 39/2015, haber transcurrido el plazo para la interposición del recurso:",["Será causa de desestimación del recurso.","Será causa de desestimación del recurso, salvo que se trate de un recurso potestativo de revisión.","Será causa de inadmisión del recurso.","Será causa de inadmisión del recurso, salvo que se trate de un recurso potestativo de revisión."],2],[255,9,"Señale la respuesta correcta respecto a los recursos de alzada:",["El plazo para la interposición del recurso de alzada será de un mes, si el acto fuera expreso. Transcurrido dicho plazo sin haberse interpuesto el recurso, la resolución será firme a todos los efectos. El plazo máximo para dictar y notificar la resolución será de tres meses.","El plazo para la interposición del recurso de alzada será de tres meses, si el acto fuera expreso. Transcurrido dicho plazo sin haberse interpuesto el recurso, la resolución será firme a todos los efectos. El plazo máximo para dictar y notificar la resolución será de un mes.","El plazo para la interposición del recurso de alzada será de un mes, si el acto fuera expreso. Transcurrido dicho plazo, únicamente podrá interponerse recurso contencioso-administrativo, sin perjuicio, en su caso, de la procedencia del recurso extraordinario de revisión.","El plazo para la interposición del recurso de alzada será de tres meses, si el acto fuera expreso. Transcurrido dicho plazo, únicamente podrá interponerse recurso contencioso-administrativo, sin perjuicio, en su caso, de la procedencia del recurso extraordinario de revisión."],0],[256,9,"Señale la respuesta correcta respecto a los recursos potestativos de reposición:",["El plazo para la interposición del recurso de reposición será de un mes, si el acto fuera expreso. Transcurrido dicho plazo sin haberse interpuesto el recurso, la resolución será firme a todos los efectos. El plazo máximo para dictar y notificar la resolución será de tres meses.","El plazo para la interposición del recurso de reposición será de tres meses, si el acto fuera expreso. Transcurrido dicho plazo sin haberse interpuesto el recurso, la resolución será firme a todos los efectos. El plazo máximo para dictar y notificar la resolución será de un mes.","El plazo para la interposición del recurso de reposición será de un mes, si el acto fuera expreso. Transcurrido dicho plazo, únicamente podrá interponerse recurso contencioso-administrativo, sin perjuicio, en su caso, de la procedencia del recurso extraordinario de revisión.","El plazo para la interposición del recurso de reposición será de tres meses, si el acto fuera expreso. Transcurrido dicho plazo, únicamente podrá interponerse recurso contenciosoadministrativo, sin perjuicio, en su caso, de la procedencia del recurso extraordinario de revisión."],2],[257,10,"Según la Ley 40/2015, para la válida constitución del órgano, a efectos de la celebración de sesiones, deliberaciones y toma de acuerdos:",["Se requerirá la asistencia presencial, del Presidente y Secretario o en su caso, de quienes les suplan, y la asistencia, presencial o a distancia, de la mitad, al menos, de sus miembros.","Se requerirá la asistencia presencial, del Presidente y Secretario o en su caso, de quienes les suplan, y la asistencia, presencial o a distancia, de dos tercios, al menos, de sus miembros.","Se requerirá la asistencia, presencial o a distancia, del Presidente y Secretario o en su caso, de quienes les suplan, y la de la mitad, al menos, de sus miembros.","Se requerirá la asistencia, presencial o a distancia, del Presidente y Secretario o en su caso, de quienes les suplan, y de dos tercios, al menos, de sus miembros."],2],[258,10,"Según la Ley 40/2015, es un motivo de abstención:",["Tener un vínculo matrimonial o situación de hecho asimilable y el parentesco de consanguinidad o afinidad dentro del cuarto grado, con cualquiera de los interesados, con los administradores de entidades o sociedades interesadas y también con los asesores, representantes legales o mandatarios que intervengan en el procedimiento, así como compartir despacho profesional o estar asociado con éstos para el asesoramiento, la representación o el mandato.","Tener amistad íntima o enemistad con cualquiera de los interesados, con los administradores de entidades o sociedades interesadas y también con los asesores, representantes legales o mandatarios que intervengan en el procedimiento, así como compartir despacho profesional o estar asociado con éstos para el asesoramiento, la representación o el mandato.","Haber intervenido como perito o como testigo en cualquier procedimiento de la Administración Pública.","Tener relación de servicio con persona natural o jurídica interesada directamente en el asunto, o haberle prestado en los cuatro últimos años servicios profesionales de cualquier tipo y en cualquier circunstancia o lugar."],1],[259,10,"Según la Ley 40/2015, podrá promoverse recusación por los interesados:",["Solo antes de que se inicie el procedimiento.","En cualquier momento de la tramitación del procedimiento.","Únicamente tras dictarse la resolución final.","En cualquier momento de la tramitación del procedimiento, únicamente cuando el motivo de recusación sea tener interés personal en el asunto de que se trate o en otro en cuya resolución pudiera influir la de aquél."],1],[260,10,"Según la Ley 40/2015, la sede electrónica es:",["Aquella dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad corresponde a una Administración Pública, o bien a una o varios organismos públicos o entidades de Derecho Público en el ejercicio de sus competencias.","Aquella dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad corresponde a una Administración Pública, o bien a una o varios organismos públicos o entidades de Derecho Público o a una entidad privada en el ejercicio de sus competencias.","El punto de acceso electrónico cuya titularidad corresponda a una Administración Pública, organismo público o entidad de Derecho Público que permite el acceso a través de internet a la información publicada.","El punto de acceso electrónico cuya titularidad corresponda a una Administración Pública, organismo público, entidad de Derecho Público o entidad privada, que permite el acceso a través de internet a la información publicada."],0],[261,10,"Según la Ley 40/2015, se entiende por portal de internet:",["Aquella dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad corresponde a una Administración Pública, o bien a una o varios organismos públicos o entidades de Derecho Público en el ejercicio de sus competencias.","Aquella dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad corresponde a una Administración Pública, o bien a una o varios organismos públicos o entidades de Derecho Público o a una entidad privada en el ejercicio de sus competencias.","El punto de acceso electrónico cuya titularidad corresponda a una Administración Pública, organismo público o entidad de Derecho Público que permite el acceso a través de internet a la información publicada.","El punto de acceso electrónico cuya titularidad corresponda a una Administración Pública, organismo público, entidad de Derecho Público o entidad privada, que permite el acceso a través de internet a la información publicada."],3],[262,11,"Los convenios a los que se refiere el artículo 48.1 de la Ley 40/2015:",["Deberán tener una duración determinada, que no podrá ser inferior a dos años, ni superior a cuatro años, salvo que normativamente se prevea un plazo superior; y en cualquier momento antes de la finalización del citado plazo, los firmantes del convenio podrán acordar unánimemente su prórroga por un periodo de hasta dos años adicionales o su extinción.","Deberán tener una duración determinada, que no podrá ser inferior a dos años, ni superior a cuatro años, salvo que normativamente se prevea un plazo superior; y en cualquier momento antes de la finalización del citado plazo, los firmantes del convenio podrán acordar unánimemente su prórroga por un periodo de hasta cuatro años adicionales o su extinción.","Deberán tener una duración determinada, que no podrá ser superior a cuatro años, salvo que normativamente se prevea un plazo superior; y en cualquier momento antes de la finalización del citado plazo, los firmantes del convenio podrán acordar unánimemente su prórroga por un periodo de hasta cuatro años adicionales o su extinción.","Deberán tener una duración indefinida, salvo que normativamente se prevea un plazo determinado."],2],[263,11,"Son convenios:",["Los Protocolos Generales de Actuación o instrumentos similares que comporten meras declaraciones de intención de contenido general o que expresen la voluntad de las Administraciones y partes suscriptoras para actuar con un objetivo común, siempre que no supongan la formalización de compromisos jurídicos concretos y exigibles.","Los acuerdos con efectos jurídicos adoptados por las Administraciones Públicas, los organismos públicos y entidades de derecho público vinculados o dependientes o las Universidades públicas entre sí o con sujetos de derecho privado para un fin común.","Únicamente los acuerdos con efectos jurídicos adoptados por las Administraciones Públicas, los organismos públicos y entidades de derecho público vinculados o dependientes o las Universidades públicas entre sí.","Únicamente los acuerdos con efectos jurídicos adoptados por las Administraciones Públicas, los organismos públicos y entidades de derecho público vinculados o dependientes o las Universidades públicas con sujetos de derecho privado para un fin común."],1],[264,11,"En caso de incumplimiento de las obligaciones y compromisos asumidos por parte de alguno de los firmantes de un convenio:",["Cualquiera de las partes podrá notificar a la parte incumplidora un requerimiento para que cumpla en un determinado plazo con las obligaciones o compromisos que se consideran incumplidos.","Cualquiera de las partes deberá notificar a la parte incumplidora un requerimiento para que cumpla en un determinado plazo con las obligaciones o compromisos que se consideran incumplidos.","Cualquiera de las partes podrá notificar a la parte incumplidora un requerimiento para que cumpla en un plazo improrrogable de 15 días hábiles con las obligaciones o compromisos que se consideran incumplidos.","Cualquiera de las partes deberá notificar a la parte incumplidora un requerimiento para que cumpla en un plazo improrrogable de 15 días hábiles con las obligaciones o compromisos que se consideran incumplidos."],0],[265,11,"En relación con los convenios, señale la respuesta correcta:",["Las Administraciones Públicas podrán suscribir convenios para la cesión de la titularidad de las competencias que les son propias.","La inclusión, en el contenido de los convenios, del objeto o de las obligaciones o compromisos económicos asumidos por cada una de las partes tiene carácter facultativo.","El plazo de vigencia de los convenios no podrá ser superior a 4 años, sin que quepa la posibilidad de prórroga.","Las aportaciones financieras que se comprometan a realizar los firmantes del convenio no podrán ser superiores a los gastos derivados de la ejecución del convenio."],3],[266,11,"En la regulación de los Convenios, la Ley 40/2015, de Régimen Jurídico, del Sector Público establece lo siguiente:",["Podrán tener por objeto prestaciones propias de los contratos los convenios relativos a determinadas materias que enumera la propia Ley 40/2015.","Solo podrán tener por objeto prestaciones propias de los contratos en circunstancias excepcionales, justificadas en el propio convenio.","No podrán tener por objeto prestaciones propias de los contratos. En tal caso, su naturaleza y régimen jurídico se ajustará a lo previsto en la legislación de contratos del sector público.","Solo podrán tener por objeto prestaciones propias de los contratos si las cuantías económicas previstas en los convenios no superan los importes del contrato menor de la legislación de contratación administrativa."],2],[267,11,"En la regulación de los Convenios, la Ley 40/2015, de Régimen Jurídico del Sector Público, establece que los mismos deberán tener una duración determinada:",["Es correcto, y la misma no podrá ser superior a dos años, salvo que normativamente se prevea un plazo superior.","Es correcto, y la misma no podrá ser superior a cuatro años, salvo que normativamente se prevea un plazo superior.","Es incorrecto, podrán tener la duración que libremente acuerden las partes que suscriban el convenio.","Es correcto, siendo como máximo de tres años, sin posibilidad de excepción alguna."],1],[268,11,"En la regulación de los Convenios, ¿qué establece la Ley 40/2015, de Régimen Jurídico del Sector Público, cuando el convenio instrumente una subvención?",["Que deberá cumplir con lo previsto en la Ley General de Subvenciones y en la normativa autonómica de desarrollo que, en su caso, resulte aplicable.","Que quedará exento de cumplir con lo previsto en la Ley General de Subvenciones y en la normativa autonómica de desarrollo que, en su caso, resulte aplicable.","La propia Ley 40/2015, de Régimen Jurídico del Sector Público, establece una serie de reglas y normas especiales para ese tipo de convenios.","La Ley 40/2015, de Régimen Jurídico del Sector Público, no prevé ese supuesto."],0],[269,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos se clasifican en:",["Funcionarios de carrera y funcionarios interinos.","Funcionarios de carrera, funcionarios interinos, personal laboral, ya sea fijo, por tiempo indefinido o temporal y personal directivo profesional.","Funcionarios de carrera, funcionarios interinos, personal eventual y personal directivo profesional.","Funcionarios de carrera, funcionarios interinos, personal laboral, ya sea fijo, por tiempo indefinido o temporal y personal eventual."],3],[270,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, son funcionarios de carrera:",["Quienes, en virtud de nombramiento legal, están vinculados a una Administración Pública por una relación estatutaria regulada por el Derecho Administrativo para el desempeño de servicios profesionales retribuidos de carácter permanente.","Los que, por razones expresamente justificadas de necesidad y urgencia, son nombrados como tales con carácter temporal para el desempeño de funciones propias de funcionarios de carrera, cuando se den determinadas circunstancias.","Los que en virtud de contrato de trabajo formalizado por escrito, en cualquiera de las modalidades de contratación de personal previstas en la legislación laboral, prestan servicios retribuidos por las Administraciones Públicas.","Los que, en virtud de nombramiento y con carácter no permanente, sólo realizan funciones expresamente calificadas como de confianza o asesoramiento especial, siendo retribuido con cargo a los créditos presupuestarios consignados para este fin."],0],[271,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, son funcionarios interinos:",["Quienes, en virtud de nombramiento legal, están vinculados a una Administración Pública por una relación estatutaria regulada por el Derecho Administrativo para el desempeño de servicios profesionales retribuidos de carácter permanente.","Los que, por razones expresamente justificadas de necesidad y urgencia, son nombrados como tales con carácter temporal para el desempeño de funciones propias de funcionarios de carrera, cuando se den determinadas circunstancias.","Los que en virtud de contrato de trabajo formalizado por escrito, en cualquiera de las modalidades de contratación de personal previstas en la legislación laboral, prestan servicios retribuidos por las Administraciones Públicas.","Los que, en virtud de nombramiento y con carácter no permanente, sólo realizan funciones expresamente calificadas como de confianza o asesoramiento especial, siendo retribuido con cargo a los créditos presupuestarios consignados para este fin."],1],[272,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, podrán ser nombrados funcionarios interinos en la siguiente circunstancia:",["La existencia de plazas vacantes, cuando no sea posible su cobertura por funcionarios de carrera, por un máximo de cuatro años.","La sustitución transitoria de los titulares, durante el tiempo estrictamente necesario.","La ejecución de programas de carácter temporal, que no podrán tener una duración superior a cuatro años, ampliable hasta seis meses más por las leyes de Función Pública que se dicten en desarrollo de este Estatuto.","El exceso o acumulación de tareas por plazo máximo de doce meses, dentro de un periodo de dieciocho meses."],1],[273,12,"Los procedimientos de selección del personal funcionario interino serán públicos, rigiéndose en todo caso por los principios de:",["Igualdad, mérito, capacidad, confidencialidad y celeridad.","Discrecionalidad, publicidad y celeridad.","Idoneidad, publicidad y celeridad.","Igualdad, mérito, capacidad, publicidad y celeridad."],3],[274,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, es personal laboral:",["Quien, en virtud de nombramiento legal, está vinculados a una Administración Pública por una relación estatutaria regulada por el Derecho Administrativo para el desempeño de servicios profesionales retribuidos de carácter permanente.","El que, por razones expresamente justificadas de necesidad y urgencia, es nombrado como tal con carácter temporal para el desempeño de funciones propias de funcionarios de carrera, cuando se den determinadas circunstancias.","El que en virtud de contrato de trabajo formalizado por escrito, en cualquiera de las modalidades de contratación de personal previstas en la legislación laboral, presta servicios retribuidos por las Administraciones Públicas.","El que, en virtud de nombramiento y con carácter no permanente, sólo realiza funciones expresamente calificadas como de confianza o asesoramiento especial, siendo retribuido con cargo a los créditos presupuestarios consignados para este fin."],2],[275,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, en función de la duración del contrato, el personal laboral podrá ser:",["Permanente o transitorio.","Funcionario o laboral.","Fijo, por tiempo indefinido o temporal.","Únicamente interino o eventual."],2],[276,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, es personal eventual:",["Quien, en virtud de nombramiento legal, está vinculados a una Administración Pública por una relación estatutaria regulada por el Derecho Administrativo para el desempeño de servicios profesionales retribuidos de carácter permanente.","El que, por razones expresamente justificadas de necesidad y urgencia, es nombrado como tal con carácter temporal para el desempeño de funciones propias de funcionarios de carrera, cuando se den determinadas circunstancias.","El que en virtud de contrato de trabajo formalizado por escrito, en cualquiera de las modalidades de contratación de personal previstas en la legislación laboral, presta servicios retribuidos por las Administraciones Públicas.","El que, en virtud de nombramiento y con carácter no permanente, sólo realiza funciones expresamente calificadas como de confianza o asesoramiento especial, siendo retribuido con cargo a los créditos presupuestarios consignados para este fin."],3],[277,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, el cese del personal eventual se producirá, en todo caso:",["Cuando se produzca el de la autoridad a la que se preste la función de confianza o asesoramiento.","Cuando se convoquen elecciones.","Cuando se cumplan tres años desde su nombramiento.","Cuando se cumplan cuatro años desde su nombramiento."],0],[278,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, la carrera vertical consiste en:",["La progresión de grado, categoría, escalón u otros conceptos análogos, sin necesidad de cambiar de puesto de trabajo.","El ascenso en la estructura de puestos de trabajo por los procedimientos de provisión establecidos en el capítulo III del título V del Estatuto Básico del Empleado Público.","El ascenso desde un cuerpo o escala de un Subgrupo, o Grupo de clasificación profesional en el supuesto de que éste no tenga Subgrupo, a otro superior, de acuerdo con lo establecido en el artículo 18 del Estatuto Básico del Empleado Público.","El acceso a cuerpos o escalas del mismo Subgrupo profesional, de acuerdo con lo dispuesto en el artículo 18 del Estatuto Básico del Empleado Público."],1],[279,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, las retribuciones básicas son:",["Las que retribuyen al funcionario según la adscripción de su cuerpo o escala a un determinado Subgrupo o Grupo de clasificación profesional, en el supuesto de que éste no tenga Subgrupo, y por su antigüedad en el mismo. Dentro de ellas están comprendidas los componentes de sueldo y trienios de las pagas extraordinarias.","Las que retribuyen al funcionario según la adscripción de su cuerpo o escala a un determinado Subgrupo o Grupo de clasificación profesional, en el supuesto de que éste no tenga Subgrupo, y por su antigüedad en el mismo. Dentro de ellas están comprendidas las que retribuyen las características de los puestos de trabajo o la carrera profesional.","Las que retribuyen al funcionario según la adscripción de su cuerpo o escala a un determinado Subgrupo o Grupo de clasificación profesional, en el supuesto de que éste no tenga Subgrupo, y por su antigüedad en el mismo. Dentro de ellas están comprendidas las que retribuyen el desempeño, rendimiento o resultados alcanzados por el funcionario.","Las que retribuyen las características de los puestos de trabajo, la carrera profesional o el desempeño, rendimiento o resultados alcanzados por el funcionario."],0],[280,12,"A los efectos del texto refundido de la Ley del Estatuto Básico del Empleado Público, se entiende por negociación colectiva:",["La facultad de elegir representantes y constituir órganos unitarios a través de los cuales se instrumente la interlocución entre las Administraciones Públicas y sus empleados.","El derecho a participar, a través de las organizaciones sindicales, en los órganos de control y seguimiento de las entidades u organismos que legalmente se determine.","El derecho a negociar la determinación de condiciones de trabajo de los empleados de la Administración Pública.","El derecho a negociar las decisiones de las Administraciones Públicas que afecten a sus potestades de organización."],2],[281,12,"Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, será objeto de negociación, en su ámbito respectivo y en relación con las competencias de cada Administración pública y con el alcance que legalmente proceda en cada caso, la materia siguiente:",["La regulación del ejercicio de los derechos de los ciudadanos y de los usuarios de los servicios públicos, así como el procedimiento de formación de los actos y disposiciones administrativas.","La determinación de condiciones de trabajo del personal directivo.","La regulación y determinación concreta, en cada caso, de los sistemas, criterios, órganos y procedimientos de acceso al empleo público y la promoción profesional.","La determinación y aplicación de las retribuciones complementarias de los funcionarios."],3],[282,12,"Señale la respuesta correcta respecto a los permisos de los funcionarios públicos:",["Por razones de guarda legal, cuando el funcionario tenga el cuidado directo de algún menor de dieciséis años, de persona mayor que requiera especial dedicación, o de una persona con discapacidad que no desempeñe actividad retribuida, tendrá derecho a la reducción de su jornada de trabajo, con la disminución de sus retribuciones que corresponda.","Por ser preciso atender el cuidado de un familiar de primer grado, el funcionario tendrá derecho a solicitar una reducción de hasta el cincuenta por ciento de la jornada laboral, con la disminución de sus retribuciones que corresponda, por razones de enfermedad muy grave y por el plazo máximo de un mes.","Por accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise de reposo domiciliario del cónyuge, pareja de hecho o parientes hasta el primer grado por consanguinidad o afinidad, así como de cualquier otra persona distinta de las anteriores que conviva con el funcionario o funcionaria en el mismo domicilio y que requiera el cuidado efectivo de aquella, cinco días hábiles.","Por matrimonio o registro o constitución formalizada por documento público de pareja de hecho, diez días."],2],[283,12,"Señale la respuesta correcta respecto a los permisos por motivos de conciliación de la vida personal, familiar y laboral, por razón de violencia de género o de violencia sexual y para las víctimas de terrorismo y sus familiares directos:",["Permiso por nacimiento para la madre biológica: tendrá una duración de diecinueve semanas. En el supuesto de monoparentalidad, por existir una única persona progenitora, el permiso será de treinta y ocho semanas.","Permiso del progenitor diferente de la madre biológica por nacimiento, guarda con fines de adopción, acogimiento o adopción de un hijo o hija: tendrá una duración de doce semanas.","Permiso por razón de violencia de género o de violencia sexual sobre la mujer funcionaria: las faltas de asistencia de las funcionarias víctimas de violencia de género o de violencia sexual, totales o parciales, tendrán la consideración de justificadas por el tiempo y en las condiciones en que así lo determinen los servicios sociales de atención o de salud según proceda.","Permiso parental para el cuidado de hijo, hija o menor acogido por tiempo no superior a un año, hasta el momento en que el menor cumpla ocho años: no tendrá carácter retribuido y tendrá una duración superior a ocho semanas, continuas o discontinuas, podrá disfrutarse a tiempo completo, o en régimen de jornada a tiempo parcial, cuando las necesidades del servicio lo permitan y conforme a los términos que reglamentariamente se establezcan."],2],[284,12,"El Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa es:",["De obligado cumplimiento por todos las y los empleados públicos forales.","De carácter voluntario y de recomendación ética.","De obligado cumplimiento para las y los empleados públicos forales nombrados por libre designación y de carácter voluntario para el resto de empleados públicos forales.","De obligado cumplimiento únicamente respecto a cuestiones relacionadas con la contratación pública."],0],[285,12,"Los Valores Éticos a los que han de ajustar su conducta profesional las y los empleados públicos forales son los siguientes:",["Integridad, ejemplaridad, honestidad y desinterés, parcialidad y subjetividad, excelencia profesional, eficiencia y respeto.","Integridad, ejemplaridad, honestidad y desinterés, imparcialidad y objetividad, excelencia profesional, eficiencia y respeto.","Integridad, ejemplaridad, honestidad y desinterés, parcialidad y subjetividad, excelencia profesional y celeridad.","Integridad, ejemplaridad, discreción y confidencialidad, imparcialidad y objetividad, excelencia profesional, eficiencia y respeto."],1],[286,12,"Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la integridad es:",["La razón existencial de la institución del empleo público foral, cuya actuación profesional debe estar alejada de influencias y orientaciones políticas o de otro carácter.","Que el empleado público foral dirija sus actuaciones, de forma veraz y transparente, exclusivamente hacia el objetivo del pleno cumplimiento del interés público y de los intereses de la ciudadanía guipuzcoana en su conjunto.","Un valor sustantivo para el servicio público, la buena gestión y el fortalecimiento de las instituciones forales.","La conducta profesional del empleado público foral, que estará guiada por un comportamiento ejemplar, en tanto que las buenas prácticas de las y los empleados públicos favorecen el cambio de la cultura cívica y la interiorización social de las normas."],2],[287,12,"Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la honestidad y desinterés consiste en:",["La razón existencial de la institución del empleo público foral, cuya actuación profesional debe estar alejada de influencias y orientaciones políticas o de otro carácter.","Que el empleado público foral dirija sus actuaciones, de forma veraz y transparente, exclusivamente hacia el objetivo del pleno cumplimiento del interés público y de los intereses de la ciudadanía guipuzcoana en su conjunto.","Un valor sustantivo para el servicio público, la buena gestión y el fortalecimiento de las instituciones forales.","La conducta profesional del empleado público foral, que estará guiada por un comportamiento ejemplar, en tanto que las buenas prácticas de las y los empleados públicos favorecen el cambio de la cultura cívica y la interiorización social de las normas."],1],[288,12,"Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la imparcialidad es:",["La razón existencial de la institución del empleo público foral, cuya actuación profesional debe estar alejada de influencias y orientaciones políticas o de otro carácter.","Que el empleado público foral dirija sus actuaciones, de forma veraz y transparente, exclusivamente hacia el objetivo del pleno cumplimiento del interés público y de los intereses de la ciudadanía guipuzcoana en su conjunto.","Un valor sustantivo para el servicio público, la buena gestión y el fortalecimiento de las instituciones forales.","La conducta profesional del empleado público foral, que estará guiada por un comportamiento ejemplar, en tanto que las buenas prácticas de las y los empleados públicos favorecen el cambio de la cultura cívica y la interiorización social de las normas."],0],[289,12,"Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la gestión de los recursos y la gestión económico-financiera de las y los empleados públicos forales estarán imbuidas por:",["La atención a la ciudadanía.","La eficiencia.","La transparencia.","La celeridad en la toma de decisiones."],1],[290,12,"Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la norma de conducta “en horas y espacios de trabajo, harán un uso razonable y ético de sus dispositivos móviles personales así como de las redes sociales o Internet para uso exclusivamente privado” corresponde al siguiente valor ético:",["Integridad.","Ejemplaridad.","Imparcialidad y objetividad.","Respeto."],1],[291,12,"Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, la norma de conducta “las y los empleados públicos forales no aceptarán ningún regalo, invitación, viajes, comidas o compensación económica por impartición de conferencias o participación en medios de comunicación siempre que se trate de actividades vinculadas exclusivamente con el ejercicio de sus funciones propias de su puesto de trabajo” corresponde al siguiente valor ético:",["Ejemplaridad.","Eficiencia.","Excelencia profesional.","Honestidad y desinterés."],3],[292,12,"Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, los principios de buena gestión son los siguientes:",["Transparencia, apertura de datos, cultura de gestión e innovación, promoción del uso del euskera y responsabilidad profesional.","Integridad, ejemplaridad, honestidad y desinterés, imparcialidad y objetividad, excelencia profesional, eficiencia y respeto.","Transparencia, integridad, cultura de gestión e innovación, promoción del uso del euskera y excelencia profesional.","Integridad, ejemplaridad, discreción y confidencialidad, imparcialidad y objetividad, excelencia profesional, eficiencia y respeto."],0],[293,12,"Según el Código Ético y de Buena Gestión del Empleo Público Foral de Gipuzkoa, ¿cuál de las siguientes normas de actuación profesional en el ámbito de la buena gestión está relacionada con la responsabilidad profesional?",["Las y los empleados públicos forales desarrollarán en su actividad profesional una cultura de gestión que conlleve mayor implicación en los proyectos, creatividad e iniciativa, así como el impulso de prácticas de innovación en el ámbito de lo público.","Las y los empleados públicos forales actuarán con especial diligencia garantizando respuestas rápidas, efectivas y motivadas, cuando se demande a la Administración Foral información pública por parte de la ciudadanía y de sus entidades, ponderando en cada caso los límites existentes, los derechos en juego e interpretando de forma restrictiva las causas de inadmisión y aquellos límites, con el fin de favorecer el control de la actividad pública por la ciudadanía.","En la gestión cotidiana de su actividad profesional, las y los empleados públicos forales trabajarán a través de las metas y objetivos enmarcados en el Plan Estratégico de gestión de cada mandato, así como mediante el cumplimiento de los indicadores establecidos para poder evaluar los resultados de su gestión.","En su actividad profesional utilizarán preferentemente el euskera tanto oralmente como por escrito, salvo en aquellos actos o relaciones en los que quienes sean sus interlocutores no tengan un conocimiento suficiente de la lengua vasca."],2],[294,13,"Leire ha sufrido una caída en Zarautz debido a unas obras que un contratista municipal está ejecutando en el malecón. ¿Tiene el Ayuntamiento responsabilidad patrimonial por este hecho?",["Sí, el Ayuntamiento responderá, en todo caso, por los daños y perjuicios causados por sus contratistas.","Sí, pero el Ayuntamiento responderá solidariamente con el contratista.","No, el Ayuntamiento no responderá porque el contratista no ha colocado las indicaciones de seguridad y el Pliego de Contratación lo exigía.","No, el Ayuntamiento no responderá porque dio instrucciones al contratista de no colocar barreras en el malecón."],2],[295,13,"Leire ha sufrido un grave daño por un error médico causado por un anestesista del servicio de Osakidetza:",["Leire tiene que reclamar daños y perjuicios a Osakidetza, así como al anestesista como responsable subsidiario.","Leire puede optar por reclamar daños y perjuicios al anestesista en vía civil o a Osakidetza en vía administrativa.","Leire sólo puede reclamar directamente daños y perjuicios a Osakidetza, pero no al anestesista.","Leire podrá reclamar en vía civil contra el anestesista y Osakidetza; y en vía administrativa sólo contra Osakidetza."],2],[296,13,"La responsabilidad patrimonial del Estado por el funcionamiento de la Administración de Justicia se regirá:",["Por la Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas.","Por la Ley 40/2015, de Régimen Jurídico del Sector Público.","Por la Ley de Enjuiciamiento Civil.","Por la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial."],3],[297,13,"La resolución declaratoria de responsabilidad patrimonial de las autoridades y demás personal a su servicio:",["Será recurrible en vía económico administrativa.","Será recurrible en alzada.","Pondrá fin a la vía administrativa.","No será recurrible."],2],[298,13,"Cuando las Administraciones Públicas actúen, directamente o a través de una entidad de derecho privado, en relaciones de esta naturaleza, su responsabilidad se exigirá:",["De conformidad con las normas que se establezcan en los estatutos o en el título de constitución de la entidad de derecho privado.","De conformidad con las normas previstas en la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público.","De conformidad con las normas de derecho público o de derecho privado, a elección del reclamante.","De conformidad con las normas de derecho privado."],1],[299,13,"Los particulares tienen derecho a ser indemnizados por las Administraciones Públicas:",["Ante toda lesión que sufran en cualquiera de sus bienes y derechos, independientemente de que concurra dolo, culpa, fuerza mayor o caso fortuito.","Ante toda resolución desestimatoria de una solicitud presentada en tiempo y forma.","Ante toda lesión en sus bienes y derechos, consecuencia del funcionamiento normal o anormal de los servicios públicos, salvo en los casos de fuerza mayor o de daños que el particular tenga el deber jurídico de soportar de acuerdo con la Ley.","Ante toda resolución anulada por vía administrativa o por el orden jurisdiccional contencioso administrativo."],2],[300,13,"En los casos de exigencia de la responsabilidad patrimonial de las autoridades y personal al servicio de las Administraciones Públicas:",["La solicitud deberá formularse directamente ante las autoridades y personal causantes del daño, procediendo la inadmisión en los supuestos en que los particulares se dirijan contra la Administración Pública de quienes dependan.","Es necesario, para su nacimiento, la existencia de responsabilidad penal.","No se prevé la acción de regreso contra las autoridades y personal a su servicio.","La resolución declaratoria de responsabilidad pondrá fin a la vía administrativa."],3],[301,13,"La responsabilidad patrimonial de las autoridades y personal al servicio de las Administraciones Públicas:",["Se exigirá directamente a las autoridades y personal que han causado los daños.","Se exigirán directamente a la Administración Pública correspondiente.","Se exigirá directamente a los superiores de las autoridades y personal que han causado los daños.","Se exigirá directamente ante la autoridad judicial."],1],[302,13,"En los casos en que la Administración correspondiente hubiera indemnizado a los lesionados por los daños y perjuicios causados por las autoridades y personal a su servicio:",["Podrá exigir de oficio en vía administrativa a sus autoridades y demás personal a su servicio la responsabilidad en que hubieran incurrido por dolo o negligencia, previa instrucción del correspondiente procedimiento.","Exigirá de oficio en vía administrativa a sus autoridades y demás personal a su servicio la responsabilidad en que hubieran incurrido por dolo o negligencia graves, previa instrucción del correspondiente procedimiento.","Podrá exigir de oficio en vía administrativa a sus autoridades y demás personal a su servicio la responsabilidad en que hubieran incurrido por dolo.","Exigirá directamente a sus autoridades y demás personal a su servicio la responsabilidad en que hubieran incurrido por dolo o negligencia."],1],[303,13,"En el marco de la responsabilidad patrimonial de las Administraciones Públicas:",["Los particulares tendrán derecho a ser indemnizados de toda lesión que sufran en cualquiera de sus bienes, incluso en los casos de fuerza mayor.","La lesión debe ser consecuencia del funcionamiento normal o anormal de los servicios públicos, pero el daño alegado puede ser futuro e incierto, ya que no es necesario que sea evaluable económicamente.","El daño alegado habrá de ser efectivo, evaluable económicamente e individualizado con relación a una persona o grupo de personas.","La anulación por el orden jurisdiccional contencioso-administrativo de actos o disposiciones administrativas presupone derecho a la indemnización."],2],[304,13,"La exigencia de responsabilidad penal del personal al servicio de las Administraciones públicas:",["Suspenderá los procedimientos de reconocimiento de responsabilidad patrimonial que se instruyan.","No suspenderá los procedimientos de responsabilidad patrimonial que se instruyan, salvo que se instruya un procedimiento de responsabilidad civil derivada del delito.","Suspenderá los procedimientos de reconocimiento de responsabilidad patrimonial cuando la determinación de los hechos en el orden jurisdiccional penal sea necesaria para la fijación de la responsabilidad patrimonial.","No suspenderá los procedimientos de responsabilidad patrimonial que se instruyan, salvo que así se solicite expresamente, mediante resolución motivada, por la Administración pública correspondiente."],2],[305,13,"En relación al derecho de los particulares a ser indemnizados por las Administraciones Públicas correspondientes, de toda lesión que sufran en cualquiera de sus bienes y derechos, señale la respuesta INCORRECTA:",["La lesión tiene que ser consecuencia del funcionamiento normal o anormal de los servicios públicos.","No tendrán derecho a ser indemnizados en los casos de fuerza mayor o caso fortuito.","No tendrán derecho a ser indemnizados en los casos de daños que el particular tenga el deber jurídico de soportar de acuerdo con la Ley.","El daño alegado habrá de ser efectivo, evaluable económicamente e individualizado con relación a una persona o grupo de personas."],1],[306,13,"Cuando de la gestión dimanante de fórmulas conjuntas de actuación entre varias Administraciones públicas se derive responsabilidad, las Administraciones intervinientes responderán frente al particular:",["De forma proporcional atendiendo al número de habitantes.","De forma proporcional atendiendo al presupuesto del año en que se originen los daños o perjuicios.","De forma solidaria.","De forma mancomunada."],2],[307,13,"Para hacer efectiva la responsabilidad patrimonial de las Administraciones públicas, en el caso de indemnizaciones por los daños y perjuicios causados por las autoridades y personal a su servicio:",["Los particulares exigirán la indemnización directamente a la Administración pública correspondiente.","Los particulares exigirán la indemnización directamente a las autoridades y personal que hubieran causado el daño o perjuicio.","Los particulares exigirán la indemnización indistintamente a la Administración pública correspondiente o a las autoridades y personal que hubieran causado el daño o perjuicio.","Ninguna de las respuestas anteriores es correcta."],0],[308,13,"En relación con la responsabilidad patrimonial de la Administración, ¿cuál de las siguientes afirmaciones es la correcta?",["Los particulares no tienen derecho a ser indemnizados por un daño provocado por la actuación de la Administración si ese daño no es antijurídico, es decir, si tienen el deber jurídico de soportarlo de acuerdo con la Ley.","La anulación en vía administrativa o por el orden jurisdiccional contencioso administrativo de un acto presupone el derecho a una indemnización.","Los procedimientos de responsabilidad patrimonial de la Administración no pueden finalizar mediante terminación convencional.","La responsabilidad patrimonial del Estado por el funcionamiento de la Administración de Justicia se rige por lo dispuesto en la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público."],0],[309,13,"En relación con la indemnización por responsabilidad patrimonial de la Administración:",["En los casos de muerte o lesiones corporales se aplicarán en todo caso los baremos de la normativa vigente en materia de Seguros obligatorios y de la Seguridad Social.","La cuantía de la indemnización se calculará con referencia al día en que se presentó la reclamación, sin perjuicio de su actualización a la fecha en que se ponga fin al procedimiento de","Si el daño no se hubiese podido prever o evitar según el estado de los conocimientos de la ciencia del momento en el que se produjo, el plazo para reclamar no se empezará a computar hasta que se pueda establecer la relación de causalidad, de acuerdo con los avances de la ciencia.","Podrá sustituirse por una compensación en especie o ser abonada mediante pagos periódicos, cuando resulte más adecuado para lograr la reparación debida y convenga al interés público, siempre que exista acuerdo con el interesado."],3],[310,14,"Las normas tributarias de carácter sancionador:",["Nunca podrán tener efecto retroactivo.","Siempre podrán tener efecto retroactivo.","Tendrán efecto retroactivo respecto de los actos que no sean firmes cuando su aplicación resulte más favorable para el interesado.","Podrán tener efecto retroactivo cuando su aplicación resulte más favorable para el interesado."],2],[311,14,"Según la Ley del Concierto Económico del País Vasco son competencias exclusivas del Estado:",["La regulación, gestión, inspección, revisión y recaudación de los derechos de importación y de los gravámenes a la importación en los Impuestos Especiales.","La regulación, gestión, inspección, revisión y recaudación de los derechos de importación y de los gravámenes a la importación en los Impuestos Especiales y en el Impuesto sobre el Valor Añadido.","La regulación, gestión, inspección, revisión y recaudación del Impuesto sobre el Valor Añadido y de los derechos de importación y los gravámenes a la importación en los Impuestos Especiales.","La regulación y la alta inspección de los derechos de importación y de los gravámenes a la importación en los Impuestos Especiales y en el Impuesto sobre el Valor Añadido."],1],[312,14,"En el ámbito tributario:",["Queda prohibida la analogía en todo caso, por tratarse de Derecho necesario e indisponible por la Administración actuante.","Se admitirá la analogía siempre que sea in bonam partem, esto es, en beneficio del contribuyente.","No se admitirá la analogía como regla general, salvo para extender el ámbito del hecho imponible, las exenciones, beneficios o incentivos fiscales.","No se admitirá la analogía para extender el ámbito del hecho imponible, las exenciones, beneficios o incentivos fiscales."],3],[313,14,"Las normas que regulen el régimen de infracciones y sanciones tributarias:",["Tendrán efectos retroactivos respecto de cualquier acto firme, cuando su aplicación resulte más favorable para el interesado.","Tendrán efectos retroactivos respecto de los actos que no sean firmes cuando su aplicación resulte más favorable para el interesado.","No tendrán efectos retroactivos.","Tendrán efectos retroactivos en todo caso."],1],[314,14,"La aportación del País Vasco al Estado consistirá en un cupo global:",["Integrado por las aportaciones que efectúen las Diputaciones Forales, como expresión de la contribución de los Territorios Históricos a los gastos presupuestarios del País Vasco.","Integrado por las aportaciones que establezca el Parlamento Vasco, como contribución a todas las cargas del Estado que no asuma la Comunidad Autónoma del País Vasco.","Integrado por los correspondientes a cada uno de sus Territorios Históricos, como contribución a todas las cargas del Estado que no asuma la Comunidad Autónoma del País Vasco.","Integrado por los correspondientes a cada uno de sus Territorios Históricos, como contribución a todas las cargas del Estado que asuma la Comunidad Autónoma del País Vasco."],2],[315,14,"Los principios y las normas jurídicas generales del sistema tributario español:",["Serán de aplicación a todas las Administraciones Tributarias.","Serán de aplicación a todas las Administraciones Tributarias, a excepción de las Entidades Locales.","Serán de aplicación a todas las Administraciones Tributarias, a e
