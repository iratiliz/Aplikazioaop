lidad del tratamiento.","Las categorías de datos objeto de tratamiento. La finalidad del tratamiento. La posibilidad de ejercer los derechos establecidos en los artículos 15 a 22 del Reglamento (UE) 2016/679.","La identidad del responsable del tratamiento y de su representante, en su caso. La finalidad del tratamiento. La posibilidad de ejercer los derechos establecidos en los artículos 15 a 22 del Reglamento (UE) 2016/679."],3],[432,18,"La Ley 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de derechos digitales, en relación a los datos de las personas fallecidas establece que, cuando la persona fallecida lo hubiese prohibido expresamente o lo establezca una Ley, las personas vinculadas al fallecido por razones familiares o de hecho, así como sus herederos:",["No podrán acceder a ningún dato del causante, ni solicitar su rectificación o supresión.","Tendrán derecho de acceso a todos sus datos, pero no podrán solicitar su rectificación o supresión.","No podrán acceder a los datos del causante, ni solicitar su rectificación o supresión, si bien dicha prohibición no afectará al derecho de los herederos a acceder a los datos de carácter patrimonial del causante.","No podrán acceder a los datos del causante, ni solicitar su rectificación o supresión, si bien dicha prohibición no afectará al derecho de los herederos a acceder a los datos de salud del causante."],2],[433,18,"Según la Ley Orgánica de Protección de Datos Personales y garantía de derechos digitales, los responsables y encargados del tratamiento de datos, así como todas las personas que intervengan en cualquier fase de este estarán sujetas al deber de:",["Los responsables del tratamiento de datos están obligados a compartir la información con cualquier persona que lo solicite para asegurar la transparencia.","El personal con acceso a datos personales debe mantener la confidencialidad de estos datos, aun cuando hubiese finalizado la relación del obligado con el responsable o encargado del tratamiento.","El personal con acceso a datos personales debe mantener la confidencialidad de estos datos, cuando se trate de datos sensibles de los ciudadanos.","El personal con acceso a datos personales debe mantener el secreto profesional, de conformidad con su normativa aplicable."],1],[434,18,"Según el Reglamento General de Protección de Datos (RGPD), ¿en qué plazo el responsable del tratamiento facilitará al interesado información relativa a sus actuaciones sobre la base de una solicitud con arreglo a los artículos 15 a 22 (derechos del interesado)?",["En el plazo de dos meses a partir de la recepción de la solicitud, sin que dicho plazo pueda ser objeto de prórroga teniendo en cuenta el número de solicitudes.","En el plazo de dos meses a partir de la recepción de la solicitud. Dicho plazo podrá prorrogarse otros dos meses en caso necesario, teniendo en cuenta la complejidad y el número de solicitudes.","En el plazo de un mes a partir de la recepción de la solicitud. Dicho plazo podrá prorrogarse otros dos meses en caso necesario, teniendo en cuenta la complejidad y el número de solicitudes.","En el plazo de un mes a partir de la recepción de la solicitud. Dicho plazo podrá prorrogarse otro mes, en caso necesario, teniendo en cuenta la complejidad de la solicitud."],2],[435,18,"Teniendo en cuenta los principios relativos al tratamiento establecidos en el artículo 5 del Reglamento General de Protección de Datos (RGPD), ¿cómo deben ser tratados los datos personales?",["En base al principio limitación de la finalidad, los datos personales serán recogidos con fines determinados, explícitos y legítimos, y no podrán ser tratados ulteriormente.","En base al principio del interés legítimo, el tratamiento de datos personales puede basarse en el interés legítimo del responsable del tratamiento o de un tercero.","En base al principio de responsabilidad proactiva, el responsable del tratamiento debe implementar medidas técnicas y organizativas adecuadas para garantizar la seguridad de los datos personales.","En base al principio de minimización de datos, los datos personales serán adecuados, pertinentes y limitados a lo necesario en relación con los fines para los que son tratados."],3],[436,18,"En el contexto del Reglamento General de Protección de Datos, ¿cuál de las siguientes afirmaciones describe correctamente la base de licitud que una Administración pública debe emplear para tratar datos personales al ejecutar sus competencias legales?",["La Administración pública debe recabar siempre el consentimiento del interesado antes de tratar sus datos personales.","La ejecución de un contrato entre la Administración pública y el interesado es la base de licitud general para el tratamiento de datos personales.","La base de licitud principal para las Administraciones públicas es la satisfacción de intereses legítimos, siempre que no prevalezcan los derechos del interesado.","La Administración pública puede tratar datos personales si el tratamiento es necesario para el cumplimiento de una misión realizada en interés público o en el ejercicio de poderes públicos conferidos al responsable del tratamiento."],3],[437,18,"Según el artículo 93 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, toda persona tiene derecho a que los motores de búsqueda en Internet eliminen de las listas de resultados que se obtuvieran tras una búsqueda efectuada a partir de su nombre los enlaces publicados que contuvieran información relativa a esa persona cuando fuesen inadecuados, inexactos, no pertinentes, no actualizados o excesivos o hubieren devenido como tales por el transcurso del tiempo, teniendo en cuenta los fines para los que se recogieron o trataron, el tiempo transcurrido y la naturaleza e interés público de la información. Señala la respuesta correcta:",["El enunciado se corresponde con una garantía a un derecho digital que se denomina “Derecho al olvido en servicios de redes sociales y servicios equivalentes”.","El enunciado se corresponde con una garantía a un derecho digital que se denomina “Derecho al olvido en búsquedas de Internet”.","El ejercicio del derecho al que se refiere impedirá también el acceso a la información publicada en el sitio web a través de la utilización de otros criterios de búsqueda distintos del nombre de quien ejerciera el derecho.","Las respuestas B y C son correctas."],1],[438,18,"El Reglamento (UE) 2016/679 se aplica:",["Al tratamiento de datos personales en el ejercicio de una actividad no comprendida en el ámbito de aplicación del Derecho de la Unión.","Al tratamiento de datos personales efectuado por una persona física en el ejercicio de actividades exclusivamente personales o domésticas.","Al tratamiento de datos personales por parte de las autoridades competentes con fines de prevención, investigación, detección o enjuiciamiento de infracciones penales, o de ejecución de sanciones penales, incluida la de protección frente a amenazas a la seguridad pública y su prevención.","Al tratamiento total o parcialmente automatizado de datos personales, así como al tratamiento no automatizado de datos personales contenidos o destinados a ser incluidos en un fichero."],3],[439,18,"A efectos del Reglamento (UE) 2016/679, se entenderá por “encargado de tratamiento”:",["La persona física o jurídica, autoridad pública, servicio u otro organismo que, solo o junto con otros, determine los fines y medios del tratamiento.","La persona física o jurídica, autoridad pública, servicio u otro organismo al que se comuniquen datos personales, se trate o no de un tercero.","La persona física o jurídica, autoridad pública, servicio u otro organismo que trate datos personales por cuenta del responsable del tratamiento.","La persona física o jurídica que, solo o junto con otros, determine los fines y medios del tratamiento."],2],[440,18,"A efectos del Reglamento (UE) 2016/679, los datos personales obtenidos a partir de un tratamiento técnico específico, relativos a las características físicas, fisiológicas o conductuales de una persona física que permitan o confirmen la identificación única de dicha persona, como imágenes faciales o datos dactiloscópicos son:",["Datos genéticos.","Datos biométricos.","Datos relativos a la salud.","Datos de seguridad."],1]];
const TEMAS = ["Constitución: Título preliminar y derechos","Cortes Generales, Gobierno y Poder Judicial","Organización territorial y Estatuto de Autonomía","Ley 27/1983 de Territorios Históricos","Norma Foral 6/2005 de Gipuzkoa","Ley 7/1985 de Bases del Régimen Local","Unión Europea","Fuentes: la ley y el reglamento","Ley 39/2015: procedimiento administrativo","Ley 40/2015: órganos colegiados, abstención, sector electrónico","Ley 40/2015: convenios","TREBEP y Código Ético foral","Responsabilidad patrimonial","Ley General Tributaria y Concierto Económico","Normalización del euskera","Igualdad de mujeres y hombres","Transparencia y buen gobierno","Protección de datos"];
const L = "ABCD";
const byN = new Map(Q.map(q => [q[0], q]));

/* ---------- almacenamiento local (puede fallar: todo funciona sin él) ---------- */
const KEY = "ope-gipuzkoa-a1-v1";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
const store = Object.assign({stats:{}, cfg:{}, session:null}, load());
const cfg = Object.assign({temas:TEMAS.map((_,i)=>i+1), count:25, order:"rand", mode:"prac", filter:"all", pen:0, time:0}, store.cfg);

function stat(n){ return store.stats[n] || {c:0,w:0,last:null}; }
function record(n, ok){
  const s = stat(n); ok ? s.c++ : s.w++; s.last = ok ? 1 : 0; store.stats[n] = s;
}

const app = document.getElementById("app");
const h = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let timerId = null;

/* ---------- inicio ---------- */
function pool(){
  return Q.filter(q => cfg.temas.includes(q[1])).filter(q => {
    const s = stat(q[0]);
    if (cfg.filter === "wrong") return s.last === 0;
    if (cfg.filter === "new") return s.last === null;
    return true;
  });
}
function seg(name, options){
  return `<div class="seg" role="group">${options.map(([v,t]) =>
    `<button type="button" data-cfg="${name}" data-val="${v}" aria-pressed="${String(cfg[name])===String(v)}">${t}</button>`).join("")}</div>`;
}
function home(){
  clearInterval(timerId);
  const seen = Q.filter(q => stat(q[0]).last !== null).length;
  const okLast = Q.filter(q => stat(q[0]).last === 1).length;
  const wrong = Q.filter(q => stat(q[0]).last === 0).length;
  const p = pool();
  const n = cfg.count === "all" ? p.length : Math.min(+cfg.count, p.length);
  const temaRows = TEMAS.map((t,i) => {
    const qs = Q.filter(q => q[1] === i+1);
    const g = qs.filter(q => stat(q[0]).last === 1).length, r = qs.filter(q => stat(q[0]).last === 0).length;
    const pc = Math.round(100*g/qs.length);
    return `<label class="tema" for="t${i+1}"><input type="checkbox" id="t${i+1}" data-tema="${i+1}" ${cfg.temas.includes(i+1)?"checked":""}>
      <span class="t"><span>${i+1}. ${t}</span><small class="num">${qs[0][0]}–${qs[qs.length-1][0]} · ${qs.length} preguntas</small>
      <span class="bar"><i class="g" style="width:${100*g/qs.length}%"></i><i class="r" style="width:${100*r/qs.length}%"></i></span></span>
      <span class="pct">${pc}%</span></label>`;
  }).join("");
  const s = store.session;
  app.innerHTML = `
    <header><div class="eyebrow">Diputación Foral de Gipuzkoa · Subgrupo A1</div>
      <h1>Batería de preguntas OP2026</h1>
      <p class="sub">Conjunto oficial de 440 preguntas (2026/10/02), con la plantilla de respuestas correctas.</p></header>
    ${s ? `<section class="panel resume"><div><b>Tienes un test a medias</b><p class="sub">${s.mode==="sim"?"Simulacro":"Práctica"} · pregunta ${s.i+1} de ${s.ids.length}</p></div>
      <div class="nav"><button class="ghost" id="discard">Descartar</button><button class="primary" id="resume">Continuar</button></div></section>` : ""}
    <section class="panel">
      <h2>Tu progreso</h2>
      <div class="summary"><div><b>${seen}<small style="font-size:.9rem;color:var(--muted)">/440</small></b><span>vistas</span></div>
        <div><b style="color:var(--ok)">${okLast}</b><span>acertadas la última vez</span></div>
        <div><b style="color:var(--bad)">${wrong}</b><span>pendientes de repasar</span></div></div>
    </section>
    <section class="panel">
      <h2>Nuevo test</h2>
      <div class="field"><label>Modo</label>${seg("mode",[["prac","Práctica · corrige al momento"],["sim","Simulacro · corrige al final"]])}</div>
      <div class="field"><label>Preguntas</label>${seg("filter",[["all","Todas"],["new","No vistas"],["wrong","Falladas"]])}</div>
      <div class="field"><label>Cuántas</label>${seg("count",[[10,"10"],[25,"25"],[50,"50"],[100,"100"],["all","Todas"]])}</div>
      <div class="field"><label>Orden</label>${seg("order",[["rand","Aleatorio"],["seq","Como en la batería"]])}</div>
      ${cfg.mode==="sim" ? `<div class="field"><label>Tiempo</label>${seg("time",[[0,"Sin límite"],[1,"1 min/pregunta"],[0.6,"36 s/pregunta"]])}</div>` : ""}
      <div class="field"><label>Penalización por error</label>${seg("pen",[[0,"Ninguna"],[0.25,"−1/4"],[0.3333,"−1/3"]])}
        <span class="note">Solo afecta a la nota sobre 10. Ajústala a lo que digan tus bases.</span></div>
      <button class="primary" id="start" ${n?"":"disabled"}>${n ? `Empezar · ${n} pregunta${n>1?"s":""}` : "No hay preguntas con estos filtros"}</button>
    </section>
    <section class="panel">
      <div class="row" style="justify-content:space-between"><h2>Temas</h2>
        <span class="row"><button class="linkbtn" id="all">Todos</button><button class="linkbtn" id="none">Ninguno</button></span></div>
      <div class="temas">${temaRows}</div>
      <span class="note">El porcentaje cuenta las preguntas que acertaste la última vez que salieron.</span>
    </section>
    <section class="panel" id="resetBox"><div class="row" style="justify-content:space-between"><span class="note">Tu progreso se guarda en este dispositivo.</span>
      <button class="linkbtn" id="reset">Borrar progreso</button></div></section>`;
  app.querySelectorAll("[data-cfg]").forEach(b => b.onclick = () => {
    const v = b.dataset.val; cfg[b.dataset.cfg] = isNaN(+v) ? v : +v; persistCfg(); home();
  });
  app.querySelectorAll("[data-tema]").forEach(c => c.onchange = () => {
    const t = +c.dataset.tema;
    cfg.temas = c.checked ? [...new Set([...cfg.temas, t])].sort((a,b)=>a-b) : cfg.temas.filter(x => x !== t);
    persistCfg(); home();
  });
  app.querySelector("#all").onclick = () => { cfg.temas = TEMAS.map((_,i)=>i+1); persistCfg(); home(); };
  app.querySelector("#none").onclick = () => { cfg.temas = []; persistCfg(); home(); };
  app.querySelector("#start").onclick = start;
  app.querySelector("#reset").onclick = () => {
    const box = app.querySelector("#resetBox"); box.classList.add("confirm");
    box.innerHTML = `<b>¿Borrar todo tu progreso?</b><span class="note">Se pierden los aciertos y fallos guardados de las 440 preguntas.</span>
      <div class="nav"><button class="ghost" id="no">Cancelar</button><button class="primary" id="yes" style="background:var(--bad)">Borrar</button></div>`;
    box.querySelector("#no").onclick = home;
    box.querySelector("#yes").onclick = () => { store.stats = {}; store.session = null; save(); home(); };
  };
  if (s){
    app.querySelector("#resume").onclick = () => { s.mode === "sim" ? startTimer() : 0; quiz(); };
    app.querySelector("#discard").onclick = () => { store.session = null; save(); home(); };
  }
}
function persistCfg(){ store.cfg = cfg; save(); }

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function start(){
  let ids = pool().map(q => q[0]);
  if (cfg.order === "rand") shuffle(ids);
  if (cfg.count !== "all") ids = ids.slice(0, +cfg.count);
  if (cfg.order === "seq") ids.sort((a,b)=>a-b);
  store.session = {ids, ans:{}, i:0, mode:cfg.mode, pen:cfg.pen, limit: cfg.mode==="sim" && cfg.time ? Math.round(ids.length*cfg.time*60) : 0, elapsed:0};
  save(); startTimer(); quiz();
}

/* ---------- temporizador (simulacro) ---------- */
function startTimer(){
  clearInterval(timerId);
  const s = store.session; if (!s || s.mode !== "sim") return;
  timerId = setInterval(() => {
    s.elapsed++;
    const el = document.getElementById("timer");
    if (el) { el.textContent = fmtTime(s); el.classList.toggle("low", s.limit && s.limit - s.elapsed < 300); }
    if (s.elapsed % 10 === 0) save();
    if (s.limit && s.elapsed >= s.limit) { clearInterval(timerId); finish(); }
  }, 1000);
}
function fmtTime(s){
  const t = s.limit ? Math.max(0, s.limit - s.elapsed) : s.elapsed;
  const m = Math.floor(t/60), sec = t%60;
  return (s.limit ? "Quedan " : "") + `${m}:${String(sec).padStart(2,"0")}`;
}

/* ---------- pregunta ---------- */
function quiz(){
  const s = store.session; const n = s.ids[s.i]; const q = byN.get(n);
  const chosen = s.ans[n]; const answered = chosen !== undefined;
  const prac = s.mode === "prac"; const reveal = prac && answered;
  const done = Object.keys(s.ans).length;
  const opts = q[3].map((o,k) => {
    let cls = "";
    if (reveal){ if (k === q[4]) cls = "ok"; else if (k === chosen) cls = "bad"; }
    else if (chosen === k) cls = "sel";
    return `<button class="opt ${cls}" data-k="${k}" ${reveal?"disabled":""}><span class="l">${L[k]}</span><span class="x">${h(o)}</span></button>`;
  }).join("");
  const last = s.i === s.ids.length - 1;
  app.innerHTML = `
    <div class="top">
      <div class="row"><button class="linkbtn" id="exit">← Salir</button>
        <span class="num qmeta">${s.i+1} / ${s.ids.length}</span>
        ${s.mode==="sim" ? `<span class="timer" id="timer">${fmtTime(s)}</span>` : `<span class="num qmeta">${done} resp.</span>`}</div>
      <div class="progress"><i style="width:${100*done/s.ids.length}%"></i></div>
    </div>
    <div class="qmeta">Pregunta <span class="num">${n}</span> · Tema ${q[1]}: ${TEMAS[q[1]-1]}</div>
    <p class="qtext">${h(q[2])}</p>
    <div class="opts">${opts}</div>
    ${reveal ? `<div class="verdict ${chosen===q[4]?"ok":"bad"}">${chosen===q[4] ? "Correcta" : `Incorrecta · la respuesta es la ${L[q[4]]}`}</div>` : ""}
    <div class="nav">
      <button class="ghost" id="prev" ${s.i===0?"disabled":""}>Anterior</button>
      ${last ? `<button class="primary" id="finish">${prac?"Ver resultado":"Entregar"}</button>`
             : `<button class="primary" id="next">${prac && !answered ? "Saltar" : "Siguiente"}</button>`}
    </div>
    ${s.mode==="sim" ? `<div class="panel"><h2>Ir a la pregunta</h2><div class="grid">${s.ids.map((id,i)=>
      `<button data-go="${i}" class="${s.ans[id]!==undefined?"done":""} ${i===s.i?"cur":""}">${i+1}</button>`).join("")}</div>
      ${!last?`<button class="ghost" id="finish">Entregar ahora</button>`:""}</div>` : ""}`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (prac){ s.ans[n] = k; record(n, k === q[4]); }
    else { if (s.ans[n] === k) delete s.ans[n]; else s.ans[n] = k; }
    save(); quiz();
  });
  const go = i => { s.i = i; save(); quiz(); window.scrollTo(0,0); };
  app.querySelector("#prev").onclick = () => go(s.i-1);
  const nx = app.querySelector("#next"); if (nx) nx.onclick = () => go(s.i+1);
  app.querySelectorAll("#finish").forEach(b => b.onclick = () => confirmFinish());
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
  app.querySelector("#exit").onclick = () => { save(); clearInterval(timerId); home(); };
}
function confirmFinish(){
  const s = store.session; const blank = s.ids.length - Object.keys(s.ans).length;
  if (s.mode === "sim" && blank > 0 && !document.getElementById("cf")){
    const box = document.createElement("div"); box.className = "panel confirm"; box.id = "cf";
    box.innerHTML = `<b>Te quedan ${blank} sin contestar</b><span class="note">Contarán como en blanco.</span>
      <div class="nav"><button class="ghost" id="cfno">Seguir</button><button class="primary" id="cfyes">Entregar</button></div>`;
    app.querySelector(".nav").after(box);
    box.querySelector("#cfno").onclick = () => box.remove();
    box.querySelector("#cfyes").onclick = finish;
    box.scrollIntoView({block:"center"});
    return;
  }
  finish();
}

/* ---------- resultado ---------- */
function finish(){
  clearInterval(timerId);
  const s = store.session;
  if (s.mode === "sim") s.ids.forEach(n => { if (s.ans[n] !== undefined) record(n, s.ans[n] === byN.get(n)[4]); });
  store.session = null; save();
  results(s);
}
function results(s){
  let ok=0, bad=0, blank=0; const wrongIds = [];
  s.ids.forEach(n => { const a = s.ans[n]; if (a === undefined) blank++; else if (a === byN.get(n)[4]) ok++; else { bad++; wrongIds.push(n); } });
  const raw = ok - bad * s.pen;
  const nota = Math.max(0, 10 * raw / s.ids.length);
  const penTxt = s.pen ? ` · penalización ${s.pen===0.25?"−1/4":"−1/3"} por error` : "";
  const items = s.ids.filter(n => s.ans[n] !== byN.get(n)[4]).map(n => {
    const q = byN.get(n); const a = s.ans[n];
    return `<div class="ritem"><span class="qmeta">Pregunta <span class="num">${n}</span> · Tema ${q[1]}</span><p class="q">${h(q[2])}</p>
      ${a!==undefined?`<p class="a bad">Tu respuesta: ${L[a]} · ${h(q[3][a])}</p>`:`<p class="a" style="color:var(--muted)">En blanco</p>`}
      <p class="a ok">Correcta: ${L[q[4]]} · ${h(q[3][q[4]])}</p></div>`;
  }).join("");
  app.innerHTML = `
    <header><div class="eyebrow">${s.mode==="sim"?"Simulacro":"Práctica"} terminado</div>
      <div class="score"><b class="num">${nota.toFixed(2).replace(".",",")}</b><span class="sub">sobre 10${penTxt}</span></div></header>
    <section class="panel"><div class="summary">
      <div><b style="color:var(--ok)">${ok}</b><span>aciertos</span></div>
      <div><b style="color:var(--bad)">${bad}</b><span>fallos</span></div>
      <div><b>${blank}</b><span>en blanco</span></div></div>
      ${s.mode==="sim"?`<span class="note num">Tiempo: ${Math.floor(s.elapsed/60)} min ${s.elapsed%60} s</span>`:""}</section>
    <div class="nav">
      <button class="ghost" id="home">Volver al inicio</button>
      <button class="primary" id="retry" ${wrongIds.length?"":"disabled"}>Repetir las ${wrongIds.length} falladas</button>
    </div>
    ${items ? `<section class="panel"><h2>Para repasar</h2><div class="review">${items}</div></section>` :
      `<section class="panel"><b>Todo correcto.</b></section>`}`;
  app.querySelector("#home").onclick = home;
  app.querySelector("#retry").onclick = () => {
    store.session = {ids: shuffle(wrongIds.slice()), ans:{}, i:0, mode:"prac", pen:s.pen, limit:0, elapsed:0};
    save(); quiz();
  };
  window.scrollTo(0,0);
}

home();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
